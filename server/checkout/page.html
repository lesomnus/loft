<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>결제 · Loft</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{.Style}}">
<script src="{{.Paddle}}"></script>
<script src="{{.Script}}" defer></script>
</head>
<body>
<main id="checkout" data-environment="{{.Environment}}" data-token="{{.Token}}">
<h1>결제</h1>
{{- if .Transaction}}
<p id="said" role="status">결제창을 여는 중입니다…</p>
<noscript><p>결제창은 자바스크립트로 열립니다. 자바스크립트를 켜고 이 페이지를 다시 여세요.</p></noscript>
{{- else}}
<p id="said" role="status">여기서 결제할 것이 없습니다. 결제할 것이 있으면 받은 결제 링크로 여세요.</p>
{{- end}}
{{- if .Ours}}
<p><a href="/billing">결제 화면으로</a></p>
{{- else}}
<p><a href="/">처음으로</a></p>
{{- end}}
</main>
</body>
</html>
