name: ci

on:
  push:
    branches: [main]
  pull_request:

# To read the checkout, and nothing else, unless a job says otherwise -- and
# one does, `image`, which runs on `main` alone. Said here rather than left to
# the repository's default, which is a setting nobody reviews.
permissions:
  contents: read

# Every job names its image rather than `ubuntu-latest`, so that the runner
# moves when this file says so and not on GitHub's schedule (loft#57).
#
# And every action is named by the commit its version had when it was written
# here, with that version after it: a tag is moved by whoever can push to the
# action's repository, so a tag is code this file has never seen -- and
# `image` hands one of them the token that pushes. Renovate moves the commit
# and the comment together (`helpers:pinGitHubActionDigests`, in payday's
# preset).
jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first -- `vuln` -- saved
          # it, and every job built loft from cold on what govulncheck left.
          cache: false
      # What the `go` job compiled last time: every package and every test,
      # which is what the other jobs build a part of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: generated code matches the schema
        run: go tool pd gen --check .
      # pd doctor holds the Node the page is built with to payday's floor:
      # the one the `ui` job builds the page with, rather than whichever the
      # runner's image has.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # What would go wrong before it does (a layer that cannot join a
      # transaction, a column that names an event and does not say so, ...).
      # pd doctor fails only what stops a generation and passes its advice,
      # so scripts/doctor.sh fails whatever it says that is not known there.
      - name: what pd doctor says, but what is known
        run: scripts/doctor.sh
      - name: vet
        run: go vet ./...
      - name: test on SQLite
        run: go test ./...
      # Saved by this job alone, the one that compiles all of it, for every
      # job of the next run to restore.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The suite again, on the PostgreSQL a deployment runs, the official image
  # (pdtest.DB). A job of its own beside `go` rather than a step after its
  # SQLite run: it is the longest part of the suite -- every test makes a
  # schema of its own and migrates it, one test at a time -- and it needs
  # nothing that run makes.
  postgres:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Started first, so that it is up by the time the tests are built.
      - name: PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=loft -e POSTGRES_PASSWORD=loft -e POSTGRES_DB=loft postgres:18
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first -- `vuln` -- saved
          # it, and every job built loft from cold on what govulncheck left.
          cache: false
      # A cache of its own, beside the `go` job's: what it keeps of a run is
      # the tests' results on PostgreSQL, so that a package nothing changed in
      # is not tested again. Until it has saved one, the `go` job's has what
      # is compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-postgres-${{ runner.os }}-
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: PostgreSQL is up
        run: |
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U loft && exit 0; sleep 1; done
          docker logs postgres; exit 1
      - name: test on PostgreSQL
        env:
          PDTEST_POSTGRES: postgres://loft:loft@localhost:5432/loft?sslmode=disable
        run: go test ./...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # A deployment with data in it, brought up to this build (scripts/upgrade.sh,
  # #144): the build this one comes after -- the pull request's base, or what
  # `main` was before this push -- makes a workspace and its demo, and this one
  # migrates them, on SQLite and on PostgreSQL. Every other test starts from an
  # empty database, which takes any column the schema adds; a column with no
  # default cannot be added to a table with rows in it, and only this says so.
  #
  # And from the oldest build a deployment still runs, beside it: a migration
  # from the build just before is one step, and a deployment that skipped some
  # takes several at once -- on SQLite a table the schema changes is made
  # again, and a step's own data, read after that, is not there (loft#163's
  # contract terms, found going from staging's build). It costs a second old
  # build, from its own modules, a minute or two of this job. Moved forward
  # when no deployment runs it any more.
  #
  # Except across the rename from rove to loft, which broke compatibility
  # once, on purpose (the owner's decision of 2026-10-31): a build from before
  # it is told through ROVE_* and keeps what it made under the old names --
  # its tables, its spin leases, the roster directory and holder it acts as,
  # its search indexes -- none of which this one reads. Staging was made again
  # from nothing rather than migrated. Such a build has no ./cmd/loft, so it is
  # not built, and the step that would migrate what it made says why and does
  # nothing. Every build after the rename has ./cmd/loft, and is migrated as
  # before.
  upgrade:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Started first, so that it is up by the time loft is built.
      - name: PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=loft -e POSTGRES_PASSWORD=loft -e POSTGRES_DB=loft postgres:18
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The `go` job's cache, as the other jobs restore it.
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: this build, the one it comes after, and the oldest a deployment runs
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Staging's (loft#99), 93a6bef.
          OLDEST: 93a6bef0c67d4717bea6692c255b3fd369c54322
        run: |
          go build -o "${RUNNER_TEMP}/loft-now" ./cmd/loft
          # old NAME COMMIT: the build at COMMIT, as loft-NAME -- or, for one
          # from before the rename, nothing built and a notice of why.
          old() {
            git worktree add --detach "${RUNNER_TEMP}/$1" "$2"
            if [ -d "${RUNNER_TEMP}/$1/cmd/loft" ]; then
              (cd "${RUNNER_TEMP}/$1" && go build -o "${RUNNER_TEMP}/loft-$1" ./cmd/loft)
            else
              echo "::notice title=upgrade::$1 is $2, from before the rename from rove to loft (2026-10-31), which broke compatibility once on purpose: not built, and nothing it makes is migrated"
            fi
          }
          old before "${BEFORE}"
          old oldest "${OLDEST}"
      - name: PostgreSQL is up
        run: |
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U loft && exit 0; sleep 1; done
          docker logs postgres; exit 1
      - name: what the build before made, migrated by this one
        env:
          UPGRADE_POSTGRES: postgres://loft:loft@localhost:5432
        run: |
          if [ ! -x "${RUNNER_TEMP}/loft-before" ]; then
            echo "The build before is from before the rename from rove to loft. The rename (the owner's decision, 2026-10-31) broke compatibility once, so what it makes is not migrated: staging is made again from nothing." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          docker exec postgres psql -U loft -qc 'create database upgrade_loft' -c 'create database upgrade_roster'
          scripts/upgrade.sh "${RUNNER_TEMP}/loft-before" "${RUNNER_TEMP}/loft-now"
      - name: what the oldest build a deployment runs made, migrated by this one
        env:
          UPGRADE_POSTGRES: postgres://loft:loft@localhost:5432
        run: |
          if [ ! -x "${RUNNER_TEMP}/loft-oldest" ]; then
            echo "The oldest build a deployment runs (OLDEST) is from before the rename from rove to loft. The rename (the owner's decision, 2026-10-31) broke compatibility once, so what it makes is not migrated: staging is made again from nothing, and OLDEST moves to a build after the rename once it is." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # The step before made these, unless it had no build to run.
          docker exec postgres psql -U loft -qc 'drop database if exists upgrade_loft' -c 'drop database if exists upgrade_roster' \
            -c 'create database upgrade_loft' -c 'create database upgrade_roster'
          scripts/upgrade.sh "${RUNNER_TEMP}/loft-oldest" "${RUNNER_TEMP}/loft-now"

  # Search on OpenSearch with nori (D31, deploy/opensearch): the image a
  # deployment runs, with its security plugin on -- TLS on the demo
  # certificates -- and Loft signed in with the role README says it needs,
  # which is how a permission it lacks shows up here rather than at an
  # operator's. The tests are the ones that ask for a cluster
  # (internal/opensearchtest); without one they skip.
  opensearch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Coming up while Go is set up (scripts/opensearch.sh).
      - name: OpenSearch with nori
        run: scripts/opensearch.sh start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first -- `vuln` -- saved
          # it, and every job built loft from cold on what govulncheck left.
          cache: false
      # What the `go` job compiled last time: every package and every test,
      # which is what the other jobs build a part of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: OpenSearch is up
        run: scripts/opensearch.sh ready 'lofttest-*' | grep '^PDTEST_' >> "${GITHUB_ENV}"
      - name: the tests that search
        run: |
          pkgs="$(go list -f '{{.ImportPath}} {{join .TestImports " "}} {{join .XTestImports " "}}' ./... | awk '{ for (i = 2; i <= NF; i++) if ($i == "github.com/lesomnus/loft/internal/opensearchtest") { print $1; break } }')"
          echo "${pkgs}"
          go test ${pkgs}
      - if: failure()
        run: docker logs opensearch 2>&1 | tail -100

  ui:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vite build

  # The deployment bundle (Dockerfile, deploy/compose) as an operator brings
  # it up: the image built, PostgreSQL, the migration, two `loft serve` behind
  # Caddy and the operator's entry point, search on OpenSearch and
  # workspaces' own domains as README turns them on -- and a workspace made,
  # signed in to and asked through the proxy, searched, listed at the entry
  # point, and served on a domain of its own. Nothing is pushed anywhere.
  bundle:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's Go build cache, as the `cluster` job left it, so that
      # compose's build compiles what changed and not all of loft.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gocache
          key: image-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('go.sum') }}-
            image-go-
      - name: the image's Go build cache, into the builder
        working-directory: .
        run: scripts/gocache.sh load "${RUNNER_TEMP}/gocache"
      - name: what an operator fills in, made up
        run: |
          cp .env.example .env
          sed -i -e "s/^LOFT_DOMAIN=.*/LOFT_DOMAIN=localhost/" \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
            -e "s/^LOFT_SIGNING_KEY=.*/LOFT_SIGNING_KEY=$(openssl rand -hex 32)/" \
            -e "s/^LOFT_VERSION=.*/LOFT_VERSION=ci/" .env
          mkdir -m 700 secrets
          openssl genpkey -algorithm ed25519 -out secrets/checkpoints.pem
          openssl rand -base64 32 > secrets/digest.key
          openssl rand -hex 32 > secrets/admin_key
          chmod 444 secrets/*
          # Search on, as README's "검색을 켜려면" turns it on, and
          # workspaces' own domains as "워크스페이스 도메인" does -- on Caddy's
          # own CA, since nothing here is reached for Let's Encrypt to ask.
          ./search-init.sh
          echo 'COMPOSE_FILE=compose.yaml:compose.search.yaml:compose.domains.yaml' >> .env
          sed -i -e "s/^LOFT_EDGE_OPTIONS=.*/LOFT_EDGE_OPTIONS=local_certs/" .env
      - run: docker compose up -d --build
      - name: it answers through the proxy
        run: |
          for i in $(seq 1 90); do curl -skf https://localhost/healthz && exit 0; sleep 2; done
          exit 1
      - name: a workspace, signed in to and asked
        run: |
          docker compose run --rm loft --config /etc/loft/loft.yaml init \
            --tenant acme --name ACME --login owner --person Owner --email owner@example.com --password owner-pass-1234
          curl -skf -c jar -H 'content-type: application/json' \
            -d '{"login":"owner","password":"owner-pass-1234"}' https://localhost/session
          # Each to whichever replica Caddy picks: a session is the database's.
          for i in 1 2 3 4; do
            curl -skf -b jar -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
              -d '{}' https://localhost/loft.PartyService/Me > /dev/null
          done
          curl -sf -H "authorization: Bearer $(cat secrets/admin_key)" \
            http://127.0.0.1:8081/admin/workspaces | grep -q '"alias":"acme"'
          docker run --rm loft:ci version
      - name: the trail's newest checkpoint, as its witness heard it
        run: |
          # Every start runs a pass, which ends in a checkpoint the witnesses
          # hear (payday#115): `store:` on a volume of its own, which a named
          # volume gives the image's user only because the image made the
          # directory. A witness that cannot hear stops nothing, so this is
          # where it would be seen.
          for i in $(seq 1 30); do
            if out="$(docker compose run --rm loft --config /etc/loft/loft.yaml trail verify 2>&1)"; then
              case "${out}" in *"heard by store:/var/lib/loft/witness: checkpoint "*) exit 0 ;; esac
            fi
            sleep 2
          done
          echo "${out}"
          exit 1
      - name: a search the engine answers
        run: |
          rpc() {
            curl -skf -b jar -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
              -d "$2" "https://localhost/loft.AssetService/$1"
          }
          rpc Add '{"name":"고성능GPU서버","kind":"item","tag":"SV-1"}' > /dev/null
          # A word with a particle on it, which the database's LIKE never
          # finds: found, it is nori's. A second or two, for the loop.
          for i in $(seq 1 30); do
            out="$(rpc Search '{"q":"서버를"}')"
            echo "${out}" | grep -q '고성능GPU서버' && exit 0
            sleep 1
          done
          echo "${out}"
          docker compose logs loft | grep search
          exit 1
      - name: a workspace's own domain, on a certificate taken on demand
        run: |
          # Added as its settings page adds it, and verified as its DNS would
          # be: the runner serves no DNS of its own.
          curl -skf -b jar -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
            -d '{"host":"assets.acme.test"}' https://localhost/loft.TenantDomainService/Add > /dev/null
          docker compose exec -T postgres psql -U loft -d loft -qc \
            "UPDATE tenantdomain SET state = 'active', verified_at = now() WHERE host = 'assets.acme.test'"
          # Served, on a certificate Caddy took once the entry point said
          # yes; and none for a host nobody verified.
          for i in $(seq 1 30); do
            out="$(curl -sk --max-time 10 --resolve assets.acme.test:443:127.0.0.1 https://assets.acme.test/healthz || true)"
            [ "${out}" = "ok" ] && break
            sleep 2
          done
          [ "${out}" = "ok" ] || { echo "the domain was not served: ${out}"; exit 1; }
          if curl -sk --max-time 10 --resolve nobody.acme.test:443:127.0.0.1 https://nobody.acme.test/healthz; then
            echo "a host nobody verified was given a certificate"
            exit 1
          fi
      - if: failure()
        run: docker compose ps -a && docker compose logs

  # What the Go vulnerability database says of the code this calls (loft#40):
  # a known issue in a module, or in the standard library this is built with,
  # that a path from here reaches. Red the day one is published, which is when
  # it is worth knowing -- but for what `accepted` names, each with why.
  vuln:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first -- `vuln` -- saved
          # it, and every job built loft from cold on what govulncheck left.
          cache: false
      # What the `go` job compiled last time: every package and every test,
      # which is what the other jobs build a part of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: govulncheck
        run: |
          # Nothing, since #77 brought otel/log v1 in through mkot, otx and
          # payday. An entry is an ID and a comment saying why it may wait.
          accepted=""

          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > vuln.json || true
          # A finding whose trace reaches a function is one this code calls;
          # the rest are in a package or module it only has.
          called="$(jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u)"
          left="$(comm -23 <(printf '%s\n' "${called}" | sed '/^$/d') <(printf '%s\n' ${accepted} | sort -u))"
          if [ -n "${left}" ]; then
            echo "called, and not accepted:"
            printf '  %s\n' ${left}
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || true
            exit 1
          fi
          echo "govulncheck: nothing called${accepted:+ but ${accepted}}"

  # The reference deployment on Kubernetes (deploy/k8s, loft#39): k3d, the
  # image this checkout builds, through the rig's overlay -- admitted under
  # `restricted`, signed in to through the ingress, the operator's entry point
  # reached by port-forward and by nothing else, and a new build rolled out
  # and back (scripts/cluster.sh says what each step is for).
  cluster:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release's own binary, held to the digest its checksums say,
      # rather than an installer that follows `main`.
      - name: k3d
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/k3d" https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  ${RUNNER_TEMP}/bin/k3d" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/k3d"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      # The image's Go build cache as the last run left it, so that building
      # the image compiles what changed and not all of loft: without it, each
      # build was 100 to 130 seconds of compiling (scripts/gocache.sh).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gocache
          key: image-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('go.sum') }}-
            image-go-
      - name: the image's Go build cache, into the builder
        run: scripts/gocache.sh load "${RUNNER_TEMP}/gocache"
      - run: ./scripts/cluster.sh
      # Saved by this job alone, as `go` saves its own: it builds the image on
      # every run, and `bundle` builds the same one.
      - name: the image's Go build cache, out of the builder
        if: always()
        run: scripts/gocache.sh save "${RUNNER_TEMP}/gocache"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/gocache
          key: image-go-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The main flows in a browser (ts/e2e, plan.md M3): headless Chromium on
  # the built page, against a loft built here that Playwright starts with
  # `init --demo` (ts/playwright.config.ts, ts/e2e/serve.sh) -- on SQLite, and
  # on the PostgreSQL a deployment runs, the `go` job's; and on SQLite
  # searching with OpenSearch (D31), beside the run that does not.
  #
  # The tests run in Playwright's own image, which has the browser and every
  # package of the system it needs, as README runs them on a desk that has
  # neither. The job used to install those packages itself, with apt
  # (`playwright install --with-deps`): 20 MB of fonts from the runner's
  # Ubuntu mirror, which took 18 seconds on most runs and more than ten
  # minutes on 18 of 321 (2026-10-24 to 26), at 28 kB/s -- and 15 of those
  # ran out of the job's fifteen minutes in it.
  e2e:
    name: e2e (${{ matrix.db }}${{ matrix.search && format(', {0}', matrix.search) || '' }})
    runs-on: ubuntu-26.04
    # A run takes about three minutes: one or so until the tests start and
    # two of tests, and up to two more when loft is built from cold. Ten is
    # a run that is stuck, not a slow one.
    timeout-minutes: 10
    strategy:
      # Each database is an answer of its own, and one failing says nothing
      # about the other.
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        search: [""]
        include:
          - db: sqlite
            search: opensearch
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image of the Playwright that ts/package-lock.json installs, so
      # that its browser is the one that version drives and a bump of it in
      # ts/package.json moves the image too: nothing here names a version.
      # And of the Ubuntu the runner is, so that what is built here runs in it.
      # Pulled in the background while the page and loft are built, as the
      # databases below come up.
      - name: Playwright's image
        working-directory: .
        run: |
          version="$(jq -er '.packages["node_modules/playwright-core"].version' ts/package-lock.json)"
          image="mcr.microsoft.com/playwright:v${version}-$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "PLAYWRIGHT_IMAGE=${image}" >> "${GITHUB_ENV}"
          docker pull -q "${image}" > "${RUNNER_TEMP}/playwright-pull.log" 2>&1 &
      # Started first and left to come up in the background, as PostgreSQL
      # is below: the image builds and the node starts while the page and
      # loft are built (scripts/opensearch.sh).
      - name: OpenSearch with nori
        if: matrix.search == 'opensearch'
        working-directory: .
        run: scripts/opensearch.sh start
      # As the `go` job has it, and started first, so that it is up by the
      # time the page and loft are built. The servers make their own
      # databases on it, fresh (ts/e2e/serve.sh).
      - name: PostgreSQL
        if: matrix.db == 'postgres'
        working-directory: .
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=loft -e POSTGRES_PASSWORD=loft -e POSTGRES_DB=loft postgres:18
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache is the one below, not setup-go's: setup-go keys it by
          # go.sum alone, so whichever job finished first -- `vuln` -- saved
          # it, and every job built loft from cold on what govulncheck left.
          cache: false
      # What the `go` job compiled last time: every package and every test,
      # which is what the other jobs build a part of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx vite build
      # Once, for every server the tests stand up; the issuer one of them
      # signs people in through (ts/e2e/issuer.sh); and the levyan one of them
      # bills to (ts/e2e/levyan.sh).
      - name: build loft
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/loft" ./cmd/loft
          go build -o "$RUNNER_TEMP/oidctest" ./internal/oidctest/cmd/oidctest
          go build -o "$RUNNER_TEMP/levyantest" ./internal/levyantest/cmd/levyantest
      # The pull the first step started: done by now, or joined here, or --
      # had it failed -- tried again, and its error said.
      - name: Playwright's image is here
        run: docker pull -q "${PLAYWRIGHT_IMAGE}"
      - name: PostgreSQL is up
        if: matrix.db == 'postgres'
        run: |
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U loft && exit 0; sleep 1; done
          docker logs postgres; exit 1
      - name: OpenSearch is up
        if: matrix.search == 'opensearch'
        working-directory: .
        run: scripts/opensearch.sh ready 'e2e-*' | grep '^E2E_' >> "${GITHUB_ENV}"
      # In Playwright's image, on the runner's network, where the databases,
      # the search and the servers the tests stand up are all on 127.0.0.1;
      # with the checkout and the binaries built above at the paths they have
      # here; and as the runner's user, so that what the servers and the
      # report leave in test-results/ is the runner's to upload. `--init`
      # and `--ipc=host` are what Playwright's guide asks of a container
      # running Chromium.
      - name: browser tests
        env:
          E2E_LOFT: ${{ runner.temp }}/loft
          E2E_ISSUER: ${{ runner.temp }}/oidctest
          E2E_LEVYAN: ${{ runner.temp }}/levyantest
          E2E_POSTGRES: ${{ matrix.db == 'postgres' && 'postgres://loft:loft@127.0.0.1:5432/loft?sslmode=disable' || '' }}
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -v "${RUNNER_TEMP}:${RUNNER_TEMP}" -w "${PWD}" \
            -e CI -e E2E_LOFT -e E2E_ISSUER -e E2E_LEVYAN -e E2E_POSTGRES -e E2E_OPENSEARCH -e E2E_OPENSEARCH_CA \
            "${PLAYWRIGHT_IMAGE}" npx playwright test
      # What a failure leaves: the report, with each failed test's trace and
      # screenshot, and each server's database and log (test-results/loft-*).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.db }}${{ matrix.search && format('-{0}', matrix.search) || '' }}
          path: |
            ts/playwright-report/
            ts/test-results/
          retention-days: 14

  # The image, last, and only once everything above is green -- as roster's
  # is: what is in the registry is what a deployment may run. Pushed from
  # `main` alone, since a branch that has not been merged is not that; the
  # `bundle` and `cluster` jobs already build it on every pull request.
  #
  # `:edge` moves with `main`. The digest it says in the run's summary is what
  # an overlay pins (deploy/k8s/README.md), so that a deployment changes when
  # its repository says so and not when somebody pushes here.
  #
  # Built from nothing, and not on the Go build cache `cluster` carries
  # between runs (scripts/gocache.sh): what a deployment runs is compiled
  # from the source alone, and nobody is waiting on this job.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, postgres, upgrade, opensearch, ui, bundle, vuln, cluster, e2e]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # ghcr.io/lesomnus/loft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The BuildKit that builds what is pushed, by its version and digest,
      # rather than the one the runner's Docker happens to carry that day: what
      # the builder is is part of what the image is made of, as the actions
      # are. Renovate moves it (`renovate.json`). The tests' builds -- `bundle`,
      # `cluster` -- stay on the runner's, since nothing they build is pushed.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The source label is what links the package to this repository on
      # GHCR, and the commit is the one `loft version` names beside `edge`.
      #
      # `:edge` only moves forward. Merges made one after another run side
      # by side and finish in any order, and the last to push won: a run of
      # an earlier merge put `:edge` back behind a later one (2026-10-17). So
      # a run whose commit is behind the one `:edge` holds pushes nothing --
      # asked right before the push, since the build takes minutes and a
      # later run may push meanwhile. Behind and not the head is the rule,
      # not "not the head of main": a later merge that failed its gates
      # pushes nothing either, and the one before it still should.
      - name: build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On that builder, and loaded into the runner's Docker, which pushes
          # it and reads its digest back as before.
          docker buildx build --load -t ghcr.io/lesomnus/loft:edge \
            --build-arg VERSION=edge \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} .
          held="$(docker buildx imagetools inspect ghcr.io/lesomnus/loft:edge \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          if [ -n "${held}" ] && [ "${held}" != "${GITHUB_SHA}" ]; then
            # Ahead, or diverged from a history rewritten, moves it; behind
            # does not. A compare that fails pushes, as before.
            how="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${held}...${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)"
            if [ "${how}" = "behind" ]; then
              echo "\`:edge\` holds ${held}, which ${GITHUB_SHA} is behind: nothing pushed" | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          docker push ghcr.io/lesomnus/loft:edge
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/lesomnus/loft:edge)"
          echo "pushed \`${digest}\` (${{ github.sha }})" | tee -a "${GITHUB_STEP_SUMMARY}"
