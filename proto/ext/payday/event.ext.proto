edition = "2023";

package payday;

// What Loft adds to payday's Event: `desc`, the sentence the event is said in
// when it is read -- in the reader's words, the workspace's zone, its people
// as they are called then (`server/domain/say.go`) -- which the feed answers
// with each event it reads (`EventService.Recent`). No row is written with
// one: an event keeps its message (payday#151), and is said from it.
//
// Not personal: what is said is made when it is read, and the access record
// of that call names whose names it read (design 8.2).
message Event {
  string desc = 6 [(payday.field) = {personal: false}];
}
