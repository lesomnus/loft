edition = "2023";

package payday;

// What loft adds to payday's Holder: the role it acts with.
//
// A string rather than an enum because the generated List filters only on
// scalars, and "who are the admins" is a list somebody asks for. The values
// are checked by the policy (server/policy): owner, admin, manager, member,
// auditor.
message Holder {
  // `member` when what makes the membership says no other. Not personal: who
  // made somebody an administrator is the record (payday#92).
  string role = 8 [(orm.field) = {default: "member"}, (payday.field) = {personal: false}];

  // When roster erased the holder this membership is -- the holder of the
  // tenant this deployment serves by the membership's own identifier (design
  // 9.10, D85) -- and so when it began to leave: it signs in nowhere from
  // then, and roster may still restore it within its grace. Null is a member
  // in good standing, or one roster restored. Written by the deployment from
  // what roster says (`server/lifecycle`), and by nobody else.
  google.protobuf.Timestamp date_leaving = 10 [(orm.field) = {nullable: true}];

  // The person's own choice not to be mailed what they are told of here: the
  // notifications still come, in the app. Theirs to set and nobody else's
  // (`NotificationService.SetMail`).
  bool mail_off = 11;
}
