edition = "2023";

package payday;

// What loft adds to payday's Holder: the role it acts with.
//
// A string rather than an enum because the generated List filters only on
// scalars, and "who are the admins" is a list somebody asks for. The values
// are checked by the policy (server/policy): owner, admin, manager, member,
// auditor.
message Holder {
  // Not personal: who made somebody an administrator is the record (payday#92).
  string role = 8 [(orm.field) = {default: "member"}, (payday.field) = {personal: false}];

  // The account this is a membership of: a holder at roster, in this
  // deployment's directory (design 9.10, D27). An account belongs to many
  // workspaces with one holder in each, every one its own row with its own
  // identifier, and what a session names is the account. Null on a holder made
  // before accounts were, which nobody signs in as until `loft identity
  // migrate` fills it.
  //
  // It is what a call is resolved by (`(payday.app).accounts`, payday#184),
  // so which account a membership is of is the deployment's to say: the
  // generated gate refuses it to a request, and what makes a membership --
  // an invitation accepted, a workspace made, a login given -- writes it
  // through the servers the deployment holds.
  bytes account = 9 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];

  // When roster erased the account this is a membership of, and so when it
  // began to leave: it signs in nowhere from then, and roster may still
  // restore it within its grace (design 9.10). Null is an account in good
  // standing, or one roster restored. Written by the deployment from what
  // roster says (`server/lifecycle`), and by nobody else.
  google.protobuf.Timestamp date_leaving = 10 [(orm.field) = {nullable: true}];

  // The person's own choice not to be mailed what they are told of here: the
  // notifications still come, in the app. Theirs to set and nobody else's
  // (`NotificationService.SetMail`).
  bool mail_off = 11;

  // The person record this was a membership of, kept from the moment a
  // stopped login takes the record's link to it away
  // (`PartyService.Deactivate`). A later 개인정보 삭제 of the record finds the
  // membership through it and forgets the membership's names and the trail's
  // copies of it too; through the record's link alone it found nothing
  // (loft#25, decided in loft#35). Null on a membership the record still
  // points at, and on one stopped before this was kept. Written by the
  // domain layer, and by nobody else.
  bytes party = 12 [
    (orm.field) = {
      type: TYPE_UUID
      nullable: true
    },
    (payday.field) = {stamped: true}
  ];

  // By account, then workspace: every call a session makes is resolved by it
  // (payday#184), and without one each would read every holder there is.
  // That an account is in a workspace once, among the holders still here, is
  // what the schema cannot say: `cli/pg.sql`'s `holder_account_once` does, on
  // PostgreSQL.
  option (orm.message) = {
    indexes: [
      {
        name: "by_account"
        refs: [
          {
            name: "account"
            number: 9
          },
          {
            name: "tenant"
            number: 2
          }
        ]
      }
    ]
  };
}
