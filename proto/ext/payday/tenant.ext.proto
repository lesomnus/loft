edition = "2023";

package payday;

// What rove adds to payday's Tenant: a workspace closing (D29, design 8.4), and
// the settings that are the workspace's own (#144) -- how long it keeps its
// history among them (design 8, D36).
//
// Closing destroys nothing. Nobody but the owner gets in -- and the owner only
// to restore it or take its data out -- until the restore window has run out
// and nothing holds it, when it is destroyed and its alias is held for a while
// so that nobody else can be that address to the people who knew it.
message Tenant {
  // When it was closed. Null is open.
  google.protobuf.Timestamp date_closed = 8 [(orm.field) = {nullable: true}];

  // Who closed it: `owner`, `operator`, or `deployment` when nobody was left
  // in it.
  string closed_by = 9 [(payday.field) = {personal: false}];
  // Why, in the words of whoever closed it: what `workspace.close` says as
  // its reason, and so personal as every reason is (payday#92). Taking that
  // reason out takes it out of here too (design D56).
  string close_reason = 10 [(payday.field) = {personal: true}];

  // When a workspace still closed and held by nothing is destroyed: when it
  // was closed and the restore window (`app.workspaces.restore_within`), or
  // whatever an operator made it since.
  google.protobuf.Timestamp date_destroy = 11 [(orm.field) = {nullable: true}];

  // The workspace's own settings (#144): what differs from one organization to
  // the next where it operates, and is its owner's to say. Empty is the
  // deployment's `app.locale`, or `app.no_show_after` -- and is what the
  // database fills a workspace that was there before them with, which is
  // why each says a default.
  //
  // Timezone is where a date said without a zone is: a file's dates, the time
  // in a notification, the date a sheet's cell means -- an IANA name, such as
  // Asia/Seoul. Stored times are UTC whatever it says.
  string timezone = 12 [(orm.field) = {default: ""}, (payday.field) = {personal: false}];

  // Currency is what a new purchase or work order is priced in when it says
  // nothing, ISO 4217, such as KRW. An amount keeps the currency it was
  // written in.
  string currency = 16 [(orm.field) = {default: ""}, (payday.field) = {personal: false}];

  // NoShowMinutes is how long after a room's reservation begins it is freed
  // when nobody checked in, in minutes. 0 is the deployment's; negative
  // holds nobody to checking in.
  int32 no_show_minutes = 17 [(orm.field) = {default: ""}];

  // How long the workspace keeps what it was and did, its owner's to say as
  // the rest of its settings (design 8, D36): what is kept is what is seen,
  // and nothing narrows a read to less of it.
  //
  // KeepDays is how long its history -- the time rows, the events, the
  // documents that are over -- is kept, in days, and the trail of the writes
  // that made it with it. 0 is forever. Only the deployment's switch,
  // `app.retention.apply`, lets it destroy anything.
  uint32 keep_days = 18 [(orm.field) = {default: ""}];

  // AccessKeepDays is how long its access record -- who read, wrote or took
  // out whose data in it -- is kept, in days (rove#136). 0 is the
  // deployment's `audit.by.access`, and none is below the deployment's floor,
  // `audit.by.access.min`: the floor is what the law the deployment is under
  // asks.
  uint32 access_keep_days = 19 [(orm.field) = {default: ""}];

  // RestoreDays is how long it may be restored once closed, in days, before it
  // is destroyed (D29). 0 is the deployment's `app.workspaces.restore_within`.
  // Read when it is closed: the date of its destruction then is what its
  // owner is told.
  uint32 restore_days = 20 [(orm.field) = {default: ""}];

  // What KeepDays and AccessKeepDays said before each was last made shorter,
  // and when. A shorter window waits out the deployment's grace
  // (`app.retention.grace`) from then, keeping the longer one meanwhile, so a
  // mistake undone in time has destroyed nothing. Unset is nothing waiting.
  uint32 keep_days_before = 21 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_keep_shortened = 22 [(orm.field) = {nullable: true}];
  uint32 access_keep_days_before = 23 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_access_keep_shortened = 24 [(orm.field) = {nullable: true}];
}
