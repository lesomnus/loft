edition = "2023";

package loft;

import "loft/catalog.proto";

option go_package = "github.com/lesomnus/loft";

service AssetTypeService {
  rpc Update(AssetTypeUpdateRequest) returns (AssetType);
}

message AssetTypeUpdateRequest {
  AssetTypeRef ref = 1;
  string name = 2 [features.field_presence = IMPLICIT];
  string desc = 3 [features.field_presence = IMPLICIT];
  bytes parent_id = 4 [features.field_presence = IMPLICIT];
  bool parent_null = 5 [features.field_presence = IMPLICIT];
  string kind = 6 [features.field_presence = IMPLICIT];
  TypeSpec spec = 7;
}

service ItemModelService {
  rpc Update(ItemModelUpdateRequest) returns (ItemModel);
  // Search finds models by what a person types: a name, who makes it, a
  // code, what it is a model of. A deployment that names a search engine
  // asks it (D31, loft#91).
  rpc Search(ItemModelSearchRequest) returns (ItemModelSearchResponse);
}

message ItemModelSearchRequest {
  string q = 1 [features.field_presence = IMPLICIT];
  // Only models of this type.
  AssetTypeRef type = 2;
  uint32 size = 3 [features.field_presence = IMPLICIT];
  uint32 offset = 4 [features.field_presence = IMPLICIT];
}

message ItemModelSearchResponse {
  repeated ItemModel items = 1;
  uint32 total = 2 [features.field_presence = IMPLICIT];
}

message ItemModelUpdateRequest {
  ItemModelRef ref = 1;
  string name = 2 [features.field_presence = IMPLICIT];
  string desc = 3 [features.field_presence = IMPLICIT];
  string maker = 4 [features.field_presence = IMPLICIT];
  string code = 5 [features.field_presence = IMPLICIT];
  AssetTypeRef type = 6;
  bool type_null = 7 [features.field_presence = IMPLICIT];
  ModelSpec spec = 8;
}
