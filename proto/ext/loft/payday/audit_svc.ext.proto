edition = "2023";

package loft;

import "loft/payday/audit.proto";

option go_package = "github.com/lesomnus/loft";

service AuditService {
  // Recent answers the newest trail rows first, for a person reading what
  // happened lately, a page at a time.
  rpc Recent(AuditRecentRequest) returns (AuditRecentResponse);
}

message AuditRecentRequest {
  uint32 size = 1 [features.field_presence = IMPLICIT];
  // Was `before`, a time to read on from: a line is stamped to the
  // microsecond, lines written together can share one, and a page that ended
  // inside one went on past the rest of it.
  reserved 2;
  reserved before;
  // Where the page before ended (`next`), for the page after it.
  string after = 3 [features.field_presence = IMPLICIT];
}

message AuditRecentResponse {
  repeated Audit items = 1;
  // What to send as `after` for the page after this one; empty is none.
  string next = 2 [features.field_presence = IMPLICIT];
}
