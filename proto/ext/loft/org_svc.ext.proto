edition = "2023";

package loft;

import "google/protobuf/timestamp.proto";
import "loft/org.proto";
import "loft/payday/holder.proto";
import "loft/payday/tenant.proto";
import "payday.proto";

option go_package = "github.com/lesomnus/loft";

service PartyService {
  // Me answers who is calling: the account, the person it is, the tenant and
  // the role.
  rpc Me(PartyMeRequest) returns (PartyMeResponse);
  // Update changes a party's own fields.
  rpc Update(PartyUpdateRequest) returns (Party);
  // Invite gives a person a login: a holder, a password, and the role.
  rpc Invite(PartyInviteRequest) returns (PartyInviteResponse);
  rpc SetRole(PartySetRoleRequest) returns (Party);
  // SetPassword changes the caller's own password, or -- for an admin --
  // somebody else's.
  rpc SetPassword(PartySetPasswordRequest) returns (PartySetPasswordResponse);
  // Deactivate ends a person's login and keeps the person.
  rpc Deactivate(PartyDeactivateRequest) returns (Party);
  // Pseudonymize answers a request to forget a person (design 8.2).
  rpc Pseudonymize(PartyPseudonymizeRequest) returns (Party);
  // Search finds people, teams, organizations and vendors by what a person
  // types: a name or part of it, a code, the team one is in. A deployment
  // that names a search engine asks it (D31, loft#91).
  rpc Search(PartySearchRequest) returns (PartySearchResponse);
}

message PartySearchRequest {
  string q = 1 [features.field_presence = IMPLICIT];
  // person | team | org | vendor
  string kind = 2 [features.field_presence = IMPLICIT];
  uint32 size = 3 [features.field_presence = IMPLICIT];
  uint32 offset = 4 [features.field_presence = IMPLICIT];
}

message PartySearchResponse {
  repeated Party items = 1;
  uint32 total = 2 [features.field_presence = IMPLICIT];
}

message PartyMeRequest {}

message PartyMeResponse {
  Holder holder = 1;
  Party party = 2;
  Tenant tenant = 3;
  string role = 4 [features.field_presence = IMPLICIT];

  // Were where the tenant's view window began, and how many days back: what
  // is kept is what is seen now (D36).
  reserved 5, 6;
  reserved history_since, history_days;

  // Whether logins and passwords are made and changed here -- the roster in
  // this process -- or at a roster of its own, by whoever administers the
  // tenant there (design 9.10).
  bool accounts_here = 7 [features.field_presence = IMPLICIT];
  // Where the account itself is managed at roster -- how it signs in, and
  // deleting it where its directory offers that -- for a roster of its own
  // (`auth.roster.account_url`). Empty is no such page.
  string account_url = 8 [features.field_presence = IMPLICIT];

  // Where the workspace is, as the server tells it (#144): the zone its dates
  // are told in, an IANA name, and the currency a new amount is priced in --
  // the workspace's own, or the deployment's where it says none.
  string timezone = 9 [features.field_presence = IMPLICIT];
  string currency = 10 [features.field_presence = IMPLICIT];
  // How many days a closed workspace may be restored in (#144): its own, or
  // the deployment's where it says none.
  uint32 restore_days = 11 [features.field_presence = IMPLICIT];
  // And how many days its address is then kept from anybody else: the
  // deployment's `app.workspaces.alias_hold`.
  uint32 alias_hold_days = 12 [features.field_presence = IMPLICIT];

  // What the workspace is called, as the server tells it (D57): its own name,
  // or, for one that has none -- the workspace an account is given when it
  // arrives -- "<이름>의 워크스페이스" after its first owner, named as they are
  // called now. `tenant.name` is what the row holds, and holds nobody's name.
  string workspace_name = 13 [features.field_presence = IMPLICIT];

  // Whether levyan restricts the workspace now, as this deployment's copy of
  // its grants says (`loft.restricted`, design 7.5): what every member's
  // page says above it -- that what grows what it is billed by is refused
  // until its billing is settled (design 7.9). Never on a deployment that
  // bills nobody.
  bool restricted = 14 [features.field_presence = IMPLICIT];
  // Whether levyan makes the workspace read-only now, as the copy says
  // (`loft.readonly`, design 7.10): the second stage, which every member's
  // page says above it -- that it is read, taken out, paid for and closed,
  // and changed in nothing else until it is paid. Never on a deployment
  // that bills nobody.
  bool readonly = 15 [features.field_presence = IMPLICIT];
}

message PartyUpdateRequest {
  PartyRef ref = 1;
  string name = 2 [features.field_presence = IMPLICIT];
  string desc = 3 [features.field_presence = IMPLICIT];
  string kind = 4 [features.field_presence = IMPLICIT];
  bytes parent_id = 5 [features.field_presence = IMPLICIT];
  bool parent_null = 6 [features.field_presence = IMPLICIT];
  string email = 7 [features.field_presence = IMPLICIT];
  string phone = 8 [features.field_presence = IMPLICIT];
  string code = 9 [features.field_presence = IMPLICIT];
  map<string, string> labels = 10;
}

message PartyInviteRequest {
  PartyRef ref = 1;
  // The name the person signs in with: lowercase letters, digits, hyphens.
  string alias = 2 [features.field_presence = IMPLICIT];
  string role = 3 [features.field_presence = IMPLICIT];
  // Empty: one is made up and answered once.
  string password = 4 [features.field_presence = IMPLICIT];
}

message PartyInviteResponse {
  Party party = 1;
  Holder holder = 2;
  // Only when it was made up here; it is not stored.
  string password = 3 [features.field_presence = IMPLICIT];
}

message PartySetRoleRequest {
  PartyRef ref = 1;
  string role = 2 [features.field_presence = IMPLICIT];
}

message PartySetPasswordRequest {
  // Empty: the caller's own.
  PartyRef ref = 1;
  string current = 2 [features.field_presence = IMPLICIT];
  string password = 3 [features.field_presence = IMPLICIT];
}

message PartySetPasswordResponse {}

message PartyDeactivateRequest {
  PartyRef ref = 1;
}

message PartyPseudonymizeRequest {
  PartyRef ref = 1;
}

// What an invitation is answered with, beside the generated Add and List,
// which the domain layer completes (`server/domain/invitation.go`).
//
// `Add`, `List` and `Revoke` are the workspace's, by somebody who runs it,
// served as their membership of it. `Inbox`, `Claim`, `Accept` and `Deny` are
// the account's own (payday#184): the account an invitation is addressed to
// is no member of the workspace yet, so they are served as the account, in no
// workspace, and a call made that way reaches these and nothing else. What
// each reads is said by the domain layer, not by the wall.
service InvitationService {
  // Revoke takes back an invitation nobody has answered.
  rpc Revoke(InvitationRevokeRequest) returns (Invitation);
  // Inbox is the invitations addressed to the caller's account, from every
  // workspace that sent one: the ones the account holds, and the ones sent to
  // an address roster holds as checked for it. A workspace's own are `List`.
  rpc Inbox(InvitationInboxRequest) returns (InvitationInboxResponse) {
    option (payday.method) = {account: {}};
  }
  // Claim makes the invitation a mail carried a code for the caller's: the
  // proof is reading that mailbox, for an account roster holds no checked
  // address of.
  rpc Claim(InvitationClaimRequest) returns (Invitation) {
    option (payday.method) = {account: {}};
  }
  // Accept makes the caller a member of the workspace, as what it says.
  rpc Accept(InvitationAcceptRequest) returns (Invitation) {
    option (payday.method) = {account: {}};
  }
  // Deny says no.
  rpc Deny(InvitationDenyRequest) returns (Invitation) {
    option (payday.method) = {account: {}};
  }
}

message InvitationRevokeRequest {
  InvitationRef ref = 1;
}

message InvitationInboxRequest {
  // `pending`, `accepted`, `denied`, `revoked` or `expired`; unset is
  // `pending`, the ones waiting for an answer.
  string state = 1;
  // At most this many, the newest first; zero is 200, which is also the most.
  uint32 size = 2 [features.field_presence = IMPLICIT];
}

message InvitationInboxResponse {
  repeated Invitation items = 1;
}

message InvitationClaimRequest {
  // The code the mail's link carried.
  string code = 1 [features.field_presence = IMPLICIT];
}

message InvitationAcceptRequest {
  InvitationRef ref = 1;
}

message InvitationDenyRequest {
  InvitationRef ref = 1;
}
