edition = "2023";

package loft;

import "loft/org.proto";
import "loft/payday/holder.proto";
import "loft/payday/tenant.proto";

option go_package = "github.com/lesomnus/loft";

service PartyService {
  // Me answers who is calling: the member, the person it is, the tenant and
  // the role.
  rpc Me(PartyMeRequest) returns (PartyMeResponse);
  // Update changes a party's own fields.
  rpc Update(PartyUpdateRequest) returns (Party);
  rpc SetRole(PartySetRoleRequest) returns (Party);
  // Pseudonymize answers a request to forget a person (design 8.2).
  rpc Pseudonymize(PartyPseudonymizeRequest) returns (Party);
  // LinkMember makes a person record the one a membership is, by hand
  // (D88): for a member whose first sign-in found none of the records an
  // address roster checked could be, or the wrong one. A membership that
  // was another record's leaves it.
  rpc LinkMember(PartyLinkMemberRequest) returns (Party);
  // UnlinkMember takes a person record's membership off it, by hand (D88):
  // the record keeps its history, and the membership is no record's until
  // one is linked to it.
  rpc UnlinkMember(PartyUnlinkMemberRequest) returns (Party);
  // Search finds people, teams, organizations and vendors by what a person
  // types: a name or part of it, a code, the team one is in. A deployment
  // that names a search engine asks it (D31, loft#91).
  rpc Search(PartySearchRequest) returns (PartySearchResponse);
}

message PartySearchRequest {
  string q = 1 [features.field_presence = IMPLICIT];
  // person | team | org | vendor
  string kind = 2 [features.field_presence = IMPLICIT];
  uint32 size = 3 [features.field_presence = IMPLICIT];
  uint32 offset = 4 [features.field_presence = IMPLICIT];
}

message PartySearchResponse {
  repeated Party items = 1;
  uint32 total = 2 [features.field_presence = IMPLICIT];
}

message PartyMeRequest {}

message PartyMeResponse {
  Holder holder = 1;
  Party party = 2;
  Tenant tenant = 3;
  string role = 4 [features.field_presence = IMPLICIT];

  // Where the member manages how they sign in at roster -- and deletes their
  // holder there, where the tenant offers that -- for a roster of its own
  // (`auth.roster.account_url`). Empty is no such page.
  string account_url = 8 [features.field_presence = IMPLICIT];
  // Where the tenant's administrators add and remove its members and give
  // them a way in: roster's user console (`auth.roster.console_url`, D87).
  // Empty is no such page.
  string console_url = 16 [features.field_presence = IMPLICIT];

  // Where the workspace is, as the server tells it (#144): the zone its dates
  // are told in, an IANA name, and the currency a new amount is priced in --
  // the workspace's own, or the deployment's where it says none.
  string timezone = 9 [features.field_presence = IMPLICIT];
  string currency = 10 [features.field_presence = IMPLICIT];
  // How many days a closed workspace may be restored in (#144): its own, or
  // the deployment's where it says none.
  uint32 restore_days = 11 [features.field_presence = IMPLICIT];

  // What the workspace is called, as the server tells it (D57): its own name,
  // or, for one that has none -- put up with no name, here or at roster --
  // "<이름>의 워크스페이스" after its first owner, named as they are called
  // now. `tenant.name` is what the row holds, and holds nobody's name.
  string workspace_name = 13 [features.field_presence = IMPLICIT];

  // Whether levyan restricts the workspace now, as this deployment's copy of
  // its grants says (`loft.restricted`, design 7.5): what every member's
  // page says above it -- that what grows what it is billed by is refused
  // until its billing is settled (design 7.9). Never on a deployment that
  // bills nobody.
  bool restricted = 14 [features.field_presence = IMPLICIT];
  // Whether levyan makes the workspace read-only now, as the copy says
  // (`loft.readonly`, design 7.10): the second stage, which every member's
  // page says above it -- that it is read, taken out and paid for, and
  // changed in nothing else until it is paid. Never on a deployment that
  // bills nobody.
  bool readonly = 15 [features.field_presence = IMPLICIT];
}

message PartyUpdateRequest {
  PartyRef ref = 1;
  string name = 2 [features.field_presence = IMPLICIT];
  string desc = 3 [features.field_presence = IMPLICIT];
  string kind = 4 [features.field_presence = IMPLICIT];
  bytes parent_id = 5 [features.field_presence = IMPLICIT];
  bool parent_null = 6 [features.field_presence = IMPLICIT];
  string email = 7 [features.field_presence = IMPLICIT];
  string phone = 8 [features.field_presence = IMPLICIT];
  string code = 9 [features.field_presence = IMPLICIT];
  map<string, string> labels = 10;
}

message PartySetRoleRequest {
  PartyRef ref = 1;
  string role = 2 [features.field_presence = IMPLICIT];
}

message PartyPseudonymizeRequest {
  PartyRef ref = 1;
}

message PartyLinkMemberRequest {
  // A person record of the workspace's that no membership is, and that was
  // not forgotten.
  PartyRef ref = 1;
  // A membership of the workspace's, which roster has.
  HolderRef holder = 2;
}

message PartyUnlinkMemberRequest {
  PartyRef ref = 1;
}
