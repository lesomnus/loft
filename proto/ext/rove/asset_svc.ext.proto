edition = "2023";

package rove;

import "google/protobuf/timestamp.proto";
import "rove/asset.proto";
import "rove/catalog_svc.g.proto";
import "rove/org_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

// What rove adds to the asset contract: the operations a person does with an
// asset, and the reads that answer "what was it then". Everything that changes
// an asset is one of these, or the generated Add and Erase the domain layer
// completes (design 6, D24).
service AssetService {
  // Move puts an asset inside another from a moment on: on a shelf, into a
  // computer, into a rack at a U position. Without `to` it takes it out of
  // wherever it was.
  rpc Move(AssetMoveRequest) returns (Asset);
  // SetAttributes changes what an asset is from a moment on: its name, status,
  // condition, type, model or any attribute.
  rpc SetAttributes(AssetSetAttributesRequest) returns (Asset);
  // Assign makes a party the owner, manager or custodian from a moment on, or
  // ends the role.
  rpc Assign(AssetAssignRequest) returns (Asset);
  // Relate adds or ends a logical relation: membership of a kit or a group.
  // (Not `Link`: an RPC named after an entity collides with the stack's
  // accessor for it.)
  rpc Relate(AssetRelateRequest) returns (Asset);
  // Correct fixes the past: a time row was wrong, or happened at another
  // time. The old row is superseded, never edited (design 3.3).
  rpc Correct(AssetCorrectRequest) returns (Asset);

  rpc Timeline(AssetTimelineRequest) returns (AssetTimelineResponse);
  // QueryAt answers an asset and everything inside it as it was at `at`, by
  // what is known now -- or by what was known at `known`, which is AsOf.
  rpc QueryAt(AssetQueryAtRequest) returns (AssetQueryAtResponse);
  rpc Diff(AssetDiffRequest) returns (AssetDiffResponse);
  rpc Search(AssetSearchRequest) returns (AssetSearchResponse);
  rpc Report(AssetReportRequest) returns (AssetReportResponse);

  // Export writes the register as a CSV, to read. Nothing reads one back: a
  // restore is of the workspace's own export, and a sheet that edited the
  // register by tag is gone (design D34). A CSV and never a workbook: rove
  // neither reads nor writes one (design 9.13).
  //
  // It is a download of the people the register names, so it says what it is
  // for, in `payday-reason-bin`, and is refused without (rove#136).
  rpc Export(AssetExportRequest) returns (AssetExportResponse);
  // Form writes the form bulk registration reads (ReadSheet): its header and
  // nothing of the register, so it is no download of anybody.
  rpc Form(AssetFormRequest) returns (AssetExportResponse);
  // ReadSheet reads a CSV in that form into the items an AddMany takes, and
  // says what it could not read, by line. It writes nothing. The page and
  // `rove register` read a sheet with it, so that the form is read in one
  // place and the two read it alike. A workbook is refused unopened: what
  // one person uploads is read in the process every workspace is served by,
  // and a workbook takes a library as large as Excel to read (design 9.13).
  rpc ReadSheet(AssetReadSheetRequest) returns (AssetReadSheetResponse);

  // Census is the register as it is now, counted (자산 현황, design 9.14): a
  // row each type, or each space, of how many there are in each status. The
  // database counts, so a workspace of a hundred thousand assets is read as
  // the few hundred rows it comes to. It names nobody.
  rpc Census(AssetCensusRequest) returns (AssetCensusResponse);
  // ExportCensus writes the census as a CSV, which names nobody and so is no
  // download of anybody (rove#136).
  rpc ExportCensus(AssetCensusRequest) returns (AssetExportResponse);
}

// What the completed Add takes beyond the row itself.
message AssetAddRequest {
  // When the asset started being what the request says: the initial facts
  // and placement are valid from here. Empty is now.
  google.protobuf.Timestamp since = 100;
  // A client-minted Event id, so that a retry is the same operation.
  bytes op = 101;
  string reason = 102;
  // Where it is, from `since`. Taken from here rather than from parent_id so
  // that a mode and a slot come with it.
  AssetRef to = 103;
  string mode = 104;
  // The type by its name, for a request that does not know its id. AddMany
  // finds it, and makes one when there is none and it is confirmed (design
  // 9.13); Add takes `type`.
  string type_name = 105;
  // The model by its name, and its maker when one is said: found as
  // `type_name` is, and made with the item's type when there is none.
  string model_name = 106;
  string maker = 107;
}

// What the completed AddMany is beyond the items: bulk registration, of new
// assets only (design 9.13, D34). It is one operation -- an event of its own,
// and one for each asset it makes -- all of it or nothing.
message AssetAddManyRequest {
  // Says what it would do, and does nothing.
  bool dry_run = 100 [features.field_presence = IMPLICIT];
  // A client-minted Event id, the operation's, so that a retry is the same one.
  bytes op = 101 [features.field_presence = IMPLICIT];
  string reason = 102 [features.field_presence = IMPLICIT];
}

message AssetAddManyResponse {
  // What stops it, by item. A dry run answers with them; anything else is
  // refused with them, and writes nothing.
  repeated AssetAddManyIssue issues = 100;
  // The tag each item has or is given, in the order of the items.
  repeated string tags = 101;
  // The types and models it makes, as they are named.
  repeated string new_types = 102;
  repeated string new_models = 103;
  // The operation's event, once it has happened.
  bytes event_id = 104 [features.field_presence = IMPLICIT];
}

message AssetAddManyIssue {
  // The item, by its place in the request.
  uint32 item = 1 [features.field_presence = IMPLICIT];
  // What of it: a field of AssetAddRequest, as `tag`, `to` or `type_name`.
  string field = 2 [features.field_presence = IMPLICIT];
  string message = 3 [features.field_presence = IMPLICIT];
}

message AssetMoveRequest {
  AssetRef ref = 1;
  // Where it goes. Absent: out of wherever it was.
  AssetRef to = 2;
  // located | installed | part
  string mode = 3 [features.field_presence = IMPLICIT];
  string slot = 4 [features.field_presence = IMPLICIT];
  int32 u_from = 5 [features.field_presence = IMPLICIT];
  int32 u_to = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 7;
  string reason = 8 [features.field_presence = IMPLICIT];
  bytes op = 9 [features.field_presence = IMPLICIT];
}

message AssetSetAttributesRequest {
  AssetRef ref = 1;
  // Keys: name, desc, status, condition, serial, tag, type, model, or an
  // attribute key. An empty value clears an attribute.
  map<string, string> set = 2;
  repeated string clear = 3;
  google.protobuf.Timestamp at = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
  // The kits and groups it leaves as it goes out of use -- with `status` set
  // to lost, retired or disposed, and refused otherwise. Its membership of
  // each ends in this operation, as a relation of its own this one is the
  // cause of (design D34), from `at`, or from now when it was made a member
  // after that; and the bookings of a kit let it go (design 4). One it is no
  // member of now is passed over.
  repeated AssetRef leave = 7;
}

message AssetAssignRequest {
  AssetRef ref = 1;
  // owner | manager | custodian
  string role = 2 [features.field_presence = IMPLICIT];
  // Absent ends the role.
  PartyRef party = 3;
  google.protobuf.Timestamp at = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message AssetRelateRequest {
  AssetRef ref = 1;
  AssetRef target = 2;
  // member_of | connected_to
  string kind = 3 [features.field_presence = IMPLICIT];
  bool required = 4 [features.field_presence = IMPLICIT];
  // End the relation instead of starting it.
  bool end = 5 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 6;
  string reason = 7 [features.field_presence = IMPLICIT];
  bytes op = 8 [features.field_presence = IMPLICIT];
}

message AssetCorrectRequest {
  AssetRef ref = 1;
  // The time row being corrected: a placement, stewardship, link or fact.
  bytes row_id = 2 [features.field_presence = IMPLICIT];
  // It never happened.
  bool retract = 3 [features.field_presence = IMPLICIT];
  // It happened, but from this moment instead.
  google.protobuf.Timestamp valid_from = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message AssetTimelineRequest {
  AssetRef ref = 1;
  // Also the rows later corrections superseded.
  bool superseded = 2 [features.field_presence = IMPLICIT];
  // As the system knew it then.
  google.protobuf.Timestamp known = 3;
  uint32 limit = 4 [features.field_presence = IMPLICIT];
}

message AssetTimelineResponse {
  repeated TimelineEntry entries = 1;
}

message TimelineEntry {
  // placement | fact | stewardship | link | event
  string kind = 1 [features.field_presence = IMPLICIT];
  bytes row_id = 2 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp valid_from = 3;
  google.protobuf.Timestamp valid_to = 4;
  google.protobuf.Timestamp recorded_at = 5;
  google.protobuf.Timestamp superseded_at = 6;
  // What it says, for a person.
  string summary = 7 [features.field_presence = IMPLICIT];
  // What it holds, field by field: a placement's mode, slot and rack
  // positions (`u`), a stewardship's role, a link's kind, whether it is
  // required and which end of it the asset is (`side`: `source`, the member
  // or the one connected, or `target`), a fact's key and value. An event's
  // is what its message held, under the names its domain's table gives the
  // fields (`rove/past.proto`): a row it names as the row is called now -- a
  // person by their name, and nothing else of theirs -- or as its identifier
  // where nothing names it, and a moment in the workspace's zone, as RFC 3339
  // writes one. A row from before Rove's past was payday's is what its
  // `payload` said.
  map<string, string> detail = 8;
  bytes event_id = 9 [features.field_presence = IMPLICIT];
  string event_kind = 10 [features.field_presence = IMPLICIT];
  string reason = 11 [features.field_presence = IMPLICIT];
  string actor = 12 [features.field_presence = IMPLICIT];
  bytes other_id = 13 [features.field_presence = IMPLICIT];
  string other_name = 14 [features.field_presence = IMPLICIT];
  // The operation this was part of, for a person, when it was one over many
  // things: what the event that wrote this was caused by (design D34).
  string cause = 15 [features.field_presence = IMPLICIT];
  // That operation's event: what the entries one operation wrote share,
  // also where `cause` is left empty for saying no more than the entry does.
  bytes cause_id = 16 [features.field_presence = IMPLICIT];
}

message AssetQueryAtRequest {
  AssetRef root = 1;
  google.protobuf.Timestamp at = 2;
  // AsOf: by what was recorded at this moment. Empty is what is known now.
  google.protobuf.Timestamp known = 3;
  // How deep under the root. Zero is everything.
  uint32 depth = 4 [features.field_presence = IMPLICIT];
}

message AssetQueryAtResponse {
  repeated AssetState items = 1;
}

// AssetState is one asset as it was at a moment.
message AssetState {
  bytes id = 1 [features.field_presence = IMPLICIT];
  bytes parent_id = 2 [features.field_presence = IMPLICIT];
  string mode = 3 [features.field_presence = IMPLICIT];
  string slot = 4 [features.field_presence = IMPLICIT];
  int32 u_from = 5 [features.field_presence = IMPLICIT];
  int32 u_to = 6 [features.field_presence = IMPLICIT];
  // name, status, condition, attr.<key> ... as they were.
  map<string, string> facts = 7;
  // role -> party id, and role -> party name.
  map<string, string> stewards = 8;
  map<string, string> steward_names = 9;
  uint32 depth = 10 [features.field_presence = IMPLICIT];
  string kind = 11 [features.field_presence = IMPLICIT];
  string tag = 12 [features.field_presence = IMPLICIT];
  bool existed = 13 [features.field_presence = IMPLICIT];
}

message AssetDiffRequest {
  AssetRef root = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message AssetDiffResponse {
  repeated AssetChange changes = 1;
}

message AssetChange {
  bytes id = 1 [features.field_presence = IMPLICIT];
  string tag = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
  // entered | left | moved | changed
  string what = 4 [features.field_presence = IMPLICIT];
  string field = 5 [features.field_presence = IMPLICIT];
  string before = 6 [features.field_presence = IMPLICIT];
  string after = 7 [features.field_presence = IMPLICIT];
}

message AssetSearchRequest {
  string q = 1 [features.field_presence = IMPLICIT];
  string kind = 2 [features.field_presence = IMPLICIT];
  string status = 3 [features.field_presence = IMPLICIT];
  AssetTypeRef type = 4;
  // Only what is inside this asset now, at any depth.
  AssetRef within = 5;
  uint32 size = 6 [features.field_presence = IMPLICIT];
  uint32 offset = 7 [features.field_presence = IMPLICIT];
  PartyRef custodian = 8;
}

message AssetSearchResponse {
  repeated Asset items = 1;
  uint32 total = 2 [features.field_presence = IMPLICIT];
}

message AssetReportRequest {
  // summary | custody | utilization | stock | work
  string kind = 1 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message AssetReportResponse {
  repeated ReportRow rows = 1;
}

message ReportRow {
  string group = 1 [features.field_presence = IMPLICIT];
  string key = 2 [features.field_presence = IMPLICIT];
  string label = 3 [features.field_presence = IMPLICIT];
  double value = 4 [features.field_presence = IMPLICIT];
  map<string, string> detail = 5;
}

message AssetExportRequest {
  // Was `template`, the form in place of the register: `Form` now, since the
  // one is a download of people and the other of nobody (rove#136).
  reserved 2;
  reserved template;
}

message AssetFormRequest {}

message AssetExportResponse {
  bytes data = 1 [features.field_presence = IMPLICIT];
  string content_type = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
}

message AssetReadSheetRequest {
  // A CSV, in UTF-8 or in the CP949 Korean Excel saves.
  bytes data = 1 [features.field_presence = IMPLICIT];
}

message AssetReadSheetResponse {
  // A row each, but for a row it could not read.
  repeated AssetAddRequest items = 1;
  // The sheet's line of each item, to say where an issue is.
  repeated uint32 lines = 2;
  repeated AssetReadSheetIssue issues = 3;
}

message AssetReadSheetIssue {
  // The sheet's line, counting the header as 1. Zero is the sheet as a whole:
  // a column it does not know, or none it needs.
  uint32 line = 1 [features.field_presence = IMPLICIT];
  string column = 2 [features.field_presence = IMPLICIT];
  string message = 3 [features.field_presence = IMPLICIT];
}

message AssetCensusRequest {
  // What a row is: `type`, an asset type; or `location`, the space things
  // are in -- the nearest one up from whatever holds them, so that a part in
  // a computer is counted in the computer's room. Empty is type.
  string by = 1 [features.field_presence = IMPLICIT];
  // What is counted: item, kit, group or space, one kind at a time, since a
  // kit's members and a pool's are items of their own. Empty is item.
  string kind = 2 [features.field_presence = IMPLICIT];
}

message AssetCensusResponse {
  // By type, by name, and what has none last; by location, as the tree
  // reads, outermost first, and what is in no space last.
  repeated AssetCensusRow rows = 1;
  // All of them.
  AssetCensusRow total = 2;
  // When it was counted.
  google.protobuf.Timestamp at = 3;
  // What it counted and by what, as the request said it or as it was taken.
  string by = 4 [features.field_presence = IMPLICIT];
  string kind = 5 [features.field_presence = IMPLICIT];
}

// AssetCensusRow is how many assets of a kind one type has, or one space
// holds, in each status.
message AssetCensusRow {
  // The type's or the space's: empty for what has no type, or is in no space.
  bytes id = 1 [features.field_presence = IMPLICIT];
  // As it is called now, and a space by its tag beside.
  string name = 2 [features.field_presence = IMPLICIT];
  string tag = 3 [features.field_presence = IMPLICIT];
  // The spaces a space is in, the outermost first.
  repeated string path = 4;
  // How many there are of each status -- ordered, active, in_repair, lost,
  // retired, disposed -- and none of a status nothing is in.
  map<string, uint32> statuses = 5;
  // All of them, whatever their status.
  uint32 total = 6 [features.field_presence = IMPLICIT];
  // A space's, with what the spaces in it hold: everything under it.
  uint32 within = 7 [features.field_presence = IMPLICIT];
}

service LabelService {
  // Print makes labels for the tenant's active label domain: new ones to bind
  // later, or one for each asset given, bound already.
  rpc Print(LabelPrintRequest) returns (LabelPrintResponse);
  rpc Bind(LabelBindRequest) returns (Label);
  rpc Unbind(LabelUnbindRequest) returns (Label);
  // Resolve reads what a scanned code names.
  rpc Resolve(LabelResolveRequest) returns (LabelResolveResponse);
}

message LabelPrintRequest {
  uint32 count = 1 [features.field_presence = IMPLICIT];
  string batch = 2 [features.field_presence = IMPLICIT];
  repeated bytes asset_ids = 3;
}

message LabelPrintResponse {
  repeated Label labels = 1;
  // The URL each label encodes, in the same order.
  repeated string urls = 2;
}

message LabelBindRequest {
  LabelRef ref = 1;
  AssetRef asset = 2;
  bytes op = 3 [features.field_presence = IMPLICIT];
}

message LabelUnbindRequest {
  LabelRef ref = 1;
  // Void the label as well: it is damaged or lost.
  bool void = 2 [features.field_presence = IMPLICIT];
}

message LabelResolveRequest {
  // What the scanner read: the URL, or the label id alone.
  string code = 1 [features.field_presence = IMPLICIT];
}

message LabelResolveResponse {
  Label label = 1;
  Asset asset = 2;
}

service TenantDomainService {
  // Verify checks the TXT record of a pending custom domain.
  rpc Verify(TenantDomainVerifyRequest) returns (TenantDomain);
  // Activate makes a verified domain the one new labels are printed with; the
  // active one before it becomes legacy and keeps resolving.
  rpc Activate(TenantDomainActivateRequest) returns (TenantDomain);
  rpc Retire(TenantDomainRetireRequest) returns (TenantDomain);
  // Status answers whether labels are on for this tenant, and with what.
  rpc Status(TenantDomainStatusRequest) returns (TenantDomainStatusResponse);
}

message TenantDomainAddRequest {
  // The label for a default subdomain; the host is made from it.
  string sub = 100;
}

message TenantDomainVerifyRequest {
  TenantDomainRef ref = 1;
}

message TenantDomainActivateRequest {
  TenantDomainRef ref = 1;
}

message TenantDomainRetireRequest {
  TenantDomainRef ref = 1;
  // Retire even though labels were printed with it.
  bool force = 2 [features.field_presence = IMPLICIT];
}

message TenantDomainStatusRequest {}

message TenantDomainStatusResponse {
  // Labels are always on now (rove#155): a tenant prints with its active
  // domain when it has one, and with the deployment's own address otherwise.
  // `labels` said whether they were, and `tenant_domains` whether a tenant
  // could have a domain at all, which every tenant now can.
  reserved 1, 5;
  reserved labels, tenant_domains;

  // The domain new labels print with, and that the app is on (an `app`
  // domain); none prints with `base`.
  TenantDomain active = 2;
  // The host a custom domain's CNAME has to point at.
  string target = 3 [features.field_presence = IMPLICIT];
  // The suffix a default subdomain gets; empty offers none.
  string default_suffix = 4 [features.field_presence = IMPLICIT];
  // What a label prints with when it has no domain to: `<base>/l/<code>`.
  string base = 6 [features.field_presence = IMPLICIT];
}

service AttachmentService {
  rpc Upload(AttachmentUploadRequest) returns (Attachment);
  // Url answers a short-lived signed address to download the file.
  rpc Url(AttachmentUrlRequest) returns (AttachmentUrlResponse);
}

message AttachmentUploadRequest {
  bytes subject_id = 1 [features.field_presence = IMPLICIT];
  string name = 2 [features.field_presence = IMPLICIT];
  string content_type = 3 [features.field_presence = IMPLICIT];
  bytes data = 4 [features.field_presence = IMPLICIT];
}

message AttachmentUrlRequest {
  AttachmentRef ref = 1;
}

message AttachmentUrlResponse {
  string url = 1 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp expires_at = 2;
}
