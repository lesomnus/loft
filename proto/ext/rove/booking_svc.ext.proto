edition = "2023";

package rove;

import "google/protobuf/timestamp.proto";
import "rove/asset_svc.g.proto";
import "rove/booking.proto";

option go_package = "github.com/lesomnus/rove";

service BookableService {
  rpc Update(BookableUpdateRequest) returns (Bookable);
  // Availability answers when resources are taken between two moments.
  rpc Availability(BookableAvailabilityRequest) returns (BookableAvailabilityResponse);
}

message BookableUpdateRequest {
  BookableRef ref = 1;
  string timezone = 2 [features.field_presence = IMPLICIT];
  OpeningHours hours = 3;
  bool hours_null = 4 [features.field_presence = IMPLICIT];
  int32 buffer_before = 5 [features.field_presence = IMPLICIT];
  int32 buffer_after = 6 [features.field_presence = IMPLICIT];
  bool approval = 7 [features.field_presence = IMPLICIT];
  int32 min_minutes = 8 [features.field_presence = IMPLICIT];
  int32 max_minutes = 9 [features.field_presence = IMPLICIT];
  int32 horizon_days = 10 [features.field_presence = IMPLICIT];
  uint32 units = 11 [features.field_presence = IMPLICIT];
  string exclusive_group = 12 [features.field_presence = IMPLICIT];
  bool enabled = 13 [features.field_presence = IMPLICIT];
}

message BookableAvailabilityRequest {
  repeated AssetRef resources = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message BookableAvailabilityResponse {
  repeated BusySpan busy = 1;
}

message BusySpan {
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp begins_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  // reservation | maintenance | override | waiting | closed
  string kind = 4 [features.field_presence = IMPLICIT];
  bytes ref_id = 5 [features.field_presence = IMPLICIT];
  uint32 units = 6 [features.field_presence = IMPLICIT];
  bool blocking = 7 [features.field_presence = IMPLICIT];
  string label = 8 [features.field_presence = IMPLICIT];
}

// What the completed Add takes beyond the reservation itself.
message ReservationAddRequest {
  repeated ReservationItemSpec items = 100;
  // Hold only: take the time for a few minutes while the rest is decided.
  bool hold = 101;
  bytes op = 102;
  // Book it again by this rule (RFC 5545): FREQ=WEEKLY;COUNT=4 and the like.
  string repeat = 103;
  // Book over a conflict, on purpose: the allocation does not block, and the
  // reason is required (design 4). A manager's to do.
  bool override = 104;
  string reason = 105;
}

message ReservationItemSpec {
  AssetRef resource = 1;
  uint32 units = 2 [features.field_presence = IMPLICIT];
}

service ReservationService {
  // Confirm turns a hold into a request or a confirmed reservation.
  rpc Confirm(ReservationDecideRequest) returns (Reservation);
  rpc Approve(ReservationDecideRequest) returns (Reservation);
  rpc Reject(ReservationDecideRequest) returns (Reservation);
  rpc Cancel(ReservationDecideRequest) returns (Reservation);
  rpc CheckIn(ReservationDecideRequest) returns (Reservation);
  rpc Complete(ReservationDecideRequest) returns (Reservation);
  // Calendar answers reservations touching a span, for one resource or all.
  rpc Calendar(ReservationCalendarRequest) returns (ReservationCalendarResponse);
  // Timeline answers a reservation's history, newest first: what was done
  // with it -- booked, decided, checked into, let go of -- and what it took
  // and let go of as what it booked changed, with the hand-overs that
  // fulfilled it, its pickup and its return. A member reads their own, and
  // whoever runs or audits the register anybody's (D45).
  rpc Timeline(ReservationTimelineRequest) returns (ReservationTimelineResponse);
  // Pickup answers what the pickup of a reservation is to hand out of each
  // pool it booked: as many of the pool's units as it holds, free until it
  // ends, and the others that may be handed out instead (design 4, D46). It
  // changes nothing: CustodyService.Add is the pickup.
  rpc Pickup(ReservationPickupRequest) returns (ReservationPickupResponse);
}

message ReservationTimelineRequest {
  ReservationRef ref = 1;
}

message ReservationTimelineResponse {
  // Each an event (`kind` is `event`), newest first: the reservation's own,
  // and those of the hand-overs that fulfilled it. What an operation over
  // many things did to it -- a change to a kit it booked, a series it is one
  // of booked or cancelled -- names that operation (`cause_id`), and says it
  // where the operation says more than the entry does (`cause`, design D34).
  repeated TimelineEntry entries = 1;
}

message ReservationPickupRequest {
  ReservationRef ref = 1;
}

message ReservationPickupResponse {
  repeated PoolPickup pools = 1;
}

// PoolPickup is what a pickup of a reservation hands out of a pool it booked:
// the pool's units, each of which is the reservation's from the pickup until
// it ends, in place of one of the pool's it holds.
message PoolPickup {
  // The pool, and how many of it the reservation holds: none while it waits
  // for what it booked.
  bytes pool_id = 1 [features.field_presence = IMPLICIT];
  uint32 units = 2 [features.field_presence = IMPLICIT];
  // The units it is to be handed, as many as it holds and as there are free
  // until it ends, in the order a person reads them -- by their tags -- and
  // the rest of the ones free until then, any of which may be handed out
  // instead: not out of use, not with anybody, and not taken then by
  // anything else, nor needed by the pools around it to keep what they
  // promised (D44).
  repeated bytes offered = 3;
  repeated bytes others = 4;
}

message ReservationDecideRequest {
  ReservationRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
  // Cancel the whole series it belongs to.
  bool series = 3 [features.field_presence = IMPLICIT];
}

message ReservationCalendarRequest {
  repeated AssetRef resources = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Only the caller's own.
  bool mine = 4 [features.field_presence = IMPLICIT];
  // Only the ones in these states: `requested` is what waits for a manager.
  repeated string statuses = 5;
}

message ReservationCalendarResponse {
  repeated CalendarEntry entries = 1;
}

message CalendarEntry {
  Reservation reservation = 1;
  repeated bytes resource_ids = 2;
  string party_name = 3 [features.field_presence = IMPLICIT];
  // What it waits for while it is still to be fulfilled: the members of a
  // kit it should take with it that something else holds then, and what it
  // booked of a pool that has fewer to give then (design 4).
  repeated ReservationConflict conflicts = 4;
  // What it takes that is out of use while it is still to be fulfilled:
  // what it booked, whatever it is, or an item a kit it booked takes with it,
  // kept in the kit as it went (design 4, D42, D43). Nothing hands it over,
  // and what it booked is not approved, confirmed or fulfilled.
  repeated ReservationOutOfUse out_of_use = 5;
}

// ReservationOutOfUse is what a reservation takes that is lost, retired or
// disposed, and is said until it is in use again or taken off its kit: what
// it booked itself, of any kind -- which it is then neither approved nor
// confirmed with, a space of which is not checked into and a kit or a group
// not picked up, and an item of which its pickup does not hand over -- or an
// item a kit it booked takes with it, held or waited for, which its pickup
// does not hand over (D42, D43). A pool's members are none of it: what a pool
// gives is the ones in use, and one fewer is a pool's conflict.
message ReservationOutOfUse {
  // What it is, by what it is tagged and called.
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  string resource_tag = 2 [features.field_presence = IMPLICIT];
  string resource_name = 3 [features.field_presence = IMPLICIT];
  // lost | retired | disposed
  string status = 4 [features.field_presence = IMPLICIT];
  // item | space | kit | group
  string resource_kind = 5 [features.field_presence = IMPLICIT];
}

// ReservationConflict is what a reservation booked, or should take with what
// it booked, and does not hold: a member of a kit, which the kit was given
// after the reservation was made and something else held then; or some of a
// pool, which had fewer to give since -- a member taken off it or out of use,
// one whose own time was taken -- than the reservations made before it hold.
// The reservation takes it once there is room.
message ReservationConflict {
  // The member, or the pool, by what it is tagged and called.
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  string resource_tag = 2 [features.field_presence = IMPLICIT];
  string resource_name = 3 [features.field_presence = IMPLICIT];
  // The time the reservation would take it for.
  google.protobuf.Timestamp begins_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // What holds it then -- another reservation, maintenance -- as a calendar
  // shows it: of a pool, its reservations and what takes its members' own
  // time. None once nothing does, and it is taken shortly.
  repeated BusySpan held_by = 6;
  // Of a pool: how many of it the reservation waits for, and how many of
  // them it could have at the busiest moment of that time. Both zero for a
  // member of a kit, which is one.
  uint32 units = 7 [features.field_presence = IMPLICIT];
  uint32 available = 8 [features.field_presence = IMPLICIT];
}
