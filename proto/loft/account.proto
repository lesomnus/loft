edition = "2023";

package loft;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/loft";

// TenantMembership is a workspace an account is in, as the account is told it
// (D73): what `TenantService.Mine` lists, `Create` makes, and
// `LabelService.Locate` finds a label in. It is the account's view of a
// membership, and no entity: the membership is a Holder, and the workspace a
// Tenant.
message TenantMembership {
  bytes id = 1;
  string alias = 2;
  // What it is called: its own name, or, for one that has none, after its
  // owner, as they are called now (D57) -- which showing is on the access
  // record, as a person's name is.
  string name = 3;
  // What the account is there: `owner`, `admin`, `manager`, `member` or
  // `auditor`.
  string role = 4;

  // When it was closed and when it goes unless it is restored, for one that
  // is closed (D29), and how many days its address is then held from anybody
  // else (`app.workspaces.alias_hold`).
  google.protobuf.Timestamp closed = 5;
  google.protobuf.Timestamp destroy = 6;
  uint32 alias_hold_days = 7;

  // Where its app is when that is a domain of its own (loft#155): the address
  // a page of it begins with there. Empty while it is the service's.
  string home = 8;
}
