edition = "2023";

package loft;

import "google/protobuf/timestamp.proto";
import "loft/ops.proto";
import "loft/payday/holder.proto";
import "loft/payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/loft";

// The operator's own services (D74, design 9.15): what an operator of the
// deployment does that is no entity's RPC. They are served by the operator's
// entry point alone (`loft-admin serve`, `server/admin`) and registered on no
// other server: the public one has none of them, and reads no operator's key.
// Where an entity's RPC is what an operator does -- `TenantService.Close`, a
// contract's `Add` -- the entry point serves that RPC instead, the same
// request, as the operator.
//
// Each is `Operator<X>Service`, X the name in the schema of what it is about:
// what a terminal mounts its methods under (`OperatorTenantService.Retired`
// is `tenant retired`).

// OperatorTenantService is what an operator does to a workspace from outside
// it, besides what `TenantService` serves them.
service OperatorTenantService {
  // Show is one workspace as an operator reads it: its row, who is in it,
  // its contracts and its legal holds, and what its own settings, its
  // contracts and its holds come to now.
  rpc Show(OperatorTenantShowRequest) returns (OperatorTenantShowResponse);

  // Retired is the workspaces that retired from this deployment, and what is
  // left of each: when it retired, and until when the deployment's floors
  // keep what it kept (`trail.Policy.Retired`). What an operator asked to
  // preserve a workspace's records reads first.
  rpc Retired(OperatorTenantRetiredRequest) returns (OperatorTenantRetiredResponse);

  // Retire takes a workspace out of the deployment, keeping what the
  // deployment's floors are on of its trail until they pass; Purge takes all
  // of it, what the floors are on too (payday#115). Each is the closing
  // sweep's destruction by an operator's hand (`closing.Destroy`): its rows,
  // its files, and its final reading for levyan. What it is at while it
  // works, and last what it took -- or, for a dry run, would.
  rpc Retire(OperatorTenantDestroyRequest) returns (stream OperatorTenantDestroyResponse);
  rpc Purge(OperatorTenantDestroyRequest) returns (stream OperatorTenantDestroyResponse);

  // Import restores the workspace from its signed export, into a deployment
  // that does not have it -- the one it was purged from, or another (D34) --
  // when it is the tenant at roster the deployment serves, at that tenant's
  // address (D86). The first message says how, and every other holds the
  // next of the export's bytes; the file is the caller's.
  rpc Import(stream OperatorTenantImportRequest) returns (OperatorTenantImportResponse);
}

// OperatorTenantRef is a workspace as an operator names it: by its
// identifier, or by its address. It is `TenantRef` on the wire, field for
// field; a file written by hand cannot import the contracts `pd gen` writes.
message OperatorTenantRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
  }
}

message OperatorTenantShowRequest {
  OperatorTenantRef ref = 1;
}

message OperatorTenantShowResponse {
  Tenant tenant = 1;

  // Its memberships, not erased, by alias.
  repeated Holder members = 2;

  // Its contracts, the latest in force first.
  repeated TenantContract contracts = 3;

  // Its legal holds, the newest first, lifted ones among them.
  repeated LegalHold holds = 4;

  // What its own settings, contracts and holds come to now.
  OperatorTenantWindow window = 5;
}

// OperatorTenantWindow is how long a workspace keeps what it keeps, as it
// stands now: its own settings (D36), the deployment's where it says none,
// and the floors and holds over both.
message OperatorTenantWindow {
  // Days its history is kept; 0 is forever.
  uint32 keep_days = 1;
  // A window made shorter waits out the grace: until when the longer one
  // holds, and the days it then becomes. Unset when nothing waits.
  google.protobuf.Timestamp date_keep_until = 2;
  uint32 keep_then_days = 3;

  // Days the trail keeps its access record -- the floor raising a shorter
  // one -- and the same for a shorter one waiting; 0 is forever.
  uint32 access_days = 4;
  google.protobuf.Timestamp date_access_until = 5;
  uint32 access_then_days = 6;

  // Days it may be restored once closed: its own, or the deployment's.
  uint32 restore_days = 7;

  // Whether destroying it takes its whole trail, what the deployment's
  // floors are on too, as its contract says; otherwise it retires.
  bool purge = 8;

  // Whether the deployment destroys anything by these windows at all
  // (`app.retention.apply`).
  bool apply = 9;
}

message OperatorTenantRetiredRequest {}

message OperatorTenantRetiredResponse {
  // The longest retired first.
  repeated OperatorTenantRetirement items = 1;
}

message OperatorTenantRetirement {
  bytes tenant = 1;
  // Its address: the tenant's at roster, for the one this deployment serves;
  // empty for any other.
  string alias = 2;
  google.protobuf.Timestamp date_retired = 3;
  // When the last of the deployment's floors passes for what it kept.
  google.protobuf.Timestamp date_kept_until = 4;
}

message OperatorTenantDestroyRequest {
  OperatorTenantRef ref = 1;
  // Say what it would take, and take nothing.
  bool dry_run = 2;
}

// OperatorTenantDestroyResponse is a message of a destruction: what it is at
// while it works, and last, what it took.
message OperatorTenantDestroyResponse {
  string progress = 1;
  OperatorTenantDestroyed destroyed = 2;
}

message OperatorTenantDestroyed {
  bytes tenant = 1;
  string alias = 2;
  bool dry_run = 3;

  // The rows taken, by table, and the files; the files that could not be
  // removed, which are no row's any more.
  map<string, uint32> rows = 4;
  uint32 files = 5;
  repeated string lost = 6;

  // What the trail's purge took: its rows in the database, alone and shared,
  // and its archived chunks.
  uint32 trail_removed = 7;
  uint32 trail_blanked = 8;
  uint32 trail_chunks = 9;

  // A retirement, which keeps what the deployment's floors are on, by kind,
  // until when the last of them passes.
  bool retired = 10;
  map<string, uint32> kept = 11;
  google.protobuf.Timestamp date_kept_until = 12;

  // For a deployment that bills (`bills`): why its final reading could not
  // be handed to levyan, which bills it by its last daily one -- empty when
  // it was; and that levyan is to be told it was destroyed (`tells`).
  bool bills = 15;
  string unmeasured = 16;
  bool tells = 17;

  // Whether its contract purges it -- what the other of Retire and Purge
  // does.
  bool contract_purges = 18;
}

message OperatorTenantImportRequest {
  oneof part {
    // The first message.
    OperatorTenantImportOptions options = 1;
    // Every other: the next of the export's bytes.
    bytes data = 2;
  }
}

message OperatorTenantImportOptions {
  // Say what it would put back, and put nothing back.
  bool dry_run = 3;
}

message OperatorTenantImportResponse {
  bytes tenant = 1;
  bool dry_run = 2;

  // The address it is at, which is the tenant's at roster (D86), and the
  // export's when that is another: the tenant was renamed there since.
  string alias = 3;
  string asked = 4;
  // It was closed when it was exported, and is open.
  bool reopened = 6;
  // It retired from here, and how many records of that the trail lifted
  // taking it back first.
  bool retired = 7;
  uint32 returned = 8;

  // The rows put back, by table; the files put back, and the ones its rows
  // name that the export did not have.
  map<string, uint32> rows = 9;
  uint32 files = 12;
  repeated string missing = 13;

  // The members this deployment's roster does not have, by alias: nobody
  // signs in as them until `loft identity link` makes them there.
  repeated string unlinked = 14;

  // The export's manifest and the key that signed it: keep the export, for
  // the trail it holds is not put back.
  string manifest = 15;
  string key = 16;

  // Once put back, what levyan grants it: `copied`, or why it is copied at
  // the next comparison; empty for a deployment that bills nobody.
  string grants = 18;
}

// OperatorTrailService is the trail, as the deployment's operator keeps it:
// its archive checked against the account the database keeps of it, the live
// rows checked against the trail, what an operator who looked accepts, what
// its erasures owe, and a workspace's trail taken out.
service OperatorTrailService {
  // Keys is the public keys the deployment signs with and trusts: what an
  // export of a workspace and a bundle of its trail are held to where they
  // are read -- with the operator, beside the file and the identity that
  // opens it, which never come here.
  rpc Keys(OperatorTrailKeysRequest) returns (OperatorTrailKeysResponse);

  // Verify compares the archive with its manifest and its checkpoints,
  // changing nothing (`trail.Policy.Verify`); `full` also reads every chunk
  // whole and checks its bytes. What it is at while it reads, and last what
  // it found, as one digest an acceptance of it names.
  rpc Verify(OperatorTrailVerifyRequest) returns (stream OperatorTrailVerifyResponse);

  // Accept makes the manifest say what the archive holds, once somebody has
  // looked (payday#115): of what a verification found and of nothing else --
  // `of`, the digest it said -- verified again, `full` when it was, and
  // refused when that finds anything else. Who accepts is the operator whose
  // key the call carries, kept with why in the checkpoint it ends in.
  rpc Accept(OperatorTrailAcceptRequest) returns (stream OperatorTrailAcceptResponse);

  // Rows checks the live rows against the digests the trail keeps of them,
  // changing nothing (`pd.Digests`, payday#102, #108): a row changed or
  // added past the servers, a line forged, a row the trail says is there and
  // is not.
  rpc Rows(OperatorTrailRowsRequest) returns (stream OperatorTrailRowsResponse);

  // AcceptRows puts what a check of the rows found on the trail as the act it
  // is -- the operator's, who looked and decided the rows are right -- of
  // what that check found (`of`) and of nothing else, and seals the rows from
  // before seals with it. A line forged and a key not given are not
  // accepted.
  rpc AcceptRows(OperatorTrailAcceptRowsRequest) returns (stream OperatorTrailAcceptRowsResponse);

  // Owed is what the trail's erasures still owe and since when, and what a
  // legal hold keeps of it, by workspace (payday#115).
  rpc Owed(OperatorTrailOwedRequest) returns (OperatorTrailOwedResponse);

  // Export takes a workspace's trail out, encrypted to whoever keeps it, for
  // a demand to preserve it (loft#153): every row of the trail that names the
  // workspace, in the database and in the archive, and a manifest the
  // deployment signs. A download, which says what it is for and names
  // everybody whose data it carries before its first byte. The first message
  // says what it is, the ones after hold its bytes, and the last what it
  // held.
  rpc Export(OperatorTrailExportRequest) returns (stream OperatorTrailExportResponse);
}

message OperatorTrailKeysRequest {}

message OperatorTrailKeysResponse {
  // The key the deployment signs with now (`audit.checkpoints.key`), PKIX
  // in DER; empty when it signs with none.
  bytes signer = 1;
  // And the ones it trusts besides (`audit.checkpoints.trust`).
  repeated bytes trusted = 2;
}

message OperatorTrailVerifyRequest {
  // Read every chunk whole, and check its bytes.
  bool full = 1;
}

// OperatorTrailVerifyResponse is a message of a verification: what it is at
// while it reads, and last what it found.
message OperatorTrailVerifyResponse {
  string progress = 1;
  OperatorTrailVerified verified = 2;
}

message OperatorTrailVerified {
  bool full = 1;
  // The manifest's rows, the archive's blobs, how many were read whole, and
  // the latest checkpoint compared.
  uint32 rows = 2;
  uint32 blobs = 3;
  uint32 hashed = 4;
  uint32 checkpoint = 5;
  // What an acceptance of these findings names.
  string digest = 6;
  // The acceptances before, newest first, and what each witness that
  // answers heard last, each as `verify` says it.
  repeated string accepted = 7;
  repeated string heard = 8;
  // What did not add up; none, when the archive is what the database says.
  repeated OperatorTrailFinding findings = 9;
}

message OperatorTrailFinding {
  string kind = 1;
  string said = 2;
}

message OperatorTrailAcceptRequest {
  // The digest the verification looked at said.
  string of = 1;
  // What was looked at and decided; it is kept.
  string why = 2;
  // The verification looked at was a full one.
  bool full = 3;
  // For a database restored from a backup, the checkpoint the backup holds:
  // 0 for one from before the first.
  int32 restored = 4 [features.field_presence = EXPLICIT];
}

message OperatorTrailAcceptResponse {
  string progress = 1;
  OperatorTrailAccepted accepted = 2;
}

message OperatorTrailAccepted {
  // Who accepted: the operator, by name.
  string by = 1;
  repeated OperatorTrailFinding findings = 2;
}

message OperatorTrailRowsRequest {}

message OperatorTrailRowsResponse {
  string progress = 1;
  OperatorTrailRowsChecked checked = 2;
}

message OperatorTrailRowsChecked {
  uint32 read = 1;
  uint32 matches = 2;
  // What a check finds: a row that differs from the digest of its newest
  // line, a line whose digest is not its own, a line with no digest, a row
  // nothing on the trail is about, a line under a key not given, and a row
  // the trail says is there and is not -- each a row, by its kind.
  repeated OperatorTrailRowFinding findings = 3;
  uint32 before_digests = 4;
  uint32 retired = 5;
  uint32 forgotten = 6;
  uint32 archived = 7;
  // The rows whose newest write sealed nothing, which an acceptance seals.
  uint32 unsealed = 8;
  // What an acceptance of these findings names.
  string digest = 9;
  // The keys the lines under a key not given were made under.
  repeated string unheld = 10;
  // What was not read, and why: the kinds kept off the trail.
  repeated OperatorTrailSkipped skipped = 11;
}

message OperatorTrailRowFinding {
  // differs, forged, no-digest, not-on-trail, key-not-held or missing.
  string what = 1;
  // The row's kind, by the name the schema gives it, and the row.
  string kind = 2;
  bytes id = 3;
}

message OperatorTrailSkipped {
  string kind = 1;
  string why = 2;
}

message OperatorTrailAcceptRowsRequest {
  // The digest the check looked at said.
  string of = 1;
  // What was looked at and decided; it is logged, as the trail keeps no
  // reason.
  string why = 2;
}

message OperatorTrailAcceptRowsResponse {
  string progress = 1;
  OperatorTrailRowsAccepted accepted = 2;
}

message OperatorTrailRowsAccepted {
  // The rows accepted as they are, the ones gone accepted as gone, and the
  // rows from before seals sealed.
  uint32 there = 1;
  uint32 gone = 2;
  uint32 sealed = 3;
}

message OperatorTrailOwedRequest {}

message OperatorTrailOwedResponse {
  // How many erasures are owed, and since when.
  uint32 objects = 1;
  google.protobuf.Timestamp date_oldest = 2;
  // What a legal hold keeps of them, by workspace.
  repeated OperatorTrailHeld held = 3;
}

message OperatorTrailHeld {
  bytes tenant = 1;
  // Its address, while it has one.
  string alias = 2;
  uint32 objects = 3;
}

message OperatorTrailExportRequest {
  // The workspace: its identifier, or its address -- a destroyed one's, as
  // the hold on it names it.
  string tenant = 1;
  // Whoever keeps it: age recipients, each as age reads one.
  repeated string to = 2;
}

// OperatorTrailExportResponse is a part of a trail's export: the first says
// what the file is called and holds none of it, the ones after hold its
// bytes, and the last what it holds.
message OperatorTrailExportResponse {
  string name = 1;
  bytes data = 2;
  OperatorTrailExported exported = 3;
}

message OperatorTrailExported {
  bytes tenant = 1;
  string alias = 2;
  // Its rows of the database and of the archive, the archive's chunks, and
  // the files.
  uint32 database = 3;
  uint32 archive = 4;
  uint32 chunks = 5;
  uint32 files = 6;
  // The manifest, signed by the deployment.
  string digest = 7;
  // The checkpoint it is held to, and who heard it; whether a chunk the
  // checkpoint does not list is in it.
  uint32 checkpoint = 8;
  string checkpoint_digest = 9;
  repeated string witnesses = 10;
  bool uncovered = 11;
  // A workspace that retired: when, and until when what it kept is kept.
  google.protobuf.Timestamp date_retired = 12;
  google.protobuf.Timestamp date_kept_until = 13;
  // How many people the access record says it carries.
  uint32 people = 14;
}

// OperatorSearchService is the search index, for a deployment that names an
// OpenSearch cluster (D31): what each index is, making it again, taking it
// out, and how it splits a text. A deployment that names none searches its
// database, has no index, and answers each FailedPrecondition.
service OperatorSearchService {
  // Status is what each index is -- of assets, parties and models -- against
  // what the database holds.
  rpc Status(OperatorSearchStatusRequest) returns (OperatorSearchStatusResponse);

  // Reindex makes each index again from the database, and points its alias
  // at it once it is whole: what it is at while it writes, and last what it
  // made. A reindex that stops leaves the alias where it was, and the next
  // deletes what it left.
  rpc Reindex(OperatorSearchReindexRequest) returns (stream OperatorSearchReindexResponse);

  // Remove deletes every index this deployment made, and the aliases with
  // them: for a deployment that stops searching with OpenSearch, and one that
  // wants nothing of its people left in a copy it does not keep.
  rpc Remove(OperatorSearchRemoveRequest) returns (OperatorSearchRemoveResponse);

  // Analyze is the words the index makes of a text: as a name is kept, and
  // as a search asks.
  rpc Analyze(OperatorSearchAnalyzeRequest) returns (OperatorSearchAnalyzeResponse);
}

message OperatorSearchStatusRequest {}

message OperatorSearchStatusResponse {
  repeated OperatorSearchIndex indexes = 1;
}

message OperatorSearchIndex {
  // What it is of: assets, parties, models.
  string name = 1;
  string alias = 2;
  // What the alias points at; empty is nothing yet.
  string index = 3;
  uint64 docs = 4;
  // The rows the database has of what it holds, not erased.
  uint64 held = 5;
  // The shape the index was made in, and the one this build makes.
  int32 version = 6;
  int32 built = 7;
  // What a reindex that stopped left behind, which the next deletes.
  repeated string others = 8;
}

message OperatorSearchReindexRequest {}

message OperatorSearchReindexResponse {
  string progress = 1;
  // One for each index, as it is made.
  OperatorSearchReindexed made = 2;
}

message OperatorSearchReindexed {
  string name = 1;
  string index = 2;
  string alias = 3;
  uint64 docs = 4;
  repeated string replaced = 5;
}

message OperatorSearchRemoveRequest {
  // Say what it would delete, and delete nothing.
  bool dry_run = 1;
}

message OperatorSearchRemoveResponse {
  // The indexes deleted, or that would be.
  repeated string indexes = 1;
}

message OperatorSearchAnalyzeRequest {
  string text = 1;
}

message OperatorSearchAnalyzeResponse {
  // The words, as a name is kept and as a search asks.
  repeated string kept = 1;
  repeated string asked = 2;
}

// OperatorRetentionService is what the keep windows take out of the history
// (design 8.2, 8.3), of every workspace or of one.
service OperatorRetentionService {
  // Plan is what a pass would take now, changing nothing: all of the work in
  // a transaction it then undoes, so that what it says is what a run would
  // take, to the row -- and what the trail's pass would take of the trail.
  // A message for each workspace.
  rpc Plan(OperatorRetentionRequest) returns (stream OperatorRetentionResponse);

  // Run takes it, when `app.retention.apply` says the deployment may, and
  // then the trail's pass on the same windows: what `serve` does every
  // `app.retention.every`.
  rpc Run(OperatorRetentionRequest) returns (stream OperatorRetentionResponse);
}

message OperatorRetentionRequest {
  // One workspace; every workspace when unset.
  OperatorTenantRef ref = 1 [features.field_presence = EXPLICIT];
}

message OperatorRetentionResponse {
  string progress = 1;
  OperatorRetentionTaken taken = 2;
  // Last: whether the deployment destroys by its windows at all
  // (`app.retention.apply`).
  bool apply = 3;
  bool last = 4;
}

message OperatorRetentionTaken {
  bytes tenant = 1;
  string alias = 2;
  bool dry_run = 3;
  // Where its window begins; unset is a window that keeps everything.
  google.protobuf.Timestamp date_before = 4;
  // What its legal holds are for: while there is one, nothing goes.
  repeated string held = 5;
  // What was over before the window, by kind, and the stored files that
  // could not be removed.
  map<string, uint32> taken = 6;
  repeated string lost = 7;
  // What the trail's pass would take of its trail, by kind (a plan alone).
  repeated OperatorRetentionTrail trail = 8;
}

message OperatorRetentionTrail {
  string kind = 1;
  uint32 archived = 2;
  uint32 discarded = 3;
  uint32 destroyed = 4;
}

// OperatorIdentityService is who the members are, which is roster's (design
// 9.10): each member made at roster who is not there, a member leaving now,
// and every member asked about again.
service OperatorIdentityService {
  // Link makes at roster every member of the workspace this deployment serves
  // whom roster does not have, by the identifier they have here (D85) -- the
  // members of a workspace restored from an export: on the roster in this
  // process, each with a password said once, and the tenant too when it is
  // not there; for a roster of its own, what its operator makes there. Run
  // again it makes nothing. A message for each member it is about, and last
  // what it came to.
  rpc Link(OperatorIdentityLinkRequest) returns (stream OperatorIdentityLinkResponse);

  // Depart is a member leaving the workspace now, rather than when roster's
  // grace is over -- for somebody who asked to be forgotten at once: their
  // person record pseudonymized, their membership ended, the workspace handed
  // on when they were its last owner. It cannot be undone.
  rpc Depart(OperatorIdentityDepartRequest) returns (OperatorIdentityDepartResponse);

  // Reconcile asks roster about every member, marks those it has nobody by as
  // leaving -- from now, so that they wait the whole grace -- and unmarks
  // those it has again: what a served deployment does every
  // `app.members.reconcile`, asked for now.
  rpc Reconcile(OperatorIdentityReconcileRequest) returns (OperatorIdentityReconcileResponse);
}

message OperatorIdentityLinkRequest {
  // Give everybody this one, for a deployment to try things on; empty makes
  // one up for each.
  string password = 1;
}

message OperatorIdentityLinkResponse {
  OperatorIdentityAdopted adopted = 1;
  OperatorIdentityLinked done = 2;
}

// OperatorIdentityAdopted is one member made at roster, or to be.
message OperatorIdentityAdopted {
  // The member, by their alias here.
  string member = 2;
  // Their login at roster, and their password, said once, when they were
  // made.
  string login = 3;
  string password = 4;
  // For a roster of its own: what its operator runs there to make them.
  string make = 6;
  // roster erased somebody by their identifier -- forgot them, or will once
  // its grace is over -- and makes nobody else under it: they do not sign in
  // here, and leave once reconciled, unless roster restores them in time.
  bool erased = 7;
}

message OperatorIdentityLinked {
  // The roster is this process's.
  bool embedded = 1;
  // How many it made, how many roster had already, and how many roster
  // erased.
  uint32 made = 2;
  uint32 had = 3;
  uint32 erased = 7;
  // The tenant at roster, and for a roster of its own how many are left to
  // make there.
  string tenant = 4;
  uint32 todo = 5;
  // Everybody was given the password asked for.
  bool given = 6;
}

message OperatorIdentityDepartRequest {
  // The member, by their alias here, or by their identifier -- which is
  // their holder's at roster.
  string member = 1;
  // Say what it would do, and do nothing.
  bool dry_run = 3;
}

message OperatorIdentityDepartResponse {
  bytes id = 1;
  bool dry_run = 2;
  string member = 7;
  // What leaving does, said before it is done, or what it did: that nobody
  // is left in the workspace, so that it closes (D29). Who may run it once
  // they have left is roster's, by the roles the tenant binds there (D89).
  bool closes = 11;
  // Rows of its trail a legal hold kept.
  uint32 held = 12;
  // On the roster in this process, the holder itself went too; one of its own
  // is its operator's to erase.
  bool embedded = 5;
  bool forgot = 6;
}

message OperatorIdentityReconcileRequest {
  // Say what it would do, and do nothing.
  bool dry_run = 1;
}

message OperatorIdentityReconcileResponse {
  bool dry_run = 1;
  // Every member here, and how many of them roster has.
  uint32 members = 2;
  uint32 found = 3;
  // Gone at roster and not leaving here yet; leaving here, and roster has
  // them again.
  repeated OperatorIdentityMember gone = 4;
  repeated OperatorIdentityMember back = 5;
}

message OperatorIdentityMember {
  bytes id = 1;
  // By their alias here.
  string member = 2;
}

// OperatorHolderService is a member, on the roster in this process (design
// 9.10, D85): what the people screen does, for the operator who has no screen
// to do it from -- the owner who lost their password above all. A deployment
// whose roster is one of its own refuses both: its people are made and given
// passwords there.
service OperatorHolderService {
  // Add makes somebody a member: a holder of the tenant at the roster in this
  // process -- with a password said once, when they are new there -- and
  // their membership and person record here.
  rpc Add(OperatorHolderAddRequest) returns (OperatorHolderAddResponse);

  // Password gives a member a new password, said once, and ends everywhere
  // they are signed in.
  rpc Password(OperatorHolderPasswordRequest) returns (OperatorHolderPasswordResponse);
}

message OperatorHolderAddRequest {
  string login = 2;
  // Their name; the login by default.
  string name = 3;
  // Their e-mail, kept on the person record.
  string email = 4;
  // What they may do; member by default.
  string role = 5;
  // A password for somebody new at roster; empty makes one up.
  string password = 6;
}

message OperatorHolderAddResponse {
  // The member, by their alias here and their identifier.
  string member = 2;
  bytes id = 3;
  string role = 4;
  // A password made up for somebody new at roster, said once.
  string password = 5;
}

message OperatorHolderPasswordRequest {
  string login = 1;
  // The new password; empty makes one up.
  string password = 2;
}

message OperatorHolderPasswordResponse {
  string login = 1;
  bytes id = 2;
  // The one made up, said once.
  string password = 3;
}

// OperatorEventService is a workspace's history, as the operator acts on it
// on the workspace's word. Taking an event's reason out is the entity's own
// `EventService.Redact`, which the entry point serves as the operator; this
// says what it would take, before it is asked to.
service OperatorEventService {
  // Redaction is what taking an event's reason out would take: the event,
  // whether it has a reason, and where else its operation says the same --
  // its other events, the notices that say it as their words, the rows that
  // keep it as their own -- by kind and by count, having read none of what
  // they say (design D49, D51, D56). It changes nothing.
  rpc Redaction(OperatorEventRedactionRequest) returns (OperatorEventRedactionResponse);
}

message OperatorEventRedactionRequest {
  bytes event = 1;
  // The workspace it is of, when the caller says which; refused when it is
  // another's.
  OperatorTenantRef tenant = 2 [features.field_presence = EXPLICIT];
}

message OperatorEventRedactionResponse {
  bytes event = 1;
  string tenant = 2;
  string kind = 3;
  google.protobuf.Timestamp date_occurred = 4;
  google.protobuf.Timestamp date_recorded = 5;
  bytes subject = 6;
  // Whether it has a reason to take out at all.
  bool said = 7;
  // The other events of its operation that say the same, the notices that
  // say it as their words (and how many of those went by mail, which is not
  // taken back), and the rows that keep it as their own: each by kind.
  map<string, uint32> copies = 8;
  map<string, uint32> told = 9;
  uint32 mailed = 10;
  map<string, uint32> kept = 11;
  // What took its reason out before, the newest first: the act's own event,
  // or the part of an act that took it out of a copy.
  repeated OperatorEventRedactionAct acts = 12;
}

message OperatorEventRedactionAct {
  bytes event = 1;
  google.protobuf.Timestamp date_recorded = 2;
  // Who did it; nobody, for the deployment's own work.
  bytes actor = 3;
  // The operator's name, for an act an operator did.
  string operator = 4;
}

// OperatorAccessService is the access record of the whole deployment, for an
// operator (loft#136): who read, wrote or took out whose personal data, from
// where -- in a workspace, by a member, of one person, of one kind. A person
// asking what was done with their data is answered with `subject`. It says
// identifiers and no names, but an operator's, which the entry point knows,
// and changes nothing. A workspace's own administrators review theirs with
// `AccessService.Review`.
service OperatorAccessService {
  // List is the calls that carried somebody's personal data, newest first.
  rpc List(OperatorAccessListRequest) returns (OperatorAccessListResponse);
}

message OperatorAccessListRequest {
  // Only this workspace's record.
  OperatorTenantRef tenant = 1 [features.field_presence = EXPLICIT];
  // From and before when; thirty days ago and now when unset.
  google.protobuf.Timestamp date_from = 2;
  google.protobuf.Timestamp date_to = 3;
  // Only the calls of this actor: a member, or an operator.
  bytes actor = 4;
  // Only the calls that carried this person's data, by their person
  // record's or their membership's identifier.
  bytes subject = 5;
  // read, write or download.
  string kind = 6;
  // At most this many; 100 when unset, and no more than 1000.
  uint32 size = 7;
}

message OperatorAccessListResponse {
  repeated OperatorAccessRow items = 1;
}

message OperatorAccessRow {
  google.protobuf.Timestamp date_created = 1;
  string tenant = 2;
  string kind = 3;
  string result = 4;
  string action = 5;
  bytes actor = 6;
  // The operator's name, for a row an operator made.
  string operator = 7;
  string address = 8;
  uint32 subjects = 9;
  string reason = 10;
}

// OperatorAuthService is who the key a call carries is (design 9.16): what
// `loft auth whoami` asks on an operator's connection, and what `loft auth
// login --operator` asks before it keeps one.
service OperatorAuthService {
  // Whoami is the operator `admin.keys` names for the key the call carries:
  // their name, and the identifier the rows name them by. It reads nothing
  // else, and a call with no key, or one nobody holds, is refused before it.
  rpc Whoami(OperatorAuthWhoamiRequest) returns (OperatorAuthWhoamiResponse);
}

message OperatorAuthWhoamiRequest {}

message OperatorAuthWhoamiResponse {
  // The operator's name in `admin.keys`.
  string name = 1;
  // The identifier the rows they write name them by (`operator.Id`).
  bytes id = 2;
}
