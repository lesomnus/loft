edition = "2023";

package loft;

import "google/protobuf/timestamp.proto";
import "loft/ops.proto";
import "loft/payday/holder.proto";
import "loft/payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/loft";

// The operator's own services (D74, design 9.15): what an operator of the
// deployment does that is no entity's RPC. They are served by the operator's
// entry point alone (`loft-admin serve`, `server/admin`) and registered on no
// other server: the public one has none of them, and reads no operator's key.
// Where an entity's RPC is what an operator does -- `TenantService.Close`, a
// contract's `Add` -- the entry point serves that RPC instead, the same
// request, as the operator.
//
// Each is `Operator<X>Service`, X the name in the schema of what it is about:
// what a terminal mounts its methods under (`OperatorTenantService.Move` is
// `tenant move`).

// OperatorTenantService is what an operator does to a workspace from outside
// it, besides what `TenantService` serves them.
service OperatorTenantService {
  // Show is one workspace as an operator reads it: its row, who is in it,
  // its contracts and its legal holds, and what its own settings, its
  // contracts and its holds come to now.
  rpc Show(OperatorTenantShowRequest) returns (OperatorTenantShowResponse);

  // Move gives a workspace another address (D29): one a workspace may have
  // and nobody has, and the old one is held -- sending whoever arrives at it
  // on -- for as long as a destroyed workspace's is. Nobody in a workspace
  // moves its address (`TenantService.Patch` refuses one).
  rpc Move(OperatorTenantMoveRequest) returns (OperatorTenantMoveResponse);

  // NameOwner makes a member of a workspace one of its owners (decision 17):
  // for one whose owners are gone, or who asked. Whoever owned it still does.
  rpc NameOwner(OperatorTenantNameOwnerRequest) returns (Holder);

  // Retired is the workspaces that retired from this deployment, and what is
  // left of each: when it retired, and until when the deployment's floors
  // keep what it kept (`trail.Policy.Retired`). What an operator asked to
  // preserve a workspace's records reads first.
  rpc Retired(OperatorTenantRetiredRequest) returns (OperatorTenantRetiredResponse);

  // Retire takes a workspace out of the deployment, keeping what the
  // deployment's floors are on of its trail until they pass; Purge takes all
  // of it, what the floors are on too (payday#115). Each is the closing
  // sweep's destruction by an operator's hand (`closing.Destroy`): its rows,
  // its files, the accounts of the roster in this process that were there
  // alone, its final reading for levyan, and its address held. What it is at
  // while it works, and last what it took -- or, for a dry run, would.
  rpc Retire(OperatorTenantDestroyRequest) returns (stream OperatorTenantDestroyResponse);
  rpc Purge(OperatorTenantDestroyRequest) returns (stream OperatorTenantDestroyResponse);

  // Import restores a workspace from its signed export, into a deployment
  // that does not have it -- the one it was purged from, or another (D34).
  // The first message says how, and every other holds the next of the
  // export's bytes; the file is the caller's.
  rpc Import(stream OperatorTenantImportRequest) returns (OperatorTenantImportResponse);
}

// OperatorTenantRef is a workspace as an operator names it: by its
// identifier, or by its address. It is `TenantRef` on the wire, field for
// field; a file written by hand cannot import the contracts `pd gen` writes.
message OperatorTenantRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
  }
}

message OperatorTenantShowRequest {
  OperatorTenantRef ref = 1;
}

message OperatorTenantShowResponse {
  Tenant tenant = 1;

  // Its memberships, not erased, by alias.
  repeated Holder members = 2;

  // Its contracts, the latest in force first.
  repeated TenantContract contracts = 3;

  // Its legal holds, the newest first, lifted ones among them.
  repeated LegalHold holds = 4;

  // What its own settings, contracts and holds come to now.
  OperatorTenantWindow window = 5;
}

// OperatorTenantWindow is how long a workspace keeps what it keeps, as it
// stands now: its own settings (D36), the deployment's where it says none,
// and the floors and holds over both.
message OperatorTenantWindow {
  // Days its history is kept; 0 is forever.
  uint32 keep_days = 1;
  // A window made shorter waits out the grace: until when the longer one
  // holds, and the days it then becomes. Unset when nothing waits.
  google.protobuf.Timestamp keep_until = 2;
  uint32 keep_then_days = 3;

  // Days the trail keeps its access record -- the floor raising a shorter
  // one -- and the same for a shorter one waiting; 0 is forever.
  uint32 access_days = 4;
  google.protobuf.Timestamp access_until = 5;
  uint32 access_then_days = 6;

  // Days it may be restored once closed: its own, or the deployment's.
  uint32 restore_days = 7;

  // Whether destroying it takes its whole trail, what the deployment's
  // floors are on too, as its contract says; otherwise it retires.
  bool purge = 8;

  // Whether the deployment destroys anything by these windows at all
  // (`app.retention.apply`).
  bool apply = 9;
}

message OperatorTenantMoveRequest {
  OperatorTenantRef ref = 1;
  // The new address.
  string to = 2;
  // Take an address that is held anyway, which says so in the log.
  bool reuse = 3;
  // Say what it would do, and do nothing.
  bool dry_run = 4;
}

message OperatorTenantMoveResponse {
  // The workspace, at its new address -- at its old one for a dry run.
  Tenant tenant = 1;
  // The address it was at, and until when that is held from anybody else.
  string from = 2;
  google.protobuf.Timestamp held_until = 3;
}

message OperatorTenantNameOwnerRequest {
  OperatorTenantRef ref = 1;
  // The membership, by its alias in the workspace (`@` or not).
  string member = 2;
}

message OperatorTenantRetiredRequest {}

message OperatorTenantRetiredResponse {
  // The longest retired first.
  repeated OperatorTenantRetirement items = 1;
}

message OperatorTenantRetirement {
  bytes tenant = 1;
  // Its address, as the hold on it names it; empty once none is left.
  string alias = 2;
  google.protobuf.Timestamp retired = 3;
  // When the last of the deployment's floors passes for what it kept.
  google.protobuf.Timestamp until = 4;
}

message OperatorTenantDestroyRequest {
  OperatorTenantRef ref = 1;
  // Say what it would take, and take nothing.
  bool dry_run = 2;
}

// OperatorTenantDestroyResponse is a message of a destruction: what it is at
// while it works, and last, what it took.
message OperatorTenantDestroyResponse {
  string progress = 1;
  OperatorTenantDestroyed destroyed = 2;
}

message OperatorTenantDestroyed {
  bytes tenant = 1;
  string alias = 2;
  bool dry_run = 3;

  // The rows taken, by table, and the files; the files that could not be
  // removed, which are no row's any more.
  map<string, uint32> rows = 4;
  uint32 files = 5;
  repeated string lost = 6;

  // What the trail's purge took: its rows in the database, alone and shared,
  // and its archived chunks.
  uint32 trail_removed = 7;
  uint32 trail_blanked = 8;
  uint32 trail_chunks = 9;

  // A retirement, which keeps what the deployment's floors are on, by kind,
  // until when the last of them passes.
  bool retired = 10;
  map<string, uint32> kept = 11;
  google.protobuf.Timestamp kept_until = 12;

  // On the roster in this process (`embedded`), the accounts that were in
  // this workspace and no other, which went with it.
  bool embedded = 13;
  uint32 forgotten = 14;

  // For a deployment that bills (`bills`): why its final reading could not
  // be handed to levyan, which bills it by its last daily one -- empty when
  // it was; and that levyan is to be told it was destroyed (`tells`).
  bool bills = 15;
  string unmeasured = 16;
  bool tells = 17;

  // Whether its contract purges it -- what the other of Retire and Purge
  // does.
  bool contract_purges = 18;
}

message OperatorTenantImportRequest {
  oneof part {
    // The first message.
    OperatorTenantImportOptions options = 1;
    // Every other: the next of the export's bytes.
    bytes data = 2;
  }
}

message OperatorTenantImportOptions {
  // The address to restore it at, instead of the export's.
  string alias = 1;
  // Take the address though another workspace's hold is on it.
  bool reuse = 2;
  // Say what it would put back, and put nothing back.
  bool dry_run = 3;
}

message OperatorTenantImportResponse {
  bytes tenant = 1;
  bool dry_run = 2;

  // The address it is at, and the export's when that is another: another
  // workspace has it here, or it is not one this deployment gives.
  string alias = 3;
  string asked = 4;
  // The holds on the address taken back, by why they were put.
  repeated string released = 5;
  // It was closed when it was exported, and is open.
  bool reopened = 6;
  // It retired from here, and how many records of that the trail lifted
  // taking it back first.
  bool retired = 7;
  uint32 returned = 8;

  // The rows put back, by table; the export's left behind, by a table this
  // build has not, with why; the files put back, and the ones its rows name
  // that the export did not have.
  map<string, uint32> rows = 9;
  map<string, uint32> left = 10;
  map<string, string> left_why = 11;
  uint32 files = 12;
  repeated string missing = 13;

  // The members whose accounts this roster does not have, restored with
  // none, by alias.
  repeated string unlinked = 14;

  // The export's manifest and the key that signed it: keep the export, for
  // the trail it holds is not put back.
  string manifest = 15;
  string key = 16;

  // Once put back: the things out held from when they were handed over
  // (D53), and what levyan grants it -- `copied`, or why it is copied at the
  // next comparison; empty for a deployment that bills nobody.
  uint32 held = 17;
  string grants = 18;
}

// OperatorTrailService is the trail, as the deployment's operator keeps it.
service OperatorTrailService {
  // Keys is the public keys the deployment signs with and trusts: what an
  // export of a workspace and a bundle of its trail are held to where they
  // are read -- with the operator, beside the file and the identity that
  // opens it, which never come here.
  rpc Keys(OperatorTrailKeysRequest) returns (OperatorTrailKeysResponse);
}

message OperatorTrailKeysRequest {}

message OperatorTrailKeysResponse {
  // The key the deployment signs with now (`audit.checkpoints.key`), PKIX
  // in DER; empty when it signs with none.
  bytes signer = 1;
  // And the ones it trusts besides (`audit.checkpoints.trust`).
  repeated bytes trusted = 2;
}
