edition = "2023";
package loft;

import "google/protobuf/timestamp.proto";
import "loft/asset.proto";
import "loft/asset_svc.g.proto";
import "loft/catalog_svc.g.proto";
import "loft/payday/tenant_svc.g.proto";
import "loft/stock.proto";
import "patch/patch.proto";

option go_package = "github.com/lesomnus/loft";

service StockService {
  // Add creates a new Stock
  rpc Add(StockAddRequest) returns (Stock);
  // Get retrieves a Stock
  rpc Get(StockGetRequest) returns (Stock);
  // Patch updates an existing Stock
  rpc Patch(StockPatchRequest) returns (Stock);
  // Apply applies a patch document to an existing Stock
  rpc Apply(StockApplyRequest) returns (Stock);
  // Erase deletes a Stock
  rpc Erase(StockRef) returns (StockEraseResponse);
  // List reads Stocks a page at a time.
  rpc List(StockListRequest) returns (StockListResponse);
  // Watch the Stocks this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(StockWatchRequest) returns (stream StockWatchResponse);
  // Receive, Consume and Adjust change a stock by a quantity, with a reason.
  rpc Receive(StockChangeRequest) returns (Stock);
  rpc Consume(StockChangeRequest) returns (Stock);
  rpc Adjust(StockChangeRequest) returns (Stock);
  // Transfer moves a quantity to the same model's stock in another space.
  rpc Transfer(StockTransferRequest) returns (Stock);
  // Convert takes units out of a stock and makes them assets of their own.
  rpc Convert(StockConvertRequest) returns (StockConvertResponse);
  // Flow is each stock over a period (재고 소모, design 9.14): how many it had
  // when the period began, what came in and what went out by what moved it,
  // and how many it had when the period ended. It names nobody.
  rpc Flow(StockFlowRequest) returns (StockFlowResponse);
  // ExportFlow writes it as a CSV, which names nobody and so is no download
  // of anybody (loft#136).
  rpc ExportFlow(StockFlowRequest) returns (AssetExportResponse);
}

service StockMovementService {
  // Add creates a new StockMovement
  rpc Add(StockMovementAddRequest) returns (StockMovement);
  // Get retrieves a StockMovement
  rpc Get(StockMovementGetRequest) returns (StockMovement);
  // Patch updates an existing StockMovement
  rpc Patch(StockMovementPatchRequest) returns (StockMovement);
  // Apply applies a patch document to an existing StockMovement
  rpc Apply(StockMovementApplyRequest) returns (StockMovement);
  // Erase deletes a StockMovement
  rpc Erase(StockMovementRef) returns (StockMovementEraseResponse);
  // List reads StockMovements a page at a time.
  rpc List(StockMovementListRequest) returns (StockMovementListResponse);
}

message StockAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  ItemModelRef model = 8;
  AssetRef space = 9;
  int64 quantity = 10 [features.field_presence = IMPLICIT];
  int64 threshold = 11 [features.field_presence = IMPLICIT];
  string unit = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  bytes op = 100;
}

message StockGetRequest {
  StockRef ref = 1;
  StockSelect select = 2;
}

message StockRef {
  oneof key {
    bytes id = 1;
  }
}

message StockSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool name = 5;
  bool labels = 7;
  ItemModelSelect model = 8;
  AssetSelect space = 9;
  bool quantity = 10;
  bool threshold = 11;
  bool unit = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message StockPatchRequest {
  StockRef ref = 1;
  string name = 10;
  map<string, string> labels = 14;
  int64 quantity = 20;
  int64 threshold = 22;
  string unit = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message StockApplyRequest {
  StockRef ref = 1;
  patch.Patch patch = 2;
}

message StockEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message StockListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated StockFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message StockListResponse {
  repeated Stock items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message StockFilter {
  StockRef ref = 1;
  ItemModelRef model = 2;
  AssetRef space = 3;
}

message StockWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated StockFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message StockWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated StockWatchItem items = 1;
}

message StockWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Stock value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message StockChangeRequest {
  StockRef ref = 1;
  int64 quantity = 2 [features.field_presence = IMPLICIT];
  string reason = 3 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 4;
  bytes op = 5 [features.field_presence = IMPLICIT];
}

message StockTransferRequest {
  StockRef ref = 1;
  AssetRef to = 2;
  int64 quantity = 3 [features.field_presence = IMPLICIT];
  string reason = 4 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 5;
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message StockConvertRequest {
  StockRef ref = 1;
  int64 quantity = 2 [features.field_presence = IMPLICIT];
  // A prefix the new assets' tags start with; numbers follow.
  string tag_prefix = 3 [features.field_presence = IMPLICIT];
  bytes op = 4 [features.field_presence = IMPLICIT];
}

message StockConvertResponse {
  Stock stock = 1;
  repeated Asset assets = 2;
}

message StockFlowRequest {
  // The period, from `from` and before `to`, a year at most. Unsaid, the last
  // thirty of the workspace's days, today among them.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message StockFlowResponse {
  // Every stock, by name and then by where it is kept.
  repeated StockFlowRow rows = 1;
  // The period it read.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// StockFlowRow is one stock over a period, in its own unit: what it had at
// each end of the period, and what moved it in between, each a count of
// units however it moved.
message StockFlowRow {
  bytes stock_id = 1 [features.field_presence = IMPLICIT];
  string name = 2 [features.field_presence = IMPLICIT];
  string unit = 3 [features.field_presence = IMPLICIT];
  // Where it is kept, as it is called now.
  bytes space_id = 4 [features.field_presence = IMPLICIT];
  string space_name = 5 [features.field_presence = IMPLICIT];
  // How many it had when the period began, and when it ended.
  int64 opening = 6 [features.field_presence = IMPLICIT];
  int64 closing = 7 [features.field_presence = IMPLICIT];
  // What came in: received, given back from a hand-over, moved in from
  // another space, and counted up.
  int64 received = 8 [features.field_presence = IMPLICIT];
  int64 returned = 9 [features.field_presence = IMPLICIT];
  int64 transferred_in = 10 [features.field_presence = IMPLICIT];
  int64 adjusted_up = 11 [features.field_presence = IMPLICIT];
  // What went out: used, handed over, moved to another space, made assets
  // of, and counted down.
  int64 consumed = 12 [features.field_presence = IMPLICIT];
  int64 issued = 13 [features.field_presence = IMPLICIT];
  int64 transferred_out = 14 [features.field_presence = IMPLICIT];
  int64 converted = 15 [features.field_presence = IMPLICIT];
  int64 adjusted_down = 16 [features.field_presence = IMPLICIT];
  // All that came in, and all that went out.
  int64 came_in = 17 [features.field_presence = IMPLICIT];
  int64 went_out = 18 [features.field_presence = IMPLICIT];
}

message StockMovementAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  StockRef stock = 8;
  int64 delta = 9 [features.field_presence = IMPLICIT];
  string reason = 10 [features.field_presence = IMPLICIT];
  bytes ref_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
  google.protobuf.Timestamp date_created = 15;
  bytes event_id = 16 [features.field_presence = IMPLICIT];
  int64 balance = 17 [features.field_presence = IMPLICIT];
}

message StockMovementGetRequest {
  StockMovementRef ref = 1;
  StockMovementSelect select = 2;
}

message StockMovementRef {
  oneof key {
    bytes id = 1;
  }
}

message StockMovementSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  StockSelect stock = 8;
  bool delta = 9;
  bool reason = 10;
  bool ref_id = 11;
  bool occurred_at = 12;
  bool date_updated = 13;
  bool date_created = 15;
  bool event_id = 16;
  bool balance = 17;
}

message StockMovementPatchRequest {
  StockMovementRef ref = 1;
  int64 delta = 18;
  string reason = 20;
  bytes ref_id = 22;
  // Clear ref_id instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and ref_id clears.
  bool ref_id_null = 23;
  google.protobuf.Timestamp occurred_at = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  bytes event_id = 32;
  int64 balance = 34;
}

message StockMovementApplyRequest {
  StockMovementRef ref = 1;
  patch.Patch patch = 2;
}

message StockMovementEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message StockMovementListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated StockMovementFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message StockMovementListResponse {
  repeated StockMovement items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message StockMovementFilter {
  StockMovementRef ref = 1;
  StockRef stock = 2;
  string reason = 3;
}
