edition = "2023";

package loft;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "loft/payday/holder.proto";
import "loft/payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/loft";

// A holder is a member of the workspace (design 9.10, D85): a holder of the
// roster tenant this deployment serves, by the same identifier, made here the
// first time they sign in. A session names it, and every call is served as
// it (`cmd.Resolver`).

// Party is a person, a team, an organization or a vendor: whoever an asset is
// owned by, managed by or held by. Personal data lives here and nowhere else;
// history rows name a party by its identifier (design 3.1, D13).
message Party {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // What a party is called, what is said and labelled of it, how it is reached
  // and the number it goes by are personal (payday#92): the trail records that
  // one was set and never to what. The row is where a person is corrected and
  // pseudonymized, and the trail is the copy nothing rewrites. A team's name
  // is declared with a person's -- a field that is sometimes about a person is
  // about a person -- so a team renamed is on the trail as `name` set.
  string name = 5 [(payday.field) = {personal: true}];
  string desc = 6 [(payday.field) = {personal: true}];
  map<string, string> labels = 7 [(payday.field) = {personal: true}];

  // person | team | org | vendor: what a party is, which is about no one.
  string kind = 8 [(payday.field) = {personal: false}];
  // The team a person is in, or the organization a team is in.
  bytes parent_id = 9 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];
  // The membership, for a person who signs in. Named after its target:
  // a unique index over an edge named otherwise does not generate
  // (protobuf-orm/protoc-gen-orm-ent#1).
  Holder holder = 10 [(orm.edge) = {nullable: true}];
  string email = 11 [(payday.field) = {personal: true}];
  string phone = 12 [(payday.field) = {personal: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // An employee number or a vendor code, free text.
  string code = 16 [(payday.field) = {personal: true}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]
      },
      {
        name: "holder"
        refs: [{name: "holder", number: 10}]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 10
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      by: [{name: "ref"}, {name: "kind"}, {name: "parent_id"}, {name: "holder"}, {name: "labels"}]
      size: 50
      max: 500
    }
    watch: {}
  };
}

// Session is a signed-in browser, and what it names is a member of the
// workspace (D85). It is the deployment's -- `global` -- and it is written
// only by the server, through ent (`server/session`); the policy opens no RPC
// of it. The key itself is never stored: `secret` is what it is kept as -- an
// HMAC of its SHA-256 under a key the database does not hold
// (`server/session`) -- which is what a cookie is looked up by, and which
// nobody who may only write the database can make for a key of their own.
message Session {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // Who signed in: a holder of the roster tenant this deployment serves,
  // which is their membership here by the same identifier (D85).
  bytes holder = 8 [(orm.field) = {type: TYPE_UUID}];
  bytes secret = 9 [(payday.field) = {secret: true}];
  bytes grant = 10;
  google.protobuf.Timestamp date_expires = 11 [(orm.field) = {nullable: true}];
  google.protobuf.Timestamp date_idle = 12 [(orm.field) = {nullable: true}];

  // What the sign-in kept beside the session, as JSON: for one that came
  // through the issuer, its ID token, which is what signing out hands back to
  // it as `id_token_hint` (`server/sso`). Nothing reads it but that.
  bytes held = 16 [
    (orm.field) = {nullable: true},
    (payday.field) = {secret: true}
  ];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    indexes: [
      {
        name: "secret"
        refs: [{name: "secret", number: 9}]
      },
      {
        name: "holder"
        refs: [{name: "holder", number: 8}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 38
    global: {}
    trail: {off: {why: "a sign-in, whose idle clock moves on every request; who signed in, and from where, is the access record's (loft#136)"}}
  };
}


// CliLogin is a terminal asking to be signed in as whoever approves it in a
// browser (`loft auth login`).
//
// The terminal makes up the session key it will use, keeps it, and sends only
// its SHA-256, which is kept as a browser's key is (`Session.secret`): `secret`
// is what the session will be looked up by. A person signed in at the app approves the
// `code` the terminal shows them, and the approval makes that session for
// them. So no key is written here or sent back, and the row holds
// nothing a reader of the database could sign in with. It is the
// deployment's (`global`), written only through ent by `server/clilogin`,
// and the policy opens no RPC of it. Each write is on the trail as its act,
// so who let which terminal in outlives the row (payday#108).
message CliLogin {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // What the session's key is kept as: `Session.secret`.
  bytes secret = 8 [(payday.field) = {secret: true}];

  // What the terminal shows and the person approves: eight letters and
  // digits that read aloud, good for one approval.
  string code = 9;

  // What the terminal says it is, and where it asked from: what the page
  // shows, so that a person approves their own terminal and nobody else's.
  string client = 10;
  string origin = 11;

  // Where it asked from, without what the terminal says it is: what the limit
  // on how many sign-ins one address may start in a while is counted by
  // (`server/clilogin`). Not personal, on purpose (#119): an access record
  // keeps where a sign-in came from, and so does the trail.
  string address = 18 [(payday.field) = {personal: false}];

  // Who approved it, once somebody has: the member signed in at the page.
  bytes holder = 12 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];

  // What the terminal asked to be allowed, which the page shows and the
  // session it gets is narrowed to: `Session.grant`'s bytes, `whole` for all
  // that the member may do (`loft auth login --allow`, D33).
  bytes grant = 19;

  // `pending`, `approved` or `denied`. One still pending after
  // `date_expires` is expired, which is said where it is read.
  string state = 16;
  google.protobuf.Timestamp date_expires = 17 [(orm.field) = {default: ""}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    indexes: [
      {
        name: "code"
        refs: [{name: "code", number: 9}]
      },
      {
        name: "secret"
        refs: [{name: "secret", number: 8}]
      },
      {
        name: "address"
        refs: [
          {name: "address", number: 18},
          {name: "date_created", number: 15}
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 42
    global: {}
    trail: {recorded: {}}
  };
}


// SignInFailure is one wrong answer at the sign-in form, counted against the
// address it came from and the name it was for (`server/session`): ten in
// fifteen minutes and the form refuses that pair for a while.
//
// A row, so that every process of a deployment counts the same failures. A
// count in each process's memory is a limit per process, and a deployment of
// several would have been that many times as easy to guess at. Nothing reads
// one older than the window, and the sweep takes those away. It is the
// deployment's (`global`), written only through ent by `server/session`, and
// the policy opens no RPC of it.
message SignInFailure {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // What the address and the name the failure was for hash to. It keeps the
  // pair out of plain sight, and no more than that: both halves can be guessed
  // -- an address space, a directory's names -- so a reader of the table who
  // tries them can tell whose a row is. What keeps it from saying much is that
  // nothing older than the window is kept.
  bytes subject = 8 [(payday.field) = {secret: true}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    indexes: [
      {
        name: "subject"
        refs: [
          {name: "subject", number: 8},
          {name: "date_created", number: 15}
        ]
      },
      {
        name: "date_created"
        refs: [{name: "date_created", number: 15}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 45
    global: {}
    erase: {hard: {}}
    trail: {off: {why: "a count of the sign-ins an address got wrong, kept for hours to slow the next; nobody's act"}}
  };
}
