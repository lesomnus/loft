edition = "2023";
package loft;

import "google/protobuf/timestamp.proto";
import "loft/asset_svc.g.proto";
import "loft/custody.proto";
import "loft/org_svc.g.proto";
import "loft/payday/tenant_svc.g.proto";
import "loft/stock_svc.g.proto";
import "patch/patch.proto";

option go_package = "github.com/lesomnus/loft";

service CustodyService {
  // Add creates a new Custody
  rpc Add(CustodyAddRequest) returns (Custody);
  // Get retrieves a Custody
  rpc Get(CustodyGetRequest) returns (Custody);
  // Patch updates an existing Custody
  rpc Patch(CustodyPatchRequest) returns (Custody);
  // Apply applies a patch document to an existing Custody
  rpc Apply(CustodyApplyRequest) returns (Custody);
  // Erase deletes a Custody
  rpc Erase(CustodyRef) returns (CustodyEraseResponse);
  // List reads Custodys a page at a time.
  rpc List(CustodyListRequest) returns (CustodyListResponse);
  // Watch the Custodys this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(CustodyWatchRequest) returns (stream CustodyWatchResponse);
  // Acknowledge is the receiver saying they have it.
  rpc Acknowledge(CustodyAcknowledgeRequest) returns (Custody);
  // Return takes back some or all of what was handed over.
  rpc Return(CustodyReturnRequest) returns (Custody);
  rpc Extend(CustodyExtendRequest) returns (Custody);
  // Outstanding is what is out now (대여 현황, design 9.14): a row each thing
  // handed over and not back -- who has it, since when, until when and how
  // late -- a page at a time, and how much is out in all. It names who has
  // each, as they are called now and told apart from whoever else goes by
  // their name, and is a read of them on the access record -- of a team it
  // tells them apart by, too (loft#136, D54); and nobody's address or number.
  rpc Outstanding(CustodyOutstandingRequest) returns (CustodyOutstandingResponse);
  // ExportOutstanding writes every row of it as a CSV, whatever the page: a
  // download of the people it names, which says what it is for in
  // `payday-reason-bin`, and is refused without (loft#136).
  rpc ExportOutstanding(CustodyOutstandingRequest) returns (AssetExportResponse);
}

service CustodyLineService {
  // Add creates a new CustodyLine
  rpc Add(CustodyLineAddRequest) returns (CustodyLine);
  // Get retrieves a CustodyLine
  rpc Get(CustodyLineGetRequest) returns (CustodyLine);
  // Patch updates an existing CustodyLine
  rpc Patch(CustodyLinePatchRequest) returns (CustodyLine);
  // Apply applies a patch document to an existing CustodyLine
  rpc Apply(CustodyLineApplyRequest) returns (CustodyLine);
  // Erase deletes a CustodyLine
  rpc Erase(CustodyLineRef) returns (CustodyLineEraseResponse);
  // List reads CustodyLines a page at a time.
  rpc List(CustodyLineListRequest) returns (CustodyLineListResponse);
}

message CustodyAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string desc = 6 [features.field_presence = IMPLICIT];
  PartyRef party = 8;
  string kind = 9 [features.field_presence = IMPLICIT];
  string status = 10 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp due_at = 12;
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp acknowledged_at = 16;
  google.protobuf.Timestamp returned_at = 17;
  bytes reservation_id = 18;
  bytes issued_by = 19;
  bool overdue_noticed = 20 [features.field_presence = IMPLICIT];
  repeated CustodyLineSpec lines = 100;
  bytes op = 101;
}

message CustodyLineSpec {
  AssetRef asset = 1;
  StockRef stock = 2;
  int64 quantity = 3 [features.field_presence = IMPLICIT];
  string condition = 4 [features.field_presence = IMPLICIT];
}

message CustodyGetRequest {
  CustodyRef ref = 1;
  CustodySelect select = 2;
}

message CustodyRef {
  oneof key {
    bytes id = 1;
  }
}

message CustodySelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool desc = 6;
  PartySelect party = 8;
  bool kind = 9;
  bool status = 10;
  bool issued_at = 11;
  bool due_at = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool acknowledged_at = 16;
  bool returned_at = 17;
  bool reservation_id = 18;
  bool issued_by = 19;
  bool overdue_noticed = 20;
}

message CustodyPatchRequest {
  CustodyRef ref = 1;
  string desc = 12;
  string kind = 18;
  string status = 20;
  google.protobuf.Timestamp issued_at = 22;
  google.protobuf.Timestamp due_at = 24;
  // Clear due_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and due_at clears.
  bool due_at_null = 25;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  google.protobuf.Timestamp acknowledged_at = 32;
  // Clear acknowledged_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and acknowledged_at clears.
  bool acknowledged_at_null = 33;
  google.protobuf.Timestamp returned_at = 34;
  // Clear returned_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and returned_at clears.
  bool returned_at_null = 35;
  bytes reservation_id = 36;
  // Clear reservation_id instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and reservation_id clears.
  bool reservation_id_null = 37;
  bytes issued_by = 38;
  // Clear issued_by instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and issued_by clears.
  bool issued_by_null = 39;
  bool overdue_noticed = 40;
}

message CustodyApplyRequest {
  CustodyRef ref = 1;
  patch.Patch patch = 2;
}

message CustodyEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message CustodyListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated CustodyFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message CustodyListResponse {
  repeated Custody items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message CustodyFilter {
  CustodyRef ref = 1;
  PartyRef party = 2;
  string status = 3;
  string kind = 4;
  bytes reservation_id = 5;
}

message CustodyWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated CustodyFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message CustodyWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated CustodyWatchItem items = 1;
}

message CustodyWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Custody value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message CustodyAcknowledgeRequest {
  CustodyRef ref = 1;
}

message CustodyReturnRequest {
  CustodyRef ref = 1;
  // Empty: everything still out.
  repeated CustodyReturnLine lines = 2;
  google.protobuf.Timestamp at = 3;
  // Where the returned assets go.
  AssetRef to = 4;
  bytes op = 5 [features.field_presence = IMPLICIT];
}

message CustodyReturnLine {
  CustodyLineRef line = 1;
  int64 quantity = 2 [features.field_presence = IMPLICIT];
  string condition = 3 [features.field_presence = IMPLICIT];
}

message CustodyLineRef {
  oneof key {
    bytes id = 1;
  }
}

message CustodyExtendRequest {
  CustodyRef ref = 1;
  google.protobuf.Timestamp due_at = 2;
}

message CustodyOutstandingRequest {
  // Only what is past its due date.
  bool overdue = 1 [features.field_presence = IMPLICIT];
  // issue | loan; empty is both.
  string kind = 2 [features.field_presence = IMPLICIT];
  // A page of the rows: how many -- 50 when unsaid, and 500 at most -- and how
  // many come before it.
  uint32 size = 3 [features.field_presence = IMPLICIT];
  uint32 offset = 4 [features.field_presence = IMPLICIT];
}

message CustodyOutstandingResponse {
  // The most overdue first, then what is due soonest, then what was handed
  // over for keeps, the longest held first.
  repeated CustodyOutstandingRow rows = 1;
  // How many rows there are as the request asked, on every page.
  uint32 total = 2 [features.field_presence = IMPLICIT];
  // All that is out, whatever the request asked: the hand-overs open, those
  // of them past their due date, who has something, the assets out, and the
  // lines of stock -- each in its own unit, so they are counted and not
  // added up.
  uint32 custodies = 3 [features.field_presence = IMPLICIT];
  uint32 overdue = 4 [features.field_presence = IMPLICIT];
  uint32 people = 5 [features.field_presence = IMPLICIT];
  uint32 assets = 6 [features.field_presence = IMPLICIT];
  uint32 stocks = 7 [features.field_presence = IMPLICIT];
  // When it was read, which what is overdue is overdue at.
  google.protobuf.Timestamp at = 8;
}

// CustodyOutstandingRow is one line of a hand-over still out: an asset, or
// what of a stock has not come back.
message CustodyOutstandingRow {
  bytes custody_id = 1 [features.field_presence = IMPLICIT];
  bytes line_id = 2 [features.field_presence = IMPLICIT];
  // issue | loan
  string kind = 3 [features.field_presence = IMPLICIT];
  // Who has it, by the name they have now; and, where another goes by it,
  // with what tells them apart -- the team they are in, their 사번, or their
  // identifier -- as every list of people does (D50, D54).
  bytes party_id = 4 [features.field_presence = IMPLICIT];
  string party_name = 5 [features.field_presence = IMPLICIT];
  // What it is: an asset, by its tag and name; or a stock, by its name, how
  // many of it are still out, and in what.
  bytes asset_id = 6 [features.field_presence = IMPLICIT];
  string asset_tag = 7 [features.field_presence = IMPLICIT];
  string asset_name = 8 [features.field_presence = IMPLICIT];
  bytes stock_id = 9 [features.field_presence = IMPLICIT];
  string stock_name = 10 [features.field_presence = IMPLICIT];
  int64 quantity = 11 [features.field_presence = IMPLICIT];
  string unit = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp issued_at = 13;
  google.protobuf.Timestamp due_at = 14;
  // Past its due date, and by how many of the workspace's days: one due
  // yesterday is a day late, and one due earlier today none, late as it is.
  bool overdue = 15 [features.field_presence = IMPLICIT];
  uint32 overdue_days = 16 [features.field_presence = IMPLICIT];
  // Whether whoever has it said they do.
  bool acknowledged = 17 [features.field_presence = IMPLICIT];
}

message CustodyLineAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  CustodyRef custody = 8;
  AssetRef asset = 9;
  StockRef stock = 10;
  int64 quantity = 11 [features.field_presence = IMPLICIT];
  int64 returned_quantity = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp out_at = 16;
  google.protobuf.Timestamp returned_at = 17;
  string condition_out = 18 [features.field_presence = IMPLICIT];
  string condition_in = 19 [features.field_presence = IMPLICIT];
}

message CustodyLineGetRequest {
  CustodyLineRef ref = 1;
  CustodyLineSelect select = 2;
}

message CustodyLineSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  CustodySelect custody = 8;
  AssetSelect asset = 9;
  StockSelect stock = 10;
  bool quantity = 11;
  bool returned_quantity = 12;
  bool date_updated = 13;
  bool date_created = 15;
  bool out_at = 16;
  bool returned_at = 17;
  bool condition_out = 18;
  bool condition_in = 19;
}

message CustodyLinePatchRequest {
  CustodyLineRef ref = 1;
  int64 quantity = 22;
  int64 returned_quantity = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  google.protobuf.Timestamp out_at = 32;
  google.protobuf.Timestamp returned_at = 34;
  // Clear returned_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and returned_at clears.
  bool returned_at_null = 35;
  string condition_out = 36;
  string condition_in = 38;
}

message CustodyLineApplyRequest {
  CustodyLineRef ref = 1;
  patch.Patch patch = 2;
}

message CustodyLineEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message CustodyLineListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated CustodyLineFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message CustodyLineListResponse {
  repeated CustodyLine items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message CustodyLineFilter {
  CustodyLineRef ref = 1;
  CustodyRef custody = 2;
  AssetRef asset = 3;
  StockRef stock = 4;
}
