edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/asset_svc.g.proto";
import "rove/history.proto";
import "rove/org_svc.g.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service PlacementService {
  // Add creates a new Placement
  rpc Add(PlacementAddRequest) returns (Placement);
  // AddMany creates up to 1000 new Placement rows in one call, all of them or none
  rpc AddMany(PlacementAddManyRequest) returns (PlacementAddManyResponse);
  // Get retrieves a Placement
  rpc Get(PlacementGetRequest) returns (Placement);
  // Patch updates an existing Placement
  rpc Patch(PlacementPatchRequest) returns (Placement);
  // Apply applies a patch document to an existing Placement
  rpc Apply(PlacementApplyRequest) returns (Placement);
  // Erase deletes a Placement
  rpc Erase(PlacementRef) returns (PlacementEraseResponse);
  // List reads Placements a page at a time.
  rpc List(PlacementListRequest) returns (PlacementListResponse);
}

service LinkService {
  // Add creates a new Link
  rpc Add(LinkAddRequest) returns (Link);
  // Get retrieves a Link
  rpc Get(LinkGetRequest) returns (Link);
  // Patch updates an existing Link
  rpc Patch(LinkPatchRequest) returns (Link);
  // Apply applies a patch document to an existing Link
  rpc Apply(LinkApplyRequest) returns (Link);
  // Erase deletes a Link
  rpc Erase(LinkRef) returns (LinkEraseResponse);
  // List reads Links a page at a time.
  rpc List(LinkListRequest) returns (LinkListResponse);
}

service StewardshipService {
  // Add creates a new Stewardship
  rpc Add(StewardshipAddRequest) returns (Stewardship);
  // Get retrieves a Stewardship
  rpc Get(StewardshipGetRequest) returns (Stewardship);
  // Patch updates an existing Stewardship
  rpc Patch(StewardshipPatchRequest) returns (Stewardship);
  // Apply applies a patch document to an existing Stewardship
  rpc Apply(StewardshipApplyRequest) returns (Stewardship);
  // Erase deletes a Stewardship
  rpc Erase(StewardshipRef) returns (StewardshipEraseResponse);
  // List reads Stewardships a page at a time.
  rpc List(StewardshipListRequest) returns (StewardshipListResponse);
}

message PlacementAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  AssetRef child = 8;
  AssetRef parent = 9;
  string mode = 10 [features.field_presence = IMPLICIT];
  string slot = 11 [features.field_presence = IMPLICIT];
  int32 u_from = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  int32 u_to = 16 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp valid_from = 17;
  google.protobuf.Timestamp valid_to = 18;
  bytes event_id = 19 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp superseded_at = 20;
  bytes superseded_by = 21;
}

message PlacementAddManyRequest {
  repeated PlacementAddRequest items = 1;
}

message PlacementAddManyResponse {
  repeated Placement items = 1;
}

message PlacementGetRequest {
  PlacementRef ref = 1;
  PlacementSelect select = 2;
}

message PlacementRef {
  oneof key {
    bytes id = 1;
  }
}

message PlacementSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  AssetSelect child = 8;
  AssetSelect parent = 9;
  bool mode = 10;
  bool slot = 11;
  bool u_from = 12;
  bool date_updated = 13;
  bool date_created = 15;
  bool u_to = 16;
  bool valid_from = 17;
  bool valid_to = 18;
  bool event_id = 19;
  bool superseded_at = 20;
  bool superseded_by = 21;
}

message PlacementPatchRequest {
  PlacementRef ref = 1;
  string mode = 20;
  string slot = 22;
  int32 u_from = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  int32 u_to = 32;
  google.protobuf.Timestamp valid_from = 34;
  google.protobuf.Timestamp valid_to = 36;
  // Clear valid_to instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and valid_to clears.
  bool valid_to_null = 37;
  bytes event_id = 38;
  google.protobuf.Timestamp superseded_at = 40;
  // Clear superseded_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and superseded_at clears.
  bool superseded_at_null = 41;
  bytes superseded_by = 42;
  // Clear superseded_by instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and superseded_by clears.
  bool superseded_by_null = 43;
}

message PlacementApplyRequest {
  PlacementRef ref = 1;
  patch.Patch patch = 2;
}

message PlacementEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message PlacementListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated PlacementFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message PlacementListResponse {
  repeated Placement items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message PlacementFilter {
  PlacementRef ref = 1;
  AssetRef child = 2;
  AssetRef parent = 3;
}

