edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/asset_svc.g.proto";
import "rove/count.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service InventoryCountService {
  // Add creates a new InventoryCount
  rpc Add(InventoryCountAddRequest) returns (InventoryCount);
  // Get retrieves a InventoryCount
  rpc Get(InventoryCountGetRequest) returns (InventoryCount);
  // Patch updates an existing InventoryCount
  rpc Patch(InventoryCountPatchRequest) returns (InventoryCount);
  // Apply applies a patch document to an existing InventoryCount
  rpc Apply(InventoryCountApplyRequest) returns (InventoryCount);
  // Erase deletes a InventoryCount
  rpc Erase(InventoryCountRef) returns (InventoryCountEraseResponse);
  // List reads InventoryCounts a page at a time.
  rpc List(InventoryCountListRequest) returns (InventoryCountListResponse);
  // Watch the InventoryCounts this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(InventoryCountWatchRequest) returns (stream InventoryCountWatchResponse);
  // Scan records that something was seen, where. Offline scans arrive with the
  // device's `seen_at` and their own op, so a replay is the same scan.
  rpc Scan(InventoryCountScanRequest) returns (CountFinding);
  // Reconcile marks what was expected under the scope and never seen.
  rpc Reconcile(InventoryCountReconcileRequest) returns (InventoryCountReconcileResponse);
  // Resolve settles one finding: move the asset to where it was seen, report it
  // lost, or ignore it.
  rpc Resolve(InventoryCountResolveRequest) returns (CountFinding);
  rpc Close(InventoryCountCloseRequest) returns (InventoryCount);
  // Results is each count begun in a period (실사 결과, design 9.14), by what
  // it found -- what was where it should be, and the differences: misplaced,
  // missing, unknown -- and how they were settled, the losses among them. It
  // names nobody.
  rpc Results(InventoryCountResultsRequest) returns (InventoryCountResultsResponse);
  // ExportResults writes it as a CSV, which names nobody and so is no
  // download of anybody (rove#136).
  rpc ExportResults(InventoryCountResultsRequest) returns (AssetExportResponse);
}

service CountFindingService {
  // Add creates a new CountFinding
  rpc Add(CountFindingAddRequest) returns (CountFinding);
  // Get retrieves a CountFinding
  rpc Get(CountFindingGetRequest) returns (CountFinding);
  // Patch updates an existing CountFinding
  rpc Patch(CountFindingPatchRequest) returns (CountFinding);
  // Apply applies a patch document to an existing CountFinding
  rpc Apply(CountFindingApplyRequest) returns (CountFinding);
  // Erase deletes a CountFinding
  rpc Erase(CountFindingRef) returns (CountFindingEraseResponse);
  // List reads CountFindings a page at a time.
  rpc List(CountFindingListRequest) returns (CountFindingListResponse);
  // Watch the CountFindings this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(CountFindingWatchRequest) returns (stream CountFindingWatchResponse);
}

message InventoryCountAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  AssetRef scope = 8;
  string status = 9 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp closed_at = 11;
  bytes started_by = 12;
  google.protobuf.Timestamp date_created = 15;
  bool self_service = 16 [features.field_presence = IMPLICIT];
  uint64 findings_version = 17 [features.field_presence = IMPLICIT];
}

message InventoryCountGetRequest {
  InventoryCountRef ref = 1;
  InventoryCountSelect select = 2;
}

message InventoryCountRef {
  oneof key {
    bytes id = 1;
  }
}

message InventoryCountSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool name = 5;
  bool desc = 6;
  AssetSelect scope = 8;
  bool status = 9;
  bool started_at = 10;
  bool closed_at = 11;
  bool started_by = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool self_service = 16;
  bool findings_version = 17;
}

message InventoryCountPatchRequest {
  InventoryCountRef ref = 1;
  string name = 10;
  string desc = 12;
  string status = 18;
  google.protobuf.Timestamp started_at = 20;
  google.protobuf.Timestamp closed_at = 22;
  // Clear closed_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and closed_at clears.
  bool closed_at_null = 23;
  bytes started_by = 24;
  // Clear started_by instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and started_by clears.
  bool started_by_null = 25;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  bool self_service = 32;
  uint64 findings_version = 34;
}

message InventoryCountApplyRequest {
  InventoryCountRef ref = 1;
  patch.Patch patch = 2;
}

message InventoryCountEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message InventoryCountListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated InventoryCountFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message InventoryCountListResponse {
  repeated InventoryCount items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message InventoryCountFilter {
  InventoryCountRef ref = 1;
  AssetRef scope = 2;
  string status = 3;
}

message InventoryCountWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated InventoryCountFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message InventoryCountWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated InventoryCountWatchItem items = 1;
}

message InventoryCountWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  InventoryCount value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message InventoryCountScanRequest {
  InventoryCountRef ref = 1;
  // What was scanned: a label code, or an asset directly.
  string code = 2 [features.field_presence = IMPLICIT];
  AssetRef asset = 3;
  // Where it was seen. Empty is the count's scope.
  AssetRef at = 4;
  google.protobuf.Timestamp seen_at = 5;
  bytes op = 6 [features.field_presence = IMPLICIT];
  string note = 7 [features.field_presence = IMPLICIT];
}

message InventoryCountReconcileRequest {
  InventoryCountRef ref = 1;
}

message InventoryCountReconcileResponse {
  uint32 missing = 1 [features.field_presence = IMPLICIT];
  uint32 seen = 2 [features.field_presence = IMPLICIT];
  uint32 misplaced = 3 [features.field_presence = IMPLICIT];
  uint32 unknown = 4 [features.field_presence = IMPLICIT];
}

message InventoryCountResolveRequest {
  CountFindingRef ref = 1;
  // moved | lost | ignored
  string resolution = 2 [features.field_presence = IMPLICIT];
  string reason = 3 [features.field_presence = IMPLICIT];
  // With `lost`: the kits and groups the asset leaves as it is lost, as
  // AssetSetAttributesRequest.leave says.
  repeated AssetRef leave = 4;
}

message CountFindingRef {
  oneof key {
    bytes id = 1;
  }
}

message InventoryCountCloseRequest {
  InventoryCountRef ref = 1;
}

message InventoryCountResultsRequest {
  // The counts begun from `from` and before `to`, a year at most. Unsaid, the
  // last year of the workspace's days, today among them.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message InventoryCountResultsResponse {
  // The newest first.
  repeated InventoryCountResult rows = 1;
  // The period it read.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// InventoryCountResult is what one count found, by kind, and how what it
// found amiss was settled.
message InventoryCountResult {
  bytes count_id = 1 [features.field_presence = IMPLICIT];
  string name = 2 [features.field_presence = IMPLICIT];
  // The space it covered, as it is called now.
  bytes scope_id = 3 [features.field_presence = IMPLICIT];
  string scope_name = 4 [features.field_presence = IMPLICIT];
  // open | closed
  string status = 5 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp closed_at = 7;
  // What it found: where it should be, somewhere else, never seen, and
  // scanned but not registered. The last three are the differences.
  uint32 seen = 8 [features.field_presence = IMPLICIT];
  uint32 misplaced = 9 [features.field_presence = IMPLICIT];
  uint32 missing = 10 [features.field_presence = IMPLICIT];
  uint32 unknown = 11 [features.field_presence = IMPLICIT];
  // How the differences were settled: moved to where they were seen,
  // reported lost -- the losses -- or ignored; and those not settled yet.
  uint32 moved = 12 [features.field_presence = IMPLICIT];
  uint32 lost = 13 [features.field_presence = IMPLICIT];
  uint32 ignored = 14 [features.field_presence = IMPLICIT];
  uint32 unsettled = 15 [features.field_presence = IMPLICIT];
}

message CountFindingAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string desc = 6 [features.field_presence = IMPLICIT];
  InventoryCountRef count = 8;
  AssetRef asset = 9;
  bytes label_id = 10;
  string kind = 11 [features.field_presence = IMPLICIT];
  bytes observed_parent_id = 12;
  google.protobuf.Timestamp date_created = 15;
  bytes expected_parent_id = 16;
  google.protobuf.Timestamp seen_at = 17;
  bytes recorded_by = 18;
  string resolution = 19 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp resolved_at = 20;
}

message CountFindingGetRequest {
  CountFindingRef ref = 1;
  CountFindingSelect select = 2;
}

message CountFindingSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool desc = 6;
  InventoryCountSelect count = 8;
  AssetSelect asset = 9;
  bool label_id = 10;
  bool kind = 11;
  bool observed_parent_id = 12;
  bool date_updated = 13;
  bool date_created = 15;
  bool expected_parent_id = 16;
  bool seen_at = 17;
  bool recorded_by = 18;
  bool resolution = 19;
  bool resolved_at = 20;
}

