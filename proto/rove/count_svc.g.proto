  bool date_updated_force = 27;
  bytes expected_parent_id = 32;
  // Clear expected_parent_id instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and expected_parent_id clears.
  bool expected_parent_id_null = 33;
  google.protobuf.Timestamp seen_at = 34;
  bytes recorded_by = 36;
  // Clear recorded_by instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and recorded_by clears.
  bool recorded_by_null = 37;
  string resolution = 38;
  google.protobuf.Timestamp resolved_at = 40;
  // Clear resolved_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and resolved_at clears.
  bool resolved_at_null = 41;
}

message CountFindingApplyRequest {
  CountFindingRef ref = 1;
  patch.Patch patch = 2;
}

