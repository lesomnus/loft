}

message ReservationCalendarRequest {
  repeated AssetRef resources = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Only the caller's own.
  bool mine = 4 [features.field_presence = IMPLICIT];
  // Only the ones in these states: `requested` is what waits for a manager.
  repeated string statuses = 5;
}

message ReservationCalendarResponse {
  repeated CalendarEntry entries = 1;
}

message CalendarEntry {
  Reservation reservation = 1;
  repeated bytes resource_ids = 2;
  string party_name = 3 [features.field_presence = IMPLICIT];
  // What it waits for while it is still to be fulfilled: the members of a
  // kit it should take with it that something else holds then, and what it
  // booked of a pool that has fewer to give then (design 4).
  repeated ReservationConflict conflicts = 4;
  // What it takes that is out of use while it is still to be fulfilled:
  // what it booked, whatever it is, or an item a kit it booked takes with it,
  // kept in the kit as it went (design 4, D42, D43). Nothing hands it over,
  // and what it booked is not approved, confirmed or fulfilled.
  repeated ReservationOutOfUse out_of_use = 5;
}

// ReservationConflict is what a reservation booked, or should take with what
// it booked, and does not hold: a member of a kit, which the kit was given
// after the reservation was made and something else held then; or some of a
// pool, which had fewer to give since -- a member taken off it or out of use,
// one whose own time was taken -- than the reservations made before it hold.
// The reservation takes it once there is room.
message ReservationConflict {
  // The member, or the pool, by what it is tagged and called.
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  string resource_tag = 2 [features.field_presence = IMPLICIT];
  string resource_name = 3 [features.field_presence = IMPLICIT];
  // The time the reservation would take it for.
  google.protobuf.Timestamp begins_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // What holds it then -- another reservation, maintenance -- as a calendar
  // shows it: of a pool, its reservations and what takes its members' own
  // time. None once nothing does, and it is taken shortly.
  repeated BusySpan held_by = 6;
  // Of a pool: how many of it the reservation waits for, and how many of
  // them it could have at the busiest moment of that time. Both zero for a
  // member of a kit, which is one.
  uint32 units = 7 [features.field_presence = IMPLICIT];
  uint32 available = 8 [features.field_presence = IMPLICIT];
}

// ReservationOutOfUse is what a reservation takes that is lost, retired or
// disposed, and is said until it is in use again or taken off its kit: what
// it booked itself, of any kind -- which it is then neither approved nor
// confirmed with, a space of which is not checked into and a kit or a group
// not picked up, and an item of which its pickup does not hand over -- or an
// item a kit it booked takes with it, held or waited for, which its pickup
// does not hand over (D42, D43). A pool's members are none of it: what a pool
// gives is the ones in use, and one fewer is a pool's conflict.
message ReservationOutOfUse {
  // What it is, by what it is tagged and called.
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  string resource_tag = 2 [features.field_presence = IMPLICIT];
  string resource_name = 3 [features.field_presence = IMPLICIT];
  // lost | retired | disposed
  string status = 4 [features.field_presence = IMPLICIT];
  // item | space | kit | group
  string resource_kind = 5 [features.field_presence = IMPLICIT];
}

