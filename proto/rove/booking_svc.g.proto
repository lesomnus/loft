edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/asset_svc.g.proto";
import "rove/booking.proto";
import "rove/org_svc.g.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service BookableService {
  // Add creates a new Bookable
  rpc Add(BookableAddRequest) returns (Bookable);
  // Get retrieves a Bookable
  rpc Get(BookableGetRequest) returns (Bookable);
  // Patch updates an existing Bookable
  rpc Patch(BookablePatchRequest) returns (Bookable);
  // Apply applies a patch document to an existing Bookable
  rpc Apply(BookableApplyRequest) returns (Bookable);
  // Erase deletes a Bookable
  rpc Erase(BookableRef) returns (BookableEraseResponse);
  // List reads Bookables a page at a time.
  rpc List(BookableListRequest) returns (BookableListResponse);
  // Watch the Bookables this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(BookableWatchRequest) returns (stream BookableWatchResponse);
  rpc Update(BookableUpdateRequest) returns (Bookable);
  // Availability answers when resources are taken between two moments.
  rpc Availability(BookableAvailabilityRequest) returns (BookableAvailabilityResponse);
  // Usage is each bookable resource over a period (예약 이용률, design 9.14):
  // the reservations that began in it and were promised their time, the
  // hours they booked against the hours they were used -- from the check-in
  // or the pickup to the return or the finish -- and the ones nobody came
  // for. It names nobody.
  rpc Usage(BookableUsageRequest) returns (BookableUsageResponse);
  // ExportUsage writes it as a CSV, which names nobody and so is no download
  // of anybody (rove#136).
  rpc ExportUsage(BookableUsageRequest) returns (AssetExportResponse);
}

service ReservationService {
  // Add creates a new Reservation
  rpc Add(ReservationAddRequest) returns (Reservation);
  // Get retrieves a Reservation
  rpc Get(ReservationGetRequest) returns (Reservation);
  // Patch updates an existing Reservation
  rpc Patch(ReservationPatchRequest) returns (Reservation);
  // Apply applies a patch document to an existing Reservation
  rpc Apply(ReservationApplyRequest) returns (Reservation);
  // Erase deletes a Reservation
  rpc Erase(ReservationRef) returns (ReservationEraseResponse);
  // List reads Reservations a page at a time.
  rpc List(ReservationListRequest) returns (ReservationListResponse);
  // Watch the Reservations this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(ReservationWatchRequest) returns (stream ReservationWatchResponse);
  // Confirm turns a hold into a request or a confirmed reservation.
  rpc Confirm(ReservationDecideRequest) returns (Reservation);
  rpc Approve(ReservationDecideRequest) returns (Reservation);
  rpc Reject(ReservationDecideRequest) returns (Reservation);
  rpc Cancel(ReservationDecideRequest) returns (Reservation);
  rpc CheckIn(ReservationDecideRequest) returns (Reservation);
  rpc Complete(ReservationDecideRequest) returns (Reservation);
  // Calendar answers reservations touching a span, for one resource or all.
  rpc Calendar(ReservationCalendarRequest) returns (ReservationCalendarResponse);
  // Timeline answers a reservation's history, newest first: what was done
  // with it -- booked, decided, checked into, let go of -- and what it took
  // and let go of as what it booked changed, with the hand-overs that
  // fulfilled it, its pickup and its return. A member reads their own, and
  // whoever runs or audits the register anybody's (D45).
  rpc Timeline(ReservationTimelineRequest) returns (ReservationTimelineResponse);
}

service ReservationItemService {
  // Add creates a new ReservationItem
  rpc Add(ReservationItemAddRequest) returns (ReservationItem);
  // Get retrieves a ReservationItem
  rpc Get(ReservationItemGetRequest) returns (ReservationItem);
  // Patch updates an existing ReservationItem
  rpc Patch(ReservationItemPatchRequest) returns (ReservationItem);
  // Apply applies a patch document to an existing ReservationItem
  rpc Apply(ReservationItemApplyRequest) returns (ReservationItem);
  // Erase deletes a ReservationItem
  rpc Erase(ReservationItemRef) returns (ReservationItemEraseResponse);
  // List reads ReservationItems a page at a time.
  rpc List(ReservationItemListRequest) returns (ReservationItemListResponse);
}

service AllocationService {
  // Add creates a new Allocation
  rpc Add(AllocationAddRequest) returns (Allocation);
  // Get retrieves a Allocation
  rpc Get(AllocationGetRequest) returns (Allocation);
  // Patch updates an existing Allocation
  rpc Patch(AllocationPatchRequest) returns (Allocation);
  // Apply applies a patch document to an existing Allocation
  rpc Apply(AllocationApplyRequest) returns (Allocation);
  // Erase deletes a Allocation
  rpc Erase(AllocationRef) returns (AllocationEraseResponse);
  // List reads Allocations a page at a time.
  rpc List(AllocationListRequest) returns (AllocationListResponse);
}

message BookableAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  AssetRef asset = 8;
  string timezone = 9 [features.field_presence = IMPLICIT];
  OpeningHours hours = 10;
  int32 buffer_before = 11 [features.field_presence = IMPLICIT];
  int32 buffer_after = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  bool approval = 16 [features.field_presence = IMPLICIT];
  int32 min_minutes = 17 [features.field_presence = IMPLICIT];
  int32 max_minutes = 18 [features.field_presence = IMPLICIT];
  int32 horizon_days = 19 [features.field_presence = IMPLICIT];
  uint32 units = 20 [features.field_presence = IMPLICIT];
  string exclusive_group = 21 [features.field_presence = IMPLICIT];
  uint64 schedule_version = 22 [features.field_presence = IMPLICIT];
  bool enabled = 23 [features.field_presence = IMPLICIT];
}

message BookableGetRequest {
  BookableRef ref = 1;
  BookableSelect select = 2;
}

message BookableRef {
  oneof key {
    bytes id = 1;
    BookableRefByAsset asset = 8;
  }
}

message BookableRefByAsset {
  AssetRef asset = 8;
}

message BookableSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  AssetSelect asset = 8;
  bool timezone = 9;
  bool hours = 10;
  bool buffer_before = 11;
  bool buffer_after = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool approval = 16;
  bool min_minutes = 17;
  bool max_minutes = 18;
  bool horizon_days = 19;
  bool units = 20;
  bool exclusive_group = 21;
  bool schedule_version = 22;
  bool enabled = 23;
}

message BookablePatchRequest {
  BookableRef ref = 1;
  string timezone = 18;
  OpeningHours hours = 20;
  // Clear hours instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and hours clears.
  bool hours_null = 21;
  int32 buffer_before = 22;
  int32 buffer_after = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  bool approval = 32;
  int32 min_minutes = 34;
  int32 max_minutes = 36;
  int32 horizon_days = 38;
  uint32 units = 40;
  string exclusive_group = 42;
  uint64 schedule_version = 44;
  bool enabled = 46;
}

message BookableApplyRequest {
  BookableRef ref = 1;
  patch.Patch patch = 2;
}

message BookableEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message BookableListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated BookableFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message BookableListResponse {
  repeated Bookable items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message BookableFilter {
  BookableRef ref = 1;
  AssetRef asset = 2;
  string exclusive_group = 3;
  bool enabled = 4;
}

message BookableWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated BookableFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message BookableWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated BookableWatchItem items = 1;
}

message BookableWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Bookable value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message BookableUpdateRequest {
  BookableRef ref = 1;
  string timezone = 2 [features.field_presence = IMPLICIT];
  OpeningHours hours = 3;
  bool hours_null = 4 [features.field_presence = IMPLICIT];
  int32 buffer_before = 5 [features.field_presence = IMPLICIT];
  int32 buffer_after = 6 [features.field_presence = IMPLICIT];
  bool approval = 7 [features.field_presence = IMPLICIT];
  int32 min_minutes = 8 [features.field_presence = IMPLICIT];
  int32 max_minutes = 9 [features.field_presence = IMPLICIT];
  int32 horizon_days = 10 [features.field_presence = IMPLICIT];
  uint32 units = 11 [features.field_presence = IMPLICIT];
  string exclusive_group = 12 [features.field_presence = IMPLICIT];
  bool enabled = 13 [features.field_presence = IMPLICIT];
}

message BookableAvailabilityRequest {
  repeated AssetRef resources = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message BookableAvailabilityResponse {
  repeated BusySpan busy = 1;
}

message BusySpan {
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp begins_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  // reservation | maintenance | override | waiting | closed
  string kind = 4 [features.field_presence = IMPLICIT];
  bytes ref_id = 5 [features.field_presence = IMPLICIT];
  uint32 units = 6 [features.field_presence = IMPLICIT];
  bool blocking = 7 [features.field_presence = IMPLICIT];
  string label = 8 [features.field_presence = IMPLICIT];
}

message BookableUsageRequest {
  // The period, from `from` and before `to`, a year at most. Unsaid, the last
  // thirty of the workspace's days, today among them.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message BookableUsageResponse {
  // Every resource that may be booked, and every one booked in the period
  // that may no longer be, by tag.
  repeated BookableUsageRow rows = 1;
  // The period it read.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// BookableUsageRow is one resource's reservations that began in a period.
message BookableUsageRow {
  bytes resource_id = 1 [features.field_presence = IMPLICIT];
  string tag = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
  // item | space | kit | group
  string kind = 4 [features.field_presence = IMPLICIT];
  // How many it gives at once: 1, or a pool's.
  uint32 units = 5 [features.field_presence = IMPLICIT];
  // The reservations promised their time -- confirmed, in use, completed or
  // no-show -- and of them the ones that were used, and the ones nobody came
  // for.
  uint32 reservations = 6 [features.field_presence = IMPLICIT];
  uint32 used = 7 [features.field_presence = IMPLICIT];
  uint32 no_shows = 8 [features.field_presence = IMPLICIT];
  // In minutes, the time they booked and the time they were used: of a pool,
  // times the units each took.
  uint64 booked_minutes = 9 [features.field_presence = IMPLICIT];
  uint64 used_minutes = 10 [features.field_presence = IMPLICIT];
}

message ReservationAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  PartyRef party = 8;
  bytes requested_by = 9;
  string status = 10 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp begins_at = 11;
  google.protobuf.Timestamp ends_at = 12;
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp expires_at = 16;
  string rrule = 17 [features.field_presence = IMPLICIT];
  bytes series_id = 18;
  bytes decided_by = 19;
  google.protobuf.Timestamp checked_in_at = 20;
  repeated ReservationItemSpec items = 100;
  // Hold only: take the time for a few minutes while the rest is decided.
  bool hold = 101;
  bytes op = 102;
  // Book it again by this rule (RFC 5545): FREQ=WEEKLY;COUNT=4 and the like.
  string repeat = 103;
  // Book over a conflict, on purpose: the allocation does not block, and the
  // reason is required (design 4). A manager's to do.
  bool override = 104;
  string reason = 105;
}

message ReservationItemSpec {
  AssetRef resource = 1;
  uint32 units = 2 [features.field_presence = IMPLICIT];
}

