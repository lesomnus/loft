edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/org.proto";
import "rove/payday/holder.proto";
import "rove/payday/holder_svc.g.proto";
import "rove/payday/tenant.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service PartyService {
  // Add creates a new Party
  rpc Add(PartyAddRequest) returns (Party);
  // Get retrieves a Party
  rpc Get(PartyGetRequest) returns (Party);
  // Patch updates an existing Party
  rpc Patch(PartyPatchRequest) returns (Party);
  // Apply applies a patch document to an existing Party
  rpc Apply(PartyApplyRequest) returns (Party);
  // Erase deletes a Party
  rpc Erase(PartyRef) returns (PartyEraseResponse);
  // List reads Partys a page at a time.
  rpc List(PartyListRequest) returns (PartyListResponse);
  // Watch the Partys this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(PartyWatchRequest) returns (stream PartyWatchResponse);
  // Me answers who is calling: the account, the person it is, the tenant and
  // the role.
  rpc Me(PartyMeRequest) returns (PartyMeResponse);
  // Update changes a party's own fields.
  rpc Update(PartyUpdateRequest) returns (Party);
  // Invite gives a person a login: a holder, a password, and the role.
  rpc Invite(PartyInviteRequest) returns (PartyInviteResponse);
  rpc SetRole(PartySetRoleRequest) returns (Party);
  // SetPassword changes the caller's own password, or -- for an admin --
  // somebody else's.
  rpc SetPassword(PartySetPasswordRequest) returns (PartySetPasswordResponse);
  // Deactivate ends a person's login and keeps the person.
  rpc Deactivate(PartyDeactivateRequest) returns (Party);
  // Pseudonymize answers a request to forget a person (design 8.2).
  rpc Pseudonymize(PartyPseudonymizeRequest) returns (Party);
}

service SessionService {
  // Add creates a new Session
  rpc Add(SessionAddRequest) returns (Session);
  // Get retrieves a Session
  rpc Get(SessionGetRequest) returns (Session);
  // Patch updates an existing Session
  rpc Patch(SessionPatchRequest) returns (Session);
  // Apply applies a patch document to an existing Session
  rpc Apply(SessionApplyRequest) returns (Session);
  // Erase deletes a Session
  rpc Erase(SessionRef) returns (SessionEraseResponse);
}

service InvitationService {
  // Add creates a new Invitation
  rpc Add(InvitationAddRequest) returns (Invitation);
  // Get retrieves a Invitation
  rpc Get(InvitationGetRequest) returns (Invitation);
  // Patch updates an existing Invitation
  rpc Patch(InvitationPatchRequest) returns (Invitation);
  // Apply applies a patch document to an existing Invitation
  rpc Apply(InvitationApplyRequest) returns (Invitation);
  // Erase deletes a Invitation
  rpc Erase(InvitationRef) returns (InvitationEraseResponse);
  // List reads Invitations a page at a time.
  rpc List(InvitationListRequest) returns (InvitationListResponse);
  // Revoke takes back an invitation nobody has answered.
  rpc Revoke(InvitationRevokeRequest) returns (Invitation);
  // Claim makes the invitation a mail carried a code for the caller's: the
  // proof is reading that mailbox, for an account roster holds no checked
  // address of.
  rpc Claim(InvitationClaimRequest) returns (Invitation);
  // Accept makes the caller a member of the workspace, as what it says.
  rpc Accept(InvitationAcceptRequest) returns (Invitation);
  // Deny says no.
  rpc Deny(InvitationDenyRequest) returns (Invitation);
}

service CliLoginService {
  // Add creates a new CliLogin
  rpc Add(CliLoginAddRequest) returns (CliLogin);
  // Get retrieves a CliLogin
  rpc Get(CliLoginGetRequest) returns (CliLogin);
  // Patch updates an existing CliLogin
  rpc Patch(CliLoginPatchRequest) returns (CliLogin);
  // Apply applies a patch document to an existing CliLogin
  rpc Apply(CliLoginApplyRequest) returns (CliLogin);
  // Erase deletes a CliLogin
  rpc Erase(CliLoginRef) returns (CliLoginEraseResponse);
}

service AliasHoldService {
