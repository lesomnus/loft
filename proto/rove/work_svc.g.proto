  google.protobuf.Timestamp ends_at = 6;
  int64 cost = 7 [features.field_presence = IMPLICIT];
  string currency = 8 [features.field_presence = IMPLICIT];
  bool blocking = 9 [features.field_presence = IMPLICIT];
}

message WorkOrderCompleteRequest {
  WorkOrderRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
  int64 cost = 3 [features.field_presence = IMPLICIT];
  // The condition the asset is in afterwards.
  string condition = 4 [features.field_presence = IMPLICIT];
}

