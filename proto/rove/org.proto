edition = "2023";

package rove;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "rove/payday/holder.proto";
import "rove/payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/rove";

// Party is a person, a team, an organization or a vendor: whoever an asset is
// owned by, managed by or held by. Personal data lives here and nowhere else;
// history rows name a party by its identifier (design 3.1, D13).
message Party {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // What a party is called, what is said and labelled of it, how it is reached
  // and the number it goes by are personal (payday#92): the trail records that
  // one was set and never to what. The row is where a person is corrected and
  // pseudonymized, and the trail is the copy nothing rewrites. A team's name
  // is declared with a person's -- a field that is sometimes about a person is
  // about a person -- so a team renamed is on the trail as `name` set.
  string name = 5 [(payday.field) = {personal: true}];
  string desc = 6 [(payday.field) = {personal: true}];
  map<string, string> labels = 7 [(payday.field) = {personal: true}];

  // person | team | org | vendor
  string kind = 8;
  // The team a person is in, or the organization a team is in.
  bytes parent_id = 9 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];
  // The login account, for a person who has one. Named after its target:
  // a unique index over an edge named otherwise does not generate
  // (protobuf-orm/protoc-gen-orm-ent#1).
  Holder holder = 10 [(orm.edge) = {nullable: true}];
  string email = 11 [(payday.field) = {personal: true}];
  string phone = 12 [(payday.field) = {personal: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // An employee number or a vendor code, free text.
  string code = 16 [(payday.field) = {personal: true}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]
      },
      {
        name: "holder"
        refs: [{name: "holder", number: 10}]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 10
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      by: [{name: "ref"}, {name: "kind"}, {name: "parent_id"}, {name: "holder"}, {name: "labels"}]
      size: 50
      max: 500
    }
    watch: {}
  };
}

// Domain 37 was `Credential`, a holder's password, until roster held them
// (design 9.10). It is not for another entity: an identifier in the trail of a
// deployment from before says what it named.

// Session is a signed-in browser, and what it names is an account rather than a
// membership: one sign-in reaches every workspace the account belongs to, and
// which one a request is about is the request's to say (design 9.11). So it is
// the deployment's and not any workspace's -- `global` -- and it is written
// only by the server, through ent (`server/session`); the policy opens no RPC
// of it. The key itself is never stored: `secret` is its SHA-256, which is
// what a cookie is looked up by.
message Session {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The account signed in: a holder at roster, in this deployment's
  // directory.
  bytes account = 8 [(orm.field) = {type: TYPE_UUID}];
  bytes secret = 9 [
    (orm.field) = {default: ""},
    (payday.field) = {secret: true}
  ];
  bytes grant = 10 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_expires = 11 [(orm.field) = {nullable: true}];
  google.protobuf.Timestamp date_idle = 12 [(orm.field) = {nullable: true}];

  // What the sign-in kept beside the session, as JSON: for one that came
  // through the issuer, its ID token, which is what signing out hands back to
  // it as `id_token_hint` (`server/sso`). Nothing reads it but that.
  bytes held = 16 [
    (orm.field) = {nullable: true},
    (payday.field) = {secret: true}
  ];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "secret"
        refs: [{name: "secret", number: 9}]
      },
      {
        name: "account"
        refs: [{name: "account", number: 8}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 38
    global: {}
  };
}


// Invitation is an account asked into a workspace, by address, with a role
// (design 9.11, M2 step 4).
//
// It is the workspace's row: who invited whom, as what, and what became of it
// are this workspace's history, and leave with it. Two sides read it -- the
// people who run the workspace, and the account it is addressed to, who is
// not a member yet and can read nothing here. So `InvitationService.List`,
// `Claim`, `Accept` and `Deny` are served as the account rather than as a
// membership (`cmd.AccountMethods`), and which rows each side reads is said by
// the domain layer, not by the wall (`server/domain/invitation.go`).
//
// # Whose it is
//
// The account whose address it is, and only an address somebody checked: one
// roster holds as verified, because any directory's administrator may put any
// address on a user of their own (nOAuth), or one whose link it was mailed with
// was opened by the account (`Claim`), since reading that mailbox is the proof.
// Nothing here says whether an address is anybody's: the people who invite
// learn what became of the invitation, and nothing about who was asked.
message Invitation {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Who invited: their membership of this workspace.
  Holder inviter = 8 [(orm.edge) = {immutable: true}];

  // The address it was sent to, folded as an address is compared. Written
  // once, and emptied when the person it was for is forgotten -- by the
  // workspace, or by their account leaving (`server/domain/depart.go`) -- which
  // is the one write it takes and why it is not immutable. Personal
  // (payday#92): on the trail as having been set, and never as what to.
  string email = 9 [(payday.field) = {personal: true}];

  // What an account that accepts is here.
  string role = 10 [(orm.field) = {immutable: true}];

  // The person record an account that accepts becomes: one this workspace
  // already keeps, or empty for one made then.
  Party party = 11 [(orm.edge) = {nullable: true}];

  // The account it is for, once that is known -- its link was opened by it,
  // or it answered -- and empty while it is only an address.
  bytes account = 12 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // `pending`, `accepted`, `denied` or `revoked`. One still pending after
  // `date_expires` is expired, which is said where it is read rather than
  // written by a sweep.
  string state = 16;
  google.protobuf.Timestamp date_expires = 17 [(orm.field) = {default: ""}];
  // When it was answered or taken back.
  google.protobuf.Timestamp date_settled = 18 [(orm.field) = {nullable: true}];

  // The membership accepting it made.
  Holder holder = 19 [(orm.edge) = {nullable: true}];

  // The SHA-256 of the code its mail carried, until an account opens it.
  bytes claim = 20 [
    (orm.field) = {nullable: true},
    (payday.field) = {secret: true}
  ];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]
      },
      {
        name: "claim"
        refs: [{name: "claim", number: 20}]
      },
      {
        name: "account"
        refs: [{name: "account", number: 12}]
      },
      {
        name: "email"
        refs: [{name: "email", number: 9}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 41
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      by: [{name: "ref"}, {name: "tenant"}, {name: "account"}, {name: "state"}]
      size: 50
      max: 200
    }
  };
}


// CliLogin is a terminal asking to be signed in as whoever approves it in a
// browser (`rove login`).
//
// The terminal makes up the session key it will use, keeps it, and sends only
// its SHA-256: `secret` is what the session will be looked up by, exactly as a
// browser's is (`Session.secret`). A person signed in at the app approves the
// `code` the terminal shows them, and the approval makes that session for
// their account. So no key is written here or sent back, and the row holds
// nothing a reader of the database could sign in with. It is the
// deployment's (`global`), written only through ent by `server/clilogin`,
// and the policy opens no RPC of it.
message CliLogin {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // What the session's key hashes to, as `Session.secret`.
  bytes secret = 8 [
    (orm.field) = {default: ""},
    (payday.field) = {secret: true}
  ];

  // What the terminal shows and the person approves: eight letters and
  // digits that read aloud, good for one approval.
  string code = 9;

  // What the terminal says it is, and where it asked from: what the page
  // shows, so that a person approves their own terminal and nobody else's.
  string client = 10;
  string origin = 11;

  // Where it asked from, without what the terminal says it is: what the limit
  // on how many sign-ins one address may start in a while is counted by
  // (`server/clilogin`).
  string address = 18 [(orm.field) = {default: ""}];

  // The account that approved it, once one has.
  bytes account = 12 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];

  // What the terminal asked to be allowed, which the page shows and the
  // session it gets is narrowed to: `Session.grant`'s bytes. Empty is all
  // that the account may do (`rove login --allow`, D33).
  bytes grant = 19 [(orm.field) = {default: ""}];

  // `pending`, `approved` or `denied`. One still pending after
  // `date_expires` is expired, which is said where it is read.
  string state = 16;
  google.protobuf.Timestamp date_expires = 17 [(orm.field) = {default: ""}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "code"
        refs: [{name: "code", number: 9}]
      },
      {
        name: "secret"
        refs: [{name: "secret", number: 8}]
      },
      {
        name: "address"
        refs: [
          {name: "address", number: 18},
          {name: "date_created", number: 15}
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 42
    global: {}
  };
}


// AliasHold is a workspace address nobody may take for a while: one a
// destroyed workspace went by, or one a workspace was moved off (D29, design
// 8.4). A name that found somebody is still how people find them -- bookmarks,
// links in old mail -- and a workspace that took it the next day would be that
// name to all of them. A renamed one is also sent on to where it moved.
//
// The deployment's (`global`), written only by `server/tenancy`, and the
// policy opens no RPC of it.
message AliasHold {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The address held.
  string held = 8;

  // `destroyed` or `renamed`, and for a rename the address it moved to.
  string reason = 9;
  string moved_to = 10;

  // Whose it was.
  bytes tenant = 11 [(orm.field) = {type: TYPE_UUID}];

  // Until when nobody may take it.
  google.protobuf.Timestamp date_until = 16 [(orm.field) = {default: ""}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "held"
        refs: [{name: "held", number: 8}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 43
    global: {}
  };
}

// Consent is an account agreeing to one of what this deployment asks of it --
// its terms of use, its privacy policy -- at one version, then (design 9.11).
// A new version is agreed to again, as a row of its own, and none is changed:
// what an account agreed to and when is what these rows are kept for.
//
// The deployment's (`global`), and an account's rather than a workspace's: it
// agrees once for every workspace it is in. Written only by `server/consent`,
// and the policy opens no RPC of it.
message Consent {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The account that agreed: roster's, as a session names it (D27).
  bytes account = 8 [(orm.field) = {type: TYPE_UUID}];

  // What it agreed to -- `terms` or `privacy` -- and the version of it in
  // force then (`app.consent`).
  string document = 9;
  string version = 10;

  // Where it agreed: `web` or `cli`.
  string client = 11;

  // When the account left this deployment ([lifecycle.Lifecycle.Depart]):
  // the agreement is kept from then for `app.consent.keep`, and forever when
  // that says nothing (rove#35). It still counts while it is kept -- an
  // account that comes back agreed to what it agreed to. Null while the
  // account is here.
  google.protobuf.Timestamp date_left = 12 [(orm.field) = {nullable: true}];

  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "agreed"
        refs: [
          {name: "account", number: 8},
          {name: "document", number: 9},
          {name: "version", number: 10}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 44
    global: {}
  };
}


// SignInFailure is one wrong answer at the sign-in form, counted against the
// address it came from and the name it was for (`server/session`): ten in
// fifteen minutes and the form refuses that pair for a while.
//
// A row, so that every process of a deployment counts the same failures. A
// count in each process's memory is a limit per process, and a deployment of
// several would have been that many times as easy to guess at. Nothing reads
// one older than the window, and the sweep takes those away. It is the
// deployment's (`global`), written only through ent by `server/session`, and
// the policy opens no RPC of it.
message SignInFailure {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // What the address and the name the failure was for hash to. It keeps the
  // pair out of plain sight, and no more than that: both halves can be guessed
  // -- an address space, a directory's names -- so a reader of the table who
  // tries them can tell whose a row is. What keeps it from saying much is that
  // nothing older than the window is kept.
  bytes subject = 8 [
    (orm.field) = {default: ""},
    (payday.field) = {secret: true}
  ];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "subject"
        refs: [
          {name: "subject", number: 8},
          {name: "date_created", number: 15}
        ]
      },
      {
        name: "date_created"
        refs: [{name: "date_created", number: 15}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 45
    global: {}
    erase: {hard: {}}
  };
}
