edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/ops.proto";
import "rove/payday/holder_svc.g.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service NotificationService {
  // Add creates a new Notification
  rpc Add(NotificationAddRequest) returns (Notification);
  // Get retrieves a Notification
  rpc Get(NotificationGetRequest) returns (Notification);
  // Patch updates an existing Notification
  rpc Patch(NotificationPatchRequest) returns (Notification);
  // Apply applies a patch document to an existing Notification
  rpc Apply(NotificationApplyRequest) returns (Notification);
  // Erase deletes a Notification
  rpc Erase(NotificationRef) returns (NotificationEraseResponse);
  // List reads Notifications a page at a time.
  rpc List(NotificationListRequest) returns (NotificationListResponse);
  rpc Inbox(NotificationInboxRequest) returns (NotificationInboxResponse);
  rpc MarkRead(NotificationMarkReadRequest) returns (NotificationMarkReadResponse);
  // SetMail is whether the caller is mailed what they are told of in this
  // workspace, as well as told in the app. Their own, and nobody else's.
  rpc SetMail(NotificationSetMailRequest) returns (NotificationSetMailResponse);
}

service UsageSnapshotService {
  // Add creates a new UsageSnapshot
  rpc Add(UsageSnapshotAddRequest) returns (UsageSnapshot);
  // Get retrieves a UsageSnapshot
  rpc Get(UsageSnapshotGetRequest) returns (UsageSnapshot);
  // Patch updates an existing UsageSnapshot
  rpc Patch(UsageSnapshotPatchRequest) returns (UsageSnapshot);
  // Apply applies a patch document to an existing UsageSnapshot
  rpc Apply(UsageSnapshotApplyRequest) returns (UsageSnapshot);
  // Erase deletes a UsageSnapshot
  rpc Erase(UsageSnapshotRef) returns (UsageSnapshotEraseResponse);
  // List reads UsageSnapshots a page at a time.
  rpc List(UsageSnapshotListRequest) returns (UsageSnapshotListResponse);
}

service TenantContractService {
  // Add creates a new TenantContract
  rpc Add(TenantContractAddRequest) returns (TenantContract);
  // Get retrieves a TenantContract
  rpc Get(TenantContractGetRequest) returns (TenantContract);
  // Patch updates an existing TenantContract
  rpc Patch(TenantContractPatchRequest) returns (TenantContract);
  // Apply applies a patch document to an existing TenantContract
  rpc Apply(TenantContractApplyRequest) returns (TenantContract);
  // Erase deletes a TenantContract
  rpc Erase(TenantContractRef) returns (TenantContractEraseResponse);
  // List reads TenantContracts a page at a time.
  rpc List(TenantContractListRequest) returns (TenantContractListResponse);
}

service LegalHoldService {
  // Add creates a new LegalHold
  rpc Add(LegalHoldAddRequest) returns (LegalHold);
