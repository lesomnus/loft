edition = "2023";
package rove;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "rove/asset.proto";
import "rove/catalog_svc.g.proto";
import "rove/org_svc.g.proto";
import "rove/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/rove";

service AssetService {
  // Add creates a new Asset
  rpc Add(AssetAddRequest) returns (Asset);
  // Get retrieves a Asset
  rpc Get(AssetGetRequest) returns (Asset);
  // Patch updates an existing Asset
  rpc Patch(AssetPatchRequest) returns (Asset);
  // Apply applies a patch document to an existing Asset
  rpc Apply(AssetApplyRequest) returns (Asset);
  // Erase deletes a Asset
  rpc Erase(AssetRef) returns (AssetEraseResponse);
  // List reads Assets a page at a time.
  rpc List(AssetListRequest) returns (AssetListResponse);
  // Watch the Assets this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(AssetWatchRequest) returns (stream AssetWatchResponse);
  // Move puts an asset inside another from a moment on: on a shelf, into a
  // computer, into a rack at a U position. Without `to` it takes it out of
  // wherever it was.
  rpc Move(AssetMoveRequest) returns (Asset);
  // SetAttributes changes what an asset is from a moment on: its name, status,
  // condition, type, model or any attribute.
  rpc SetAttributes(AssetSetAttributesRequest) returns (Asset);
  // Assign makes a party the owner, manager or custodian from a moment on, or
  // ends the role.
  rpc Assign(AssetAssignRequest) returns (Asset);
  // Relate adds or ends a logical relation: membership of a kit or a group.
  // (Not `Link`: an RPC named after an entity collides with the stack's
  // accessor for it.)
  rpc Relate(AssetRelateRequest) returns (Asset);
  // Correct fixes the past: a time row was wrong, or happened at another
  // time. The old row is superseded, never edited (design 3.3).
  rpc Correct(AssetCorrectRequest) returns (Asset);
  rpc Timeline(AssetTimelineRequest) returns (AssetTimelineResponse);
  // QueryAt answers an asset and everything inside it as it was at `at`, by
  // what is known now -- or by what was known at `known`, which is AsOf.
  rpc QueryAt(AssetQueryAtRequest) returns (AssetQueryAtResponse);
  rpc Diff(AssetDiffRequest) returns (AssetDiffResponse);
  rpc Search(AssetSearchRequest) returns (AssetSearchResponse);
  rpc Report(AssetReportRequest) returns (AssetReportResponse);
  rpc Import(AssetImportRequest) returns (AssetImportResponse);
  rpc Export(AssetExportRequest) returns (AssetExportResponse);
}

service TreeLockService {
  // Add creates a new TreeLock
  rpc Add(TreeLockAddRequest) returns (TreeLock);
  // Get retrieves a TreeLock
  rpc Get(TreeLockGetRequest) returns (TreeLock);
  // Patch updates an existing TreeLock
  rpc Patch(TreeLockPatchRequest) returns (TreeLock);
  // Apply applies a patch document to an existing TreeLock
  rpc Apply(TreeLockApplyRequest) returns (TreeLock);
  // Erase deletes a TreeLock
  rpc Erase(TreeLockRef) returns (TreeLockEraseResponse);
}

service TenantDomainService {
  // Add creates a new TenantDomain
  rpc Add(TenantDomainAddRequest) returns (TenantDomain);
  // Get retrieves a TenantDomain
  rpc Get(TenantDomainGetRequest) returns (TenantDomain);
  // Patch updates an existing TenantDomain
  rpc Patch(TenantDomainPatchRequest) returns (TenantDomain);
  // Apply applies a patch document to an existing TenantDomain
  rpc Apply(TenantDomainApplyRequest) returns (TenantDomain);
  // Erase deletes a TenantDomain
  rpc Erase(TenantDomainRef) returns (TenantDomainEraseResponse);
  // List reads TenantDomains a page at a time.
  rpc List(TenantDomainListRequest) returns (TenantDomainListResponse);
  // Watch the TenantDomains this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(TenantDomainWatchRequest) returns (stream TenantDomainWatchResponse);
  // Verify checks the TXT record of a pending custom domain.
  rpc Verify(TenantDomainVerifyRequest) returns (TenantDomain);
  // Activate makes a verified domain the one new labels are printed with; the
  // active one before it becomes legacy and keeps resolving.
  rpc Activate(TenantDomainActivateRequest) returns (TenantDomain);
  rpc Retire(TenantDomainRetireRequest) returns (TenantDomain);
  // Status answers whether labels are on for this tenant, and with what.
  rpc Status(TenantDomainStatusRequest) returns (TenantDomainStatusResponse);
}

service LabelService {
  // Add creates a new Label
  rpc Add(LabelAddRequest) returns (Label);
  // Get retrieves a Label
  rpc Get(LabelGetRequest) returns (Label);
  // Patch updates an existing Label
  rpc Patch(LabelPatchRequest) returns (Label);
  // Apply applies a patch document to an existing Label
  rpc Apply(LabelApplyRequest) returns (Label);
  // Erase deletes a Label
  rpc Erase(LabelRef) returns (LabelEraseResponse);
  // List reads Labels a page at a time.
  rpc List(LabelListRequest) returns (LabelListResponse);
  // Watch the Labels this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(LabelWatchRequest) returns (stream LabelWatchResponse);
  // Print makes labels for the tenant's active label domain: new ones to bind
  // later, or one for each asset given, bound already.
  rpc Print(LabelPrintRequest) returns (LabelPrintResponse);
  rpc Bind(LabelBindRequest) returns (Label);
  rpc Unbind(LabelUnbindRequest) returns (Label);
  // Resolve reads what a scanned code names.
  rpc Resolve(LabelResolveRequest) returns (LabelResolveResponse);
}

service AttachmentService {
  // Add creates a new Attachment
  rpc Add(AttachmentAddRequest) returns (Attachment);
  // Get retrieves a Attachment
  rpc Get(AttachmentGetRequest) returns (Attachment);
  // Patch updates an existing Attachment
  rpc Patch(AttachmentPatchRequest) returns (Attachment);
  // Apply applies a patch document to an existing Attachment
  rpc Apply(AttachmentApplyRequest) returns (Attachment);
  // Erase deletes a Attachment
  rpc Erase(AttachmentRef) returns (AttachmentEraseResponse);
  // List reads Attachments a page at a time.
  rpc List(AttachmentListRequest) returns (AttachmentListResponse);
  // Watch the Attachments this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(AttachmentWatchRequest) returns (stream AttachmentWatchResponse);
  rpc Upload(AttachmentUploadRequest) returns (Attachment);
  // Url answers a short-lived signed address to download the file.
  rpc Url(AttachmentUrlRequest) returns (AttachmentUrlResponse);
}

message AssetAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  string kind = 8 [features.field_presence = IMPLICIT];
  AssetTypeRef type = 9;
  ItemModelRef model = 10;
  string tag = 11 [features.field_presence = IMPLICIT];
  string serial = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  string status = 16 [features.field_presence = IMPLICIT];
  string condition = 17 [features.field_presence = IMPLICIT];
  bytes parent_id = 18;
  string placement_mode = 19 [features.field_presence = IMPLICIT];
  string slot = 20 [features.field_presence = IMPLICIT];
  PartyRef custodian = 21;
  map<string, string> attributes = 22;
  google.protobuf.Timestamp acquired_at = 23;
  google.protobuf.Timestamp disposed_at = 24;
  uint64 content_version = 25 [features.field_presence = IMPLICIT];
  // When the asset started being what the request says: the initial facts
  // and placement are valid from here. Empty is now.
  google.protobuf.Timestamp since = 100;
  // A client-minted Event id, so that a retry is the same operation.
  bytes op = 101;
  string reason = 102;
  // Where it is, from `since`. Taken from here rather than from parent_id so
  // that a mode and a slot come with it.
  AssetRef to = 103;
  string mode = 104;
}

message AssetRef {
  oneof key {
    bytes id = 1;
    AssetRefByTag tag = 11;
  }
}

message AssetRefByTag {
  string tag = 11;
  TenantRef tenant = 2;
}

message AssetGetRequest {
  AssetRef ref = 1;
  AssetSelect select = 2;
}

message AssetSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  bool kind = 8;
  AssetTypeSelect type = 9;
  ItemModelSelect model = 10;
  bool tag = 11;
  bool serial = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool status = 16;
  bool condition = 17;
  bool parent_id = 18;
  bool placement_mode = 19;
  bool slot = 20;
  PartySelect custodian = 21;
  bool attributes = 22;
  bool acquired_at = 23;
  bool disposed_at = 24;
  bool content_version = 25;
}

message AssetPatchRequest {
  AssetRef ref = 1;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  string kind = 16;
  AssetTypeRef type = 18;
  // Clear type instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and type clears.
  bool type_null = 19;
  ItemModelRef model = 20;
  // Clear model instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and model clears.
  bool model_null = 21;
  string tag = 22;
  string serial = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  string status = 32;
  string condition = 34;
  bytes parent_id = 36;
  // Clear parent_id instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and parent_id clears.
  bool parent_id_null = 37;
  string placement_mode = 38;
  string slot = 40;
  PartyRef custodian = 42;
  // Clear custodian instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and custodian clears.
  bool custodian_null = 43;
  map<string, string> attributes = 44;
  google.protobuf.Timestamp acquired_at = 46;
  // Clear acquired_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and acquired_at clears.
  bool acquired_at_null = 47;
  google.protobuf.Timestamp disposed_at = 48;
  // Clear disposed_at instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and disposed_at clears.
  bool disposed_at_null = 49;
  uint64 content_version = 50;
}

message AssetApplyRequest {
  AssetRef ref = 1;
  patch.Patch patch = 2;
}

message AssetEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message AssetListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated AssetFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message AssetListResponse {
  repeated Asset items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message AssetFilter {
  AssetRef ref = 1;
  string kind = 2;
  string status = 3;
  AssetTypeRef type = 4;
  ItemModelRef model = 5;
  bytes parent_id = 6;
  PartyRef custodian = 7;
  string tag = 8;
  map<string, string> labels = 9;
  map<string, string> attributes = 10;
}

message AssetWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated AssetFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message AssetWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated AssetWatchItem items = 1;
}

message AssetWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Asset value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message AssetMoveRequest {
  AssetRef ref = 1;
  // Where it goes. Absent: out of wherever it was.
  AssetRef to = 2;
  // located | installed | part
  string mode = 3 [features.field_presence = IMPLICIT];
  string slot = 4 [features.field_presence = IMPLICIT];
  int32 u_from = 5 [features.field_presence = IMPLICIT];
  int32 u_to = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 7;
  string reason = 8 [features.field_presence = IMPLICIT];
  bytes op = 9 [features.field_presence = IMPLICIT];
}

message AssetSetAttributesRequest {
  AssetRef ref = 1;
  // Keys: name, desc, status, condition, serial, tag, type, model, or an
  // attribute key. An empty value clears an attribute.
  map<string, string> set = 2;
  repeated string clear = 3;
  google.protobuf.Timestamp at = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message AssetAssignRequest {
  AssetRef ref = 1;
  // owner | manager | custodian
  string role = 2 [features.field_presence = IMPLICIT];
  // Absent ends the role.
  PartyRef party = 3;
  google.protobuf.Timestamp at = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message AssetRelateRequest {
  AssetRef ref = 1;
  AssetRef target = 2;
  // member_of | connected_to
  string kind = 3 [features.field_presence = IMPLICIT];
  bool required = 4 [features.field_presence = IMPLICIT];
  // End the relation instead of starting it.
  bool end = 5 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp at = 6;
  string reason = 7 [features.field_presence = IMPLICIT];
  bytes op = 8 [features.field_presence = IMPLICIT];
}

message AssetCorrectRequest {
  AssetRef ref = 1;
  // The time row being corrected: a placement, stewardship, link or fact.
  bytes row_id = 2 [features.field_presence = IMPLICIT];
  // It never happened.
  bool retract = 3 [features.field_presence = IMPLICIT];
  // It happened, but from this moment instead.
  google.protobuf.Timestamp valid_from = 4;
  string reason = 5 [features.field_presence = IMPLICIT];
  bytes op = 6 [features.field_presence = IMPLICIT];
}

message AssetTimelineRequest {
  AssetRef ref = 1;
  // Also the rows later corrections superseded.
  bool superseded = 2 [features.field_presence = IMPLICIT];
  // As the system knew it then.
  google.protobuf.Timestamp known = 3;
  uint32 limit = 4 [features.field_presence = IMPLICIT];
}

message AssetTimelineResponse {
  repeated TimelineEntry entries = 1;
}

message TimelineEntry {
  // placement | fact | stewardship | link | event
  string kind = 1 [features.field_presence = IMPLICIT];
  bytes row_id = 2 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp valid_from = 3;
  google.protobuf.Timestamp valid_to = 4;
  google.protobuf.Timestamp recorded_at = 5;
  google.protobuf.Timestamp superseded_at = 6;
  // What it says, for a person.
  string summary = 7 [features.field_presence = IMPLICIT];
  map<string, string> detail = 8;
  bytes event_id = 9 [features.field_presence = IMPLICIT];
  string event_kind = 10 [features.field_presence = IMPLICIT];
  string reason = 11 [features.field_presence = IMPLICIT];
  string actor = 12 [features.field_presence = IMPLICIT];
  bytes other_id = 13 [features.field_presence = IMPLICIT];
  string other_name = 14 [features.field_presence = IMPLICIT];
}

message AssetQueryAtRequest {
  AssetRef root = 1;
  google.protobuf.Timestamp at = 2;
  // AsOf: by what was recorded at this moment. Empty is what is known now.
  google.protobuf.Timestamp known = 3;
  // How deep under the root. Zero is everything.
  uint32 depth = 4 [features.field_presence = IMPLICIT];
}

message AssetQueryAtResponse {
  repeated AssetState items = 1;
}

// AssetState is one asset as it was at a moment.
message AssetState {
  bytes id = 1 [features.field_presence = IMPLICIT];
  bytes parent_id = 2 [features.field_presence = IMPLICIT];
  string mode = 3 [features.field_presence = IMPLICIT];
  string slot = 4 [features.field_presence = IMPLICIT];
  int32 u_from = 5 [features.field_presence = IMPLICIT];
  int32 u_to = 6 [features.field_presence = IMPLICIT];
  // name, status, condition, attr.<key> ... as they were.
  map<string, string> facts = 7;
  // role -> party id, and role -> party name.
  map<string, string> stewards = 8;
  map<string, string> steward_names = 9;
  uint32 depth = 10 [features.field_presence = IMPLICIT];
  string kind = 11 [features.field_presence = IMPLICIT];
  string tag = 12 [features.field_presence = IMPLICIT];
  bool existed = 13 [features.field_presence = IMPLICIT];
}

message AssetDiffRequest {
  AssetRef root = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message AssetDiffResponse {
  repeated AssetChange changes = 1;
}

message AssetChange {
  bytes id = 1 [features.field_presence = IMPLICIT];
  string tag = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
  // entered | left | moved | changed
  string what = 4 [features.field_presence = IMPLICIT];
  string field = 5 [features.field_presence = IMPLICIT];
  string before = 6 [features.field_presence = IMPLICIT];
  string after = 7 [features.field_presence = IMPLICIT];
}

message AssetSearchRequest {
  string q = 1 [features.field_presence = IMPLICIT];
  string kind = 2 [features.field_presence = IMPLICIT];
  string status = 3 [features.field_presence = IMPLICIT];
  AssetTypeRef type = 4;
  // Only what is inside this asset now, at any depth.
  AssetRef within = 5;
  uint32 size = 6 [features.field_presence = IMPLICIT];
  uint32 offset = 7 [features.field_presence = IMPLICIT];
  PartyRef custodian = 8;
}

message AssetSearchResponse {
  repeated Asset items = 1;
  uint32 total = 2 [features.field_presence = IMPLICIT];
}

message AssetReportRequest {
  // summary | custody | utilization | stock | work
  string kind = 1 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message AssetReportResponse {
  repeated ReportRow rows = 1;
}

message ReportRow {
  string group = 1 [features.field_presence = IMPLICIT];
  string key = 2 [features.field_presence = IMPLICIT];
  string label = 3 [features.field_presence = IMPLICIT];
  double value = 4 [features.field_presence = IMPLICIT];
  map<string, string> detail = 5;
}

message AssetImportRequest {
  // csv | xlsx
  string format = 1 [features.field_presence = IMPLICIT];
  bytes data = 2 [features.field_presence = IMPLICIT];
  // Report what would happen, change nothing.
  bool dry_run = 3 [features.field_presence = IMPLICIT];
}

message AssetImportResponse {
  uint32 created = 1 [features.field_presence = IMPLICIT];
  uint32 updated = 2 [features.field_presence = IMPLICIT];
  uint32 skipped = 3 [features.field_presence = IMPLICIT];
  repeated string errors = 4;
  repeated string warnings = 5;
}

message AssetExportRequest {
  // csv | xlsx
  string format = 1 [features.field_presence = IMPLICIT];
}

message AssetExportResponse {
  bytes data = 1 [features.field_presence = IMPLICIT];
  string content_type = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
}

message TreeLockAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  uint64 version = 8 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message TreeLockGetRequest {
  TreeLockRef ref = 1;
  TreeLockSelect select = 2;
}

message TreeLockRef {
  oneof key {
    bytes id = 1;
    TreeLockRefByTenant tenant = 2;
