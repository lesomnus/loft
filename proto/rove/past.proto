edition = "2023";

package rove;

import "google/protobuf/timestamp.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/rove";

// Rove keeps its past in payday's (payday#151): an Event for every operation,
// domain 17, and a Fact for every field of an asset from a moment on, domain
// 16 -- the numbers the two tables Rove had took, so that every identifier
// either ever minted still names the row it did.
option (payday.app) = {
  past: {event: 17, fact: 16}
};

// What an event holds, by the kind Rove has written it under since it began
// (design 8.2): a message of its own for each kind, named for what happened
// -- `asset.move` holds an `AssetMoved` -- unless it holds substantially what
// another kind of its domain holds, and then the two hold one message, named
// for the change they share: `stock.receive`, `stock.consume` and
// `stock.adjust` all hold a `StockChanged`. A message that holds several
// kinds lists, beside it, the fields each of them uses; a kind leaves the
// rest empty. A domain is what a kind says before its first `.`, `stock` of
// `stock.receive`.
//
// A new kind is held to the same: a message of its own, unless it and an
// existing kind of its domain hold the same fields, or one holds the other's
// and a field or two more and they are one change -- a variant of it, as a
// consumption is of a receipt, or the thing written again, as an edit is of
// what was made. Then the two hold one message. A kind that undoes another,
// or is another change that happens to hold much the same, has a message of
// its own.
//
// Every field a message holds is its domain's, from the tables below: the
// same name at the same number, of the same type, with the same meaning,
// whichever message holds it. So a field of one meaning is one field across
// its domain, and a number is one field. `pd gen` refuses a name that is two;
// `server/domain/uses_test.go` holds every message to its domain's table and
// every field of a table to a message. A field a domain has not had takes the
// table's next number, and goes in the table. A value of one message reads as
// another of its domain, then, by number and by name -- which is what lets the
// kinds be grouped otherwise one day, once payday lets a kind move.
//
// An event keeps no sentence; one is made of this when it is read, for each
// kind, in the workspace's zone, naming the people in it as they are called
// then (`server/domain/say.go`).
//
// So a message holds what happened and nothing of anybody's: a person or a
// membership by identifier alone, never a name, an address or a number of
// theirs. A thing is held by identifier and, where a sentence says it, by what
// it was called then -- an asset's tag, a reservation's name -- which is a
// record, and nobody's. Why it was done is the event's own `reason`, in the
// words of whoever asked: nothing Rove says itself goes there.
//
// A row keeps its message as JSON and is read back by name for as long as the
// workspace keeps its history, which is longer than any build. So a message
// here is never removed, a field never removed or renamed in JSON, and a kind
// never dropped nor moved to another message; `rove/payday/past.lock` holds
// the schema to it. Adding is always fine -- a field, a kind a message takes,
// a message -- and a kind ships one release before anything writes it, so
// that the build before can say its rows.
//
// An identifier is the sixteen bytes of a `pdid`. A word out of a vocabulary
// -- a status, a role -- is a string rather than an enum, whose names a row
// would be written with too.

// The fields of each domain's events, by number: name, type, and what it is.
//
// asset.* holds, by number:
//
//    1  asset          bytes                      -- the asset
//    2  tag            string                     -- what the asset was tagged then
//    3  role           string                     -- a stewardship's role: owner | manager | custodian
//    4  party          bytes                      -- who has the role from then on; nobody, when it ended
//    5  name           string                     -- what the asset was called then
//    6  kind           string                     -- what the asset is: item | space | kit | group
//    7  count          uint32                     -- how many assets one registration made
//    8  row            bytes                      -- the time row said to have been wrong: a placement, a link, a stewardship or a fact, by its identifier's domain
//    9  key            string                     -- a field as Rove writes facts of it: status, attr.cpu
//   10  retract        bool                       -- it never held, rather than held from valid_from
//   11  valid_from     google.protobuf.Timestamp  -- when it held from, said again
//   12  set            repeated string            -- the fields set, each by its key; what each became is the event's facts
//   13  cleared        repeated string            -- the fields cleared, each by its key
//   14  to             bytes                      -- where it was put
//   15  to_tag         string                     -- what that was tagged then
//   16  mode           string                     -- how it was put there: located | installed | part
//   17  slot           string                     -- the slot it was put in
//   18  u_from         int32                      -- the first of a rack's positions it takes; zero is none
//   19  u_to           int32                      -- the last of them, inclusive
//   20  target         bytes                      -- the asset it is related to
//   21  target_tag     string                     -- what that was tagged then
//   22  relation       string                     -- how it is related: member_of | connected_to
//   23  end            bool                       -- the relation ended
//   24  required       bool                       -- the relation is one the asset needs
//
// stock.* holds, by number:
//
//    1  stock          bytes                      -- the stock
//    2  name           string                     -- what the stock was called then
//    3  delta          int64                      -- by how much it changed, signed
//    4  quantity       int64                      -- how much it began with, was moved, or was made assets of
//    5  model          bytes                      -- the model it keeps
//    6  space          bytes                      -- the space it is kept in
//    7  space_name     string                     -- what that was called then
//    8  to_space       bytes                      -- the space a quantity of it was moved to
//    9  to_space_name  string                     -- what that was called then
//
// custody.* holds, by number:
//
//    1  custody        bytes                      -- the hand-over
//    2  party          bytes                      -- who it was handed to
//    3  due            google.protobuf.Timestamp  -- when it is due back
//    4  kind           string                     -- issue | loan
//    5  lines          uint32                     -- how many lines it handed over
//    6  reservation    bytes                      -- the reservation it fulfils, when it was a pickup
//    7  asset          bytes                      -- the asset an event of its own is about
//    8  to             bytes                      -- where what came back was put
//
// count.* holds, by number:
//
//    1  count          bytes                      -- the count
//    2  name           string                     -- what the count was called
//    3  scope          bytes                      -- the space whose contents are counted
//    4  missing        uint32                     -- how many that were expected were not seen
//    5  finding        bytes                      -- the finding settled
//    6  asset          bytes                      -- the asset seen, or the finding's
//    7  resolution     string                     -- how the finding was settled: moved | lost | ignored
//    8  label          bytes                      -- the label seen
//    9  space          bytes                      -- where it was seen
//   10  code           string                     -- what was scanned
//
// bookable.* holds, by number:
//
//    1  bookable       bytes                      -- the asset's reservability
//    2  asset          bytes                      -- the asset made reservable
//    3  tag            string                     -- what the asset was tagged then
//
// reservation.* holds, by number:
//
//    1  reservation    bytes                      -- the reservation
//    2  name           string                     -- what the reservation was called then
//    3  series         bool                       -- the ones of its series from it on, with it
//    4  status         string                     -- what it is from then on: held | requested | confirmed as it was made; confirmed | requested as a hold was confirmed
//    5  party          bytes                      -- who it is for
//    6  occurrences    uint32                     -- how many times it takes place
//    7  begins_at      google.protobuf.Timestamp  -- when it begins
//    8  ends_at        google.protobuf.Timestamp  -- when it ends
//    9  asset          bytes                      -- what it takes: the one thing an event of its own is about
//   10  asset_name     string                     -- what that was called then; of the reservation's own event, the first thing it takes
//   11  override       bool                       -- taken over what was booked already, by a manager
//   12  ended          bool                       -- completed by the deployment, its time over, and by nobody who asked
//   13  from           string                     -- what it was when it expired: held | requested
//
// domain.* holds, by number:
//
//    1  domain         bytes                      -- the workspace's domain
//    2  host           string                     -- its host name
//    3  purpose        string                     -- what it is for: app | label
//    4  source         string                     -- whose it is: custom | default
//    5  failing_since  google.protobuf.Timestamp  -- since when its DNS has said no
//    6  failures       uint32                     -- how many times running it has
//    7  force          bool                       -- stopped though labels printed with it stop opening
//    8  labels         uint32                     -- how many labels printed with it stopped opening
//    9  again          bool                       -- verified again, after it lapsed
//
// invitation.* holds, by number:
//
//    1  invitation     bytes                      -- the invitation
//    2  role           string                     -- the role of the membership it makes
//    3  party          bytes                      -- the person record it names
//    4  holder         bytes                      -- the membership it made
//
// label.* holds, by number:
//
//    1  label          bytes                      -- the label
//    2  asset          bytes                      -- the asset it is on, or was taken off
//    3  tag            string                     -- what that was tagged then
//    4  void           bool                       -- voided as it came off, being damaged
//    5  batch          string                     -- what the labels printed at once were called
//    6  count          uint32                     -- how many labels were printed
//    7  assets         repeated bytes             -- the assets one was printed for each of
//
// model.* holds, by number:
//
//    1  model          bytes                      -- the maker's model
//    2  name           string                     -- what it was called then
//    3  maker          string                     -- who makes it
//
// type.* holds, by number:
//
//    1  type           bytes                      -- the type of asset
//    2  name           string                     -- what it was called then
//    3  kind           string                     -- what its assets are: item | space | kit | group
//
// party.* holds, by number:
//
//    1  party          bytes                      -- the person, team, organization or vendor
//    2  holder         bytes                      -- the membership: a login of the workspace
//    3  kind           string                     -- what the party is: person | team | org | vendor
//    4  role           string                     -- what the membership may do from then on
//    5  own            bool                       -- the member's own password, not somebody's by an administrator
//    6  by             string                     -- who said it, where no person did: succession | operator
//    7  held           uint32                     -- how many of the trail's rows a legal hold kept as they were
//
// purchase.* holds, by number:
//
//    1  purchase       bytes                      -- the purchase
//    2  name           string                     -- what it was called
//    3  total          int64                      -- what it came to, in the currency's minor unit
//    4  currency       string                     -- the currency it was priced in
//    5  lines          uint32                     -- how many lines it bought
//    6  vendor         bytes                      -- whom it was bought from
//    7  into           bytes                      -- the space what arrived was taken into
//
// work.* holds, by number:
//
//    1  work_order     bytes                      -- the work order
//    2  asset          bytes                      -- the asset worked on
//    3  name           string                     -- what the work order was called then
//    4  tag            string                     -- what the asset was tagged then
//    5  kind           string                     -- what the work is: repair | inspection | ...
//    6  status         string                     -- what it is from then on: open | scheduled | in_progress
//    7  cost           int64                      -- what it cost, in the currency's minor unit
//    8  currency       string                     -- the currency it cost in
//
// workspace.* holds, by number:
//
//    1  by             string                     -- who closed or restored it: owner | operator | deployment
//    2  destroy        google.protobuf.Timestamp  -- when it is destroyed unless it is restored
//    3  timezone       string                     -- the zone it says its own times in
//    4  currency       string                     -- the currency it prices in
//    5  no_show_minutes int32                     -- how long after a reservation begins nobody came
//    6  keep_days      uint32                     -- how long it keeps its history
//    7  keep_from      google.protobuf.Timestamp  -- from when a shorter keep_days holds
//    8  access_keep_days uint32                   -- how long it keeps its access record
//    9  access_keep_from google.protobuf.Timestamp -- from when a shorter access_keep_days holds
//   10  restore_days   uint32                     -- how long it may be restored once closed
//   11  exported_at    google.protobuf.Timestamp  -- when the export it was put back from was taken
//   12  manifest       string                     -- the digest of that export's manifest
//   13  signed_by      string                     -- the key the export was signed with
//   14  rows           uint32                     -- how many rows it held
//   15  files          uint32                     -- how many files it held
//   16  asked          string                     -- the address the export said, when the workspace is at another now
//   17  released       repeated string            -- the holds on addresses the restore took back
//   18  unlinked       uint32                     -- how many rows were put back unlinked from what this deployment has
//   19  reopened       bool                       -- it was put back open
//   20  left           map<string, uint32>        -- what of each kind was left as this deployment had it
//
// access.* holds, by number:
//
//    1  review         bytes                      -- the review
//    2  from           google.protobuf.Timestamp  -- the stretch looked over: from
//    3  to             google.protobuf.Timestamp  -- and to, exclusive
//    4  calls          uint32                     -- how many calls it held
//    5  downloads      uint32                     -- how many of them were downloads
//    6  refused        uint32                     -- how many were refused
//
// account.* holds, by number:
//
//    1  held           uint32                     -- how many of the trail's rows a legal hold kept as they were
//    2  ownerless      bool                       -- a workspace it was the last owner of had nobody to be handed to
//
// attachment.* holds, by number:
//
//    1  attachment     bytes                      -- the file
//    2  subject        bytes                      -- what it was kept for
//    3  name           string                     -- what it was called
//    4  content_type   string                     -- what it is
//    5  size           uint64                     -- how many bytes it is
//
// retention.* holds, by number:
//
//    1  before         google.protobuf.Timestamp  -- the cut: what was over before it went
//    2  placements     uint32                     -- how many of each went
//    3  links          uint32
//    4  stewardships   uint32
//    5  facts          uint32
//    6  events         uint32
//    7  reservations   uint32
//    8  custodies      uint32
//    9  counts         uint32
//   10  work_orders    uint32
//   11  stock_movements uint32
//   12  attachments    uint32

// AssetAdded is an asset registered (`asset.add`): by itself, from a stock
// converted, from a purchase received, or as one of many, each an
// `asset.add` of its own whose cause is the `asset.add_many`.
message AssetAdded {
  option (payday.event) = {kinds: "asset.add"};

  bytes asset = 1;
  string tag = 2;
  string name = 5;
  string kind = 6;
}

// AssetsAdded is many assets registered at once (`asset.add_many`, design
// 9.13, D34).
message AssetsAdded {
  option (payday.event) = {kinds: "asset.add_many"};

  uint32 count = 7;
}

// AssetMoved is an asset put somewhere from a moment on, or taken out of
// where it was (`asset.move`): `to` is nothing then, and so is the rest.
message AssetMoved {
  option (payday.event) = {kinds: "asset.move"};

  bytes asset = 1;
  string tag = 2;
  bytes to = 14;
  string to_tag = 15;
  string mode = 16;
  string slot = 17;
  int32 u_from = 18;
  int32 u_to = 19;
}

// AssetAttributesSet is what an asset is changed to from a moment on
// (`asset.set`): the fields set and the ones cleared.
message AssetAttributesSet {
  option (payday.event) = {kinds: "asset.set"};

  bytes asset = 1;
  string tag = 2;
  repeated string set = 12;
  repeated string cleared = 13;
}

// AssetAssigned is who owns or manages an asset from a moment on
// (`asset.assign`), and nobody when the role ended.
message AssetAssigned {
  option (payday.event) = {kinds: "asset.assign"};

  bytes asset = 1;
  string tag = 2;
  string role = 3;
  bytes party = 4;
}

// AssetRelated is a relation of one asset to another from a moment on, or its
// end (`asset.relate`).
message AssetRelated {
  option (payday.event) = {kinds: "asset.relate"};

  bytes asset = 1;
  string tag = 2;
  bytes target = 20;
  string target_tag = 21;
  string relation = 22;
  bool end = 23;
  bool required = 24;
}

// AssetCorrected is a time row of an asset said to have been wrong
// (`asset.correct`): it never held, or held from `valid_from`.
message AssetCorrected {
  option (payday.event) = {kinds: "asset.correct"};

  bytes asset = 1;
  string tag = 2;
  string role = 3;
  bytes row = 8;
  string key = 9;
  bool retract = 10;
  google.protobuf.Timestamp valid_from = 11;
}

// AssetVoided is an asset registered by mistake taken back (`asset.void`):
// it never was, and its rows say so.
message AssetVoided {
  option (payday.event) = {kinds: "asset.void"};

  bytes asset = 1;
  string tag = 2;
}

// StockAdded is a model kept in a space from now on (`stock.add`), with what
// was there already.
message StockAdded {
  option (payday.event) = {kinds: "stock.add"};

  bytes stock = 1;
  string name = 2;
  int64 quantity = 4;
  bytes model = 5;
  bytes space = 6;
  string space_name = 7;
}

// StockChanged is a stock changed by `delta`: received, consumed, or
// adjusted to what a count found. The three hold the same.
//
//   stock.receive  stock, name, delta
//   stock.consume  stock, name, delta
//   stock.adjust   stock, name, delta
message StockChanged {
  option (payday.event) = {
    kinds: [
      "stock.receive",
      "stock.consume",
      "stock.adjust"
    ]
  };

  bytes stock = 1;
  string name = 2;
  int64 delta = 3;
}

// StockTransferred is a quantity of a stock moved to the same model's stock
// in another space (`stock.transfer`).
message StockTransferred {
  option (payday.event) = {kinds: "stock.transfer"};

  bytes stock = 1;
  string name = 2;
  int64 quantity = 4;
  bytes to_space = 8;
  string to_space_name = 9;
}

// StockConverted is units of a stock registered as assets of their own
// (`stock.convert`), each an `asset.add` whose cause this is.
message StockConverted {
  option (payday.event) = {kinds: "stock.convert"};

  bytes stock = 1;
  string name = 2;
  int64 quantity = 4;
}

// CustodyIssued is things handed over (`custody.issue`): for keeps, or a loan
// due back. Each asset handed over is an event of its own, whose cause this
// is and which holds the asset; the hand-over's own holds no asset, and says
// how many `lines`.
message CustodyIssued {
  option (payday.event) = {kinds: "custody.issue"};

  bytes custody = 1;
  bytes party = 2;
  google.protobuf.Timestamp due = 3;
  string kind = 4;
  uint32 lines = 5;
  bytes reservation = 6;
  bytes asset = 7;
}

// CustodyAcknowledged is the receiver saying they have it
// (`custody.acknowledge`).
message CustodyAcknowledged {
  option (payday.event) = {kinds: "custody.acknowledge"};

  bytes custody = 1;
}

// CustodyExtended is a loan's due date moved (`custody.extend`).
message CustodyExtended {
  option (payday.event) = {kinds: "custody.extend"};

  bytes custody = 1;
  google.protobuf.Timestamp due = 3;
}

// CustodyReturned is some or all of what was handed over taken back
// (`custody.return`), into `to` when it says. Each asset taken back is an
// event of its own, whose cause this is and which holds the asset.
message CustodyReturned {
  option (payday.event) = {kinds: "custody.return"};

  bytes custody = 1;
  bytes asset = 7;
  bytes to = 8;
}

// CountStartedOrClosed is a count of what is under a space begun, and one
// ended. The two hold the same.
//
//   count.start  count, name, scope
//   count.close  count, name, scope
message CountStartedOrClosed {
  option (payday.event) = {
    kinds: [
      "count.start",
      "count.close"
    ]
  };

  bytes count = 1;
  string name = 2;
  bytes scope = 3;
}

// CountScanned is something a count saw, and where (`count.scan`): an asset,
// a label, or a code that named neither.
message CountScanned {
  option (payday.event) = {kinds: "count.scan"};

  bytes count = 1;
  bytes asset = 6;
  bytes label = 8;
  bytes space = 9;
  string code = 10;
}

// CountReconciled is what was expected under a count's space and not seen,
// marked missing (`count.reconcile`).
message CountReconciled {
  option (payday.event) = {kinds: "count.reconcile"};

  bytes count = 1;
  uint32 missing = 4;
}

// CountResolved is a finding settled (`count.resolve`): moved, lost or
// ignored.
message CountResolved {
  option (payday.event) = {kinds: "count.resolve"};

  bytes count = 1;
  bytes finding = 5;
  bytes asset = 6;
  string resolution = 7;
}

// BookableSaved is an asset made reservable, and how it is reserved changed:
// the one written, as made and as changed. Made, it says the asset's tag.
//
//   bookable.add     bookable, asset, tag
//   bookable.update  bookable, asset
message BookableSaved {
  option (payday.event) = {
    kinds: [
      "bookable.add",
      "bookable.update"
    ]
  };

  bytes bookable = 1;
  bytes asset = 2;
  string tag = 3;
}

// ReservationAdded is resources reserved (`reservation.add`): a hold, a
// request, or a confirmed reservation, once or as a series. Each thing it
// takes is an event of its own, whose cause this is and which holds the
// asset.
message ReservationAdded {
  option (payday.event) = {kinds: "reservation.add"};

  bytes reservation = 1;
  string status = 4;
  bytes party = 5;
  uint32 occurrences = 6;
  google.protobuf.Timestamp begins_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  bytes asset = 9;
  string asset_name = 10;
  bool override = 11;
}

// ReservationConfirmed is a hold turned into what it was held for
// (`reservation.confirm`): confirmed, or a request where an approval is
// asked.
message ReservationConfirmed {
  option (payday.event) = {kinds: "reservation.confirm"};

  bytes reservation = 1;
  string name = 2;
  string status = 4;
}

// ReservationDecided is a reservation moved on by a decision: approved,
// rejected, cancelled, checked in to, or completed -- and, with `series`, the
// ones of its series from it on with it. They hold the same, but that a
// completion the deployment made when its time was over says so (`ended`).
//
//   reservation.approve   reservation, name, series
//   reservation.reject    reservation, name, series
//   reservation.cancel    reservation, name, series
//   reservation.checkin   reservation, name, series
//   reservation.complete  reservation, name, series, ended
message ReservationDecided {
  option (payday.event) = {
    kinds: [
      "reservation.approve",
      "reservation.reject",
      "reservation.cancel",
      "reservation.checkin",
      "reservation.complete"
    ]
  };

  bytes reservation = 1;
  string name = 2;
  bool series = 3;
  bool ended = 12;
}

// ReservationReleased is a reservation the deployment let go when its time
// had passed: a hold nobody confirmed in time or a request nobody decided
// before it began, which says which it was (`from`); and one nobody came to.
//
//   reservation.expire   reservation, name, from
//   reservation.no_show  reservation, name
message ReservationReleased {
  option (payday.event) = {
    kinds: [
      "reservation.expire",
      "reservation.no_show"
    ]
  };

  bytes reservation = 1;
  string name = 2;
  string from = 13;
}

// TenantDomainAdded is a domain of the workspace's registered (`domain.add`):
// its own, or a default subdomain of the deployment's.
message TenantDomainAdded {
  option (payday.event) = {kinds: "domain.add"};

  bytes domain = 1;
  string host = 2;
  string purpose = 3;
  string source = 4;
}

// TenantDomainVerified is a domain whose DNS checked out (`domain.verify`),
// `again` when it had lapsed.
message TenantDomainVerified {
  option (payday.event) = {kinds: "domain.verify"};

  bytes domain = 1;
  string host = 2;
  string purpose = 3;
  bool again = 9;
}

// TenantDomainActivated is a domain made the one the workspace is on and its
// labels print with (`domain.activate`).
message TenantDomainActivated {
  option (payday.event) = {kinds: "domain.activate"};

  bytes domain = 1;
  string host = 2;
  string purpose = 3;
}

// TenantDomainRetired is a domain stopped (`domain.retire`): `labels` is how
// many labels printed with it stopped opening, which `force` was said for.
message TenantDomainRetired {
  option (payday.event) = {kinds: "domain.retire"};

  bytes domain = 1;
  string host = 2;
  string purpose = 3;
  bool force = 7;
  uint32 labels = 8;
}

// TenantDomainLapsed is the active domain taken out of use by the deployment
// (`domain.lapse`): its DNS said no `failures` times running, from
// `failing_since` (rove#155).
message TenantDomainLapsed {
  option (payday.event) = {kinds: "domain.lapse"};

  bytes domain = 1;
  string host = 2;
  string purpose = 3;
  google.protobuf.Timestamp failing_since = 5;
  uint32 failures = 6;
}

// InvitationAdded is somebody invited to the workspace (`invitation.add`), as
// `role` -- and as the person record `party`, when it names one.
message InvitationAdded {
  option (payday.event) = {kinds: "invitation.add"};

  bytes invitation = 1;
  string role = 2;
  bytes party = 3;
}

// InvitationAccepted is an invitation said yes to (`invitation.accept`): the
// membership `holder` made, as `role`.
message InvitationAccepted {
  option (payday.event) = {kinds: "invitation.accept"};

  bytes invitation = 1;
  string role = 2;
  bytes holder = 4;
}

// InvitationChanged is an invitation moved on with nothing to say but which
// (D30): made an account's by the code its mail carried, said no to, or taken
// back by the workspace. The three hold the same.
//
//   invitation.claim   invitation
//   invitation.deny    invitation
//   invitation.revoke  invitation
message InvitationChanged {
  option (payday.event) = {
    kinds: [
      "invitation.claim",
      "invitation.deny",
      "invitation.revoke"
    ]
  };

  bytes invitation = 1;
}

// LabelsPrinted is labels made (`label.print`): blank, or one for each of
// `assets`.
message LabelsPrinted {
  option (payday.event) = {kinds: "label.print"};

  string batch = 5;
  uint32 count = 6;
  repeated bytes assets = 7;
}

// LabelBound is a label stuck on an asset (`label.bind`).
message LabelBound {
  option (payday.event) = {kinds: "label.bind"};

  bytes label = 1;
  bytes asset = 2;
  string tag = 3;
}

// LabelUnbound is a label taken off what it was on (`label.unbind`), and
// voided when it was damaged.
message LabelUnbound {
  option (payday.event) = {kinds: "label.unbind"};

  bytes label = 1;
  bytes asset = 2;
  bool void = 4;
}

// ItemModelSaved is a maker's model kept, and changed: the one written, as
// made and as changed. Made, it says who makes it.
//
//   model.add     model, name, maker
//   model.update  model, name
message ItemModelSaved {
  option (payday.event) = {
    kinds: [
      "model.add",
      "model.update"
    ]
  };

  bytes model = 1;
  string name = 2;
  string maker = 3;
}

// AssetTypeSaved is a type of asset made, and changed: the one written, as
// made and as changed. Made, it says what its assets are.
//
//   type.add     type, name, kind
//   type.update  type, name
message AssetTypeSaved {
  option (payday.event) = {
    kinds: [
      "type.add",
      "type.update"
    ]
  };

  bytes type = 1;
  string name = 2;
  string kind = 3;
}

// PartySaved is a person, a team, an organization or a vendor kept, and its
// own fields changed: the one written, as made and as changed. Made, it says
// what the party is.
//
//   party.add     party, kind
//   party.update  party
message PartySaved {
  option (payday.event) = {
    kinds: [
      "party.add",
      "party.update"
    ]
  };

  bytes party = 1;
  string kind = 3;
}

// PartyInvited is a person given a login (`party.invite`): a membership of
// the workspace, as `role`.
message PartyInvited {
  option (payday.event) = {kinds: "party.invite"};

  bytes party = 1;
  bytes holder = 2;
  string role = 4;
}

// PartyRoleSet is what a member may do, changed (`party.role`): by somebody
// who may, or `by` the deployment.
message PartyRoleSet {
  option (payday.event) = {kinds: "party.role"};

  bytes party = 1;
  bytes holder = 2;
  string role = 4;
  string by = 6;
}

// PartyPasswordSet is a password changed (`party.password`): the member's
// own, or somebody else's by an administrator.
message PartyPasswordSet {
  option (payday.event) = {kinds: "party.password"};

  bytes party = 1;
  bytes holder = 2;
  bool own = 5;
}

// PartyDeactivated is a login ended, the person and their history kept
// (`party.deactivate`).
message PartyDeactivated {
  option (payday.event) = {kinds: "party.deactivate"};

  bytes party = 1;
  bytes holder = 2;
}

// PartyPseudonymized is a person forgotten in the workspace
// (`party.pseudonymize`), whom it names nowhere.
message PartyPseudonymized {
  option (payday.event) = {kinds: "party.pseudonymize"};

  uint32 held = 7;
}

// PurchaseAdded is a purchase recorded with what was bought in it
// (`purchase.add`).
message PurchaseAdded {
  option (payday.event) = {kinds: "purchase.add"};

  bytes purchase = 1;
  string name = 2;
  int64 total = 3;
  string currency = 4;
  uint32 lines = 5;
  bytes vendor = 6;
}

// PurchaseReceived is what arrived of a purchase taken in, into a space
// (`purchase.receive`): each asset it made an `asset.add` whose cause this
// is.
message PurchaseReceived {
  option (payday.event) = {kinds: "purchase.receive"};

  bytes purchase = 1;
  string name = 2;
  bytes into = 7;
}

// WorkOrderSaved is work on an asset opened, and changed: the one written, as
// opened and as changed -- its status, when it was moved to another. Opened,
// it says the asset's tag and what the work is.
//
//   work.open    work_order, asset, name, tag, kind, status
//   work.update  work_order, asset, name, status
message WorkOrderSaved {
  option (payday.event) = {
    kinds: [
      "work.open",
      "work.update"
    ]
  };

  bytes work_order = 1;
  bytes asset = 2;
  string name = 3;
  string tag = 4;
  string kind = 5;
  string status = 6;
}

// WorkOrderFinished is a work order finished: completed, and what it cost; or
// called off.
//
//   work.done       work_order, asset, name, cost, currency
//   work.cancelled  work_order, asset, name
message WorkOrderFinished {
  option (payday.event) = {
    kinds: [
      "work.done",
      "work.cancelled"
    ]
  };

  bytes work_order = 1;
  bytes asset = 2;
  string name = 3;
  int64 cost = 7;
  string currency = 8;
}

// WorkspaceClosed is the workspace closed (`workspace.close`, D29) `by` its
// owner, an operator, or the deployment when nobody was left in it; and when
// it is destroyed unless it is restored.
message WorkspaceClosed {
  option (payday.event) = {kinds: "workspace.close"};

  string by = 1;
  google.protobuf.Timestamp destroy = 2;
}

// WorkspaceRestored is a closed workspace opened again
// (`workspace.restore`) by its owner or an operator.
message WorkspaceRestored {
  option (payday.event) = {kinds: "workspace.restore"};

  string by = 1;
}

// WorkspaceConfigured is what the workspace's owner said of its own settings
// (`workspace.configure`, #144, D36): only what was said, and of a window made
// shorter, from when it is.
message WorkspaceConfigured {
  option (payday.event) = {kinds: "workspace.configure"};

  string timezone = 3 [features.field_presence = EXPLICIT];
  string currency = 4 [features.field_presence = EXPLICIT];
  int32 no_show_minutes = 5 [features.field_presence = EXPLICIT];
  uint32 keep_days = 6 [features.field_presence = EXPLICIT];
  google.protobuf.Timestamp keep_from = 7;
  uint32 access_keep_days = 8 [features.field_presence = EXPLICIT];
  google.protobuf.Timestamp access_keep_from = 9;
  uint32 restore_days = 10 [features.field_presence = EXPLICIT];
}

// WorkspaceImported is a workspace put back from an export by an operator
// (`workspace.import`, D34): which export, signed by which key, what it held,
// and what of it could not be put back as it was.
message WorkspaceImported {
  option (payday.event) = {kinds: "workspace.import"};

  google.protobuf.Timestamp exported_at = 11;
  string manifest = 12;
  string signed_by = 13;
  uint32 rows = 14;
  uint32 files = 15;
  string asked = 16;
  repeated string released = 17;
  uint32 unlinked = 18;
  bool reopened = 19;
  map<string, uint32> left = 20;
}

// AccessReviewed is a stretch of the workspace's access record looked over
// (`access.review`, rove#136), and what it held then.
message AccessReviewed {
  option (payday.event) = {kinds: "access.review"};

  bytes review = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  uint32 calls = 4;
  uint32 downloads = 5;
  uint32 refused = 6;
}

// AccountDeparted is an account leaving the workspace (`account.depart`):
// pseudonymized as a person forgotten is, and a workspace whose last owner it
// was handed on -- or `ownerless`, with nobody to hand it to.
message AccountDeparted {
  option (payday.event) = {kinds: "account.depart"};

  uint32 held = 1;
  bool ownerless = 2;
}

// AttachmentAdded is a file kept for something (`attachment.add`): an asset,
// a hand-over, a work order, a purchase, a count's finding.
message AttachmentAdded {
  option (payday.event) = {kinds: "attachment.add"};

  bytes attachment = 1;
  bytes subject = 2;
  string name = 3;
  string content_type = 4;
  uint64 size = 5;
}

// RetentionExpired is what the workspace's keep window no longer reached,
// taken (`retention.expired`, design 8.2): how many of what, and from before
// when -- never what they said.
message RetentionExpired {
  option (payday.event) = {kinds: "retention.expired"};

  google.protobuf.Timestamp before = 1;
  uint32 placements = 2;
  uint32 links = 3;
  uint32 stewardships = 4;
  uint32 facts = 5;
  uint32 events = 6;
  uint32 reservations = 7;
  uint32 custodies = 8;
  uint32 counts = 9;
  uint32 work_orders = 10;
  uint32 stock_movements = 11;
  uint32 attachments = 12;
}
