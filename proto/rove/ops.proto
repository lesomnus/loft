edition = "2023";

package rove;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "rove/payday/holder.proto";
import "rove/payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/rove";

// Notification is a message for one holder: an overdue loan, a reservation to
// approve, a stock running low.
message Notification {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // What it says, which names people as they are when it is written --
  // "{name}님이 예약을 요청했습니다" -- so it is personal (payday#92): the trail
  // records that a notice was written, and not what it said.
  string name = 5 [(payday.field) = {personal: true}];
  string desc = 6 [(payday.field) = {personal: true}];

  Holder holder = 8 [(orm.edge) = {immutable: true}];
  // custody.overdue | reservation.requested | reservation.decided | stock.low | work.due | count.finding
  string kind = 9 [(payday.field) = {personal: false}];
  bytes subject_id = 10 [(orm.field) = {
    type: TYPE_UUID
    nullable: true
  }];
  google.protobuf.Timestamp read_at = 11 [(orm.field) = {nullable: true}];
  // Where a page goes to act on it: a path, which names a thing and not a person.
  string link = 12 [(payday.field) = {personal: false}];

  // Whether it goes by mail as well: set as it is written, so that an
  // operation that is undone queues nothing, and only for the kinds that are
  // worth a mailbox (an approval asked and answered, custody overdue,
  // maintenance due). `date_mailed` is when it went, and `mail_tries` how
  // often it failed to; what is queued and not yet sent is sent by
  // `domain.Mailer`, outside every operation.
  bool mail = 16;
  google.protobuf.Timestamp date_mailed = 17 [(orm.field) = {nullable: true}];
  uint32 mail_tries = 18;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]
      },
      {
        name: "holder"
        refs: [{name: "holder", number: 8}, {name: "date_created", number: 15}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 36
    erase: {hard: {}}
    tenanted: {via: "tenant", agrees: ["holder.tenant"]}
    list: {
      order: [{field: {name: "date_created"}, desc: true}, {field: {name: "id"}, desc: true}]
      by: [{name: "ref"}, {name: "holder"}, {name: "kind"}]
      size: 50
      max: 200
    }
  };
}

// UsageSnapshot is one tenant's usage on one day (design 7.1).
message UsageSnapshot {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // YYYY-MM-DD, UTC.
  string day = 8;
  map<string, string> metrics = 9;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]
      },
      {
        name: "day"
        refs: [{name: "tenant", number: 2}, {name: "day", number: 8}]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 20
    erase: {hard: {}}
    list: {
      order: [{field: {name: "date_created"}, desc: true}, {field: {name: "id"}, desc: true}]
      by: [{name: "ref"}, {name: "day"}]
      size: 31
      max: 400
    }
  };
}


// TenantContract is what a tenant's contract says about its history: how far
// back it may look, how long its history and its access record are kept, and
// how long it may be restored once closed (design 8, #144).
//
// The operator's, and the tenant's to read: no role may write one, and the
// operator's path does (`rove contract`). Not fields on Tenant, because a
// tenant's own people write that row, and because a contract has a time
// dimension -- a plan changes on the first of the month, a downgrade waits out
// its grace -- which a row per change states and a field cannot.
//
// The one in force is the latest whose `date_effective` has come. What the
// windows are now, grace included, is `server/retention`.
message TenantContract {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // The plan, as the people reading it call it: "free", "pro", an agreement's
  // number.
  string name = 5;
  string desc = 6;

  // How far back the tenant may look at its history, in days. 0 is all of it.
  // It shrinks the moment a contract says so.
  uint32 view_days = 8;

  // How long its history is kept at all, in days. 0 is forever. Only the
  // operator's switch, `app.retention.apply`, lets this destroy anything.
  uint32 keep_days = 9;

  // How long a shorter `keep_days` waits before it applies, in days: the
  // contract before this one keeps its history for that long, so a plan that
  // comes back in time has lost nothing.
  uint32 grace_days = 10;

  // From when this one applies. Unsaid is now.
  google.protobuf.Timestamp date_effective = 11 [(orm.field) = {default: ""}];

  // How long the access record -- who read, wrote or took out whose data in
  // the workspace -- is kept, in days (rove#136, #144). 0 is the deployment's
  // `audit.by.access`. A shorter one waits out the grace as `keep_days` does,
  // and none goes below the deployment's floor, `audit.by.access.min`, which
  // it is raised to: the floor is what the law the deployment is under asks.
  uint32 access_keep_days = 12 [(orm.field) = {default: ""}];

  // How long the workspace may be restored once it is closed, in days, before
  // it is destroyed (D29). 0 is the deployment's
  // `app.workspaces.restore_within`. Read when it is closed: what the date of
  // its destruction is then is what its owner is told.
  uint32 restore_days = 16 [(orm.field) = {default: ""}];

  // Whether the workspace's trail goes whole when it is destroyed, what the
  // deployment's floors (`audit.min`, `audit.by.<kind>.min`) are still on with
  // it (payday's `PurgeTenant`): for a workspace under a law or an agreement
  // that asks for that, which the floors were not set for. Unset, it retires
  // (`RetireTenant`, payday#115): what a floor is still on stays -- the access
  // record PIPA has a processor keep for a year, whoever's data it was -- until
  // the floor has passed, and the rest goes when the workspace does. One that
  // purges waits out the grace of the contract before it, as a shorter
  // `keep_days` does. Read when the workspace is destroyed.
  bool purge_floors = 17 [(orm.field) = {default: ""}];

  // Withdrawn, for a change that was a mistake. A contract in force is
  // replaced by a newer one rather than taken back.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "effective"
        refs: [{name: "tenant", number: 2}, {name: "date_effective", number: 11}, {name: "id", number: 1}]
      }
    ]
  };
  option (payday.entity) = {
    domain: 39
    list: {
      order: [{field: {name: "date_effective"}, desc: true}, {field: {name: "id"}, desc: true}]
      by: [{name: "ref"}]
      size: 20
      max: 100
    }
  };
}


// LegalHold is a legal hold on a tenant's history: while one is on, nothing of
// it is destroyed -- rove's history, and the trail, which payday holds from the
// same answer (payday#35).
//
// The operator's, like the contract, and the tenant's people who run it may
// read it. Placed and lifted, never edited: a hold is evidence of its own, and
// what it says is when it began, why, and when it ended.
message LegalHold {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // What it is for: a case, a demand, an agreement.
  string name = 5;
  string desc = 6;

  // When it was lifted. Unset is a hold that is on.
  google.protobuf.Timestamp date_lifted = 8 [(orm.field) = {nullable: true}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      // The order its list reads in, the tenant first (#122).
      {name: "page", refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]}
    ]
  };
  option (payday.entity) = {
    domain: 40
    erase: {hard: {}}
    list: {
      order: [{field: {name: "date_created"}, desc: true}, {field: {name: "id"}, desc: true}]
      by: [{name: "ref"}]
      size: 20
      max: 100
    }
  };
}


// AccessReview is that a stretch of the workspace's access record was
// reviewed (rove#136): who looked it over, when, what it held then, and what
// they found. PIPA's safety measures have a processor review its access
// record every month, and check what each download was for; this is how the
// workspace shows it did.
//
// The domain's Add writes it, which says who and counts what the stretch
// held. Nothing changes one after, and none is erased: a review is the
// evidence of itself, and goes with its workspace.
message AccessReview {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // What the reviewer found, in their words.
  string desc = 6 [(orm.field) = {immutable: true}];

  // The stretch of the record it covers, from `period_from` and before
  // `period_to`: a month, as the page reviews it.
  google.protobuf.Timestamp period_from = 8 [(orm.field) = {immutable: true, default: ""}];
  google.protobuf.Timestamp period_to = 9 [(orm.field) = {immutable: true, default: ""}];

  // Who reviewed it: the membership, as the trail names its actor.
  Holder reviewer = 10 [(orm.edge) = {immutable: true}];

  // What the stretch held when it was reviewed: every call that carried
  // somebody's data, the downloads among them, and the calls refused.
  uint32 calls = 11 [(orm.field) = {immutable: true}];
  uint32 downloads = 12 [(orm.field) = {immutable: true}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  uint32 refused = 16 [(orm.field) = {immutable: true}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      // The order its list reads in, the tenant first (#122).
      {name: "page", refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]}
    ]
  };
  option (payday.entity) = {
    domain: 47
    erase: {hard: {}}
    list: {
      order: [{field: {name: "date_created"}, desc: true}, {field: {name: "id"}, desc: true}]
      size: 20
      max: 100
    }
  };
}
