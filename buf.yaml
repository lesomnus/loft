version: v2
modules:
  - path: ./proto
    excludes:
      # The overlays: what this app adds to a generated contract. They are
      # fragments rather than files that compile -- a message in one names
      # types that exist only after the merge -- so buf must not read them.
      # `pd gen` hands them to protobuf-merge by path.
      - proto/ext
deps:
  # payday's own: the `(payday.entity)` option every entity carries, and the
  # batch service. It is the `dev` label rather than a version because payday
  # has no users yet -- pin a commit when it does.
  - buf.build/payday/payday:dev
  - buf.build/orm/orm
  - buf.build/patch/patch
lint:
  use:
    - STANDARD
  except:
    # The service contracts are generated from the entities: a request is named
    # after the entity it is about and the answer is the entity itself. That is
    # the shape of the whole stack, and it is not what buf expects of a service
    # somebody wrote by hand.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY
breaking:
  use:
    - FILE
  # One change, on purpose (the owner's word of 2026-11-08, D76): every time
  # Loft keeps is a `date_*`, as payday names its own -- `begins_at` is
  # `date_start`, `due_at` `date_due`, `at` `date_occurred`. `buf breaking`
  # reads that as every field renamed (FIELD_SAME_NAME) and, but for the
  # events', its JSON name with it (FIELD_SAME_JSON_NAME), and nothing else:
  # each keeps its number and type, so the binary wire is as it was, and the
  # JSON wire is the new names. An event keeps the JSON name its rows were
  # written under (`json_name`), which the past's lock holds.
  #
  # This comes out with the next change to the schema, once main has the
  # rename: left in, it is a hole in the check for whatever that change
  # renames. The rename from rove's (2026-10-31) came out with this one.
  ignore_only:
    FIELD_SAME_NAME:
      - proto/loft/account.proto
      - proto/loft/asset.proto
      - proto/loft/asset_svc.g.proto
      - proto/loft/billing.proto
      - proto/loft/booking.proto
      - proto/loft/booking_svc.g.proto
      - proto/loft/count.proto
      - proto/loft/count_svc.g.proto
      - proto/loft/custody.proto
      - proto/loft/custody_svc.g.proto
      - proto/loft/history.proto
      - proto/loft/history_svc.g.proto
      - proto/loft/operator.proto
      - proto/loft/ops.proto
      - proto/loft/ops_svc.g.proto
      - proto/loft/past.proto
      - proto/loft/payday/access_svc.g.proto
      - proto/loft/payday/tenant_svc.g.proto
      - proto/loft/stock.proto
      - proto/loft/stock_svc.g.proto
      - proto/loft/work.proto
      - proto/loft/work_svc.g.proto
    FIELD_SAME_JSON_NAME:
      - proto/loft/account.proto
      - proto/loft/asset.proto
      - proto/loft/asset_svc.g.proto
      - proto/loft/billing.proto
      - proto/loft/booking.proto
      - proto/loft/booking_svc.g.proto
      - proto/loft/count.proto
      - proto/loft/count_svc.g.proto
      - proto/loft/custody.proto
      - proto/loft/custody_svc.g.proto
      - proto/loft/history.proto
      - proto/loft/history_svc.g.proto
      - proto/loft/operator.proto
      - proto/loft/ops.proto
      - proto/loft/ops_svc.g.proto
      - proto/loft/payday/access_svc.g.proto
      - proto/loft/payday/tenant_svc.g.proto
      - proto/loft/stock.proto
      - proto/loft/stock_svc.g.proto
      - proto/loft/work.proto
      - proto/loft/work_svc.g.proto
