# Where a front's certificates and its ACME account are kept: what it took is
# what it serves after a restart, rather than asking Let's Encrypt again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rove-edge
  labels:
    app.kubernetes.io/name: rove-edge
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# What the front asks before it takes a certificate: the operator's entry
# point's ask, on a port of its own, and nothing else of it.
apiVersion: v1
kind: Service
metadata:
  name: rove-ask
  labels:
    app.kubernetes.io/name: rove
spec:
  selector:
    app.kubernetes.io/name: rove
    app.kubernetes.io/component: server
  ports:
    - { name: ask, port: 8082, targetPort: ask }
---
# What the front reaches of the server: the HTTP listener, as the ingress
# does, and the ask, which nothing else reaches.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rove-edge
  labels:
    app.kubernetes.io/name: rove-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rove
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rove-edge
      ports:
        - { port: http }
        - { port: ask }
---
# The front, as the internet reaches it: the address workspaces' domains
# point at, by `app.labels.target` (README.md).
apiVersion: v1
kind: Service
metadata:
  name: rove-edge
  labels:
    app.kubernetes.io/name: rove-edge
spec:
  type: LoadBalancer
  # The address a browser came from is the one the front sees, and says on
  # to the server in X-Forwarded-For: a node that forwarded it would be in
  # its place.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: rove-edge
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rove-edge
  labels:
    app.kubernetes.io/name: rove-edge
spec:
  # One, and replaced rather than rolled: its volume is one node's.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rove-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rove-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy
          command: ["caddy"]
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The image's binary carries the capability to bind a low port,
            # which it cannot run without; it listens on high ones all the
            # same.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - name: caddyfile
          configMap: { name: rove-edge }
        - name: data
          persistentVolumeClaim: { claimName: rove-edge }
        # What Caddy writes of its own running configuration.
        - name: config
          emptyDir: {}
