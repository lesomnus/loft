# Rove in one pod: the server, the operator's entry point beside it, and the
# migration that runs before either. README.md says why it is one pod and
# what it takes to be more.

# Storage. No `storageClassName`, so a cluster's default is used; an overlay
# names one, and its size.
#
# ReadWriteOnce, which is what every cluster has, and why everything that
# writes these is in the one pod below: a second pod on another node could not
# mount them. Two or more servers want the files and the trail somewhere every
# node reaches -- S3 (rove#45), or a ReadWriteMany class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rove-files
  labels:
    app.kubernetes.io/name: rove
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# The trail's archive, which is evidence: what a pass moves out of the
# database is only here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rove-audit
  labels:
    app.kubernetes.io/name: rove
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# Its checkpoints, on a volume of their own, so that a class that refuses
# deletion can be given to them alone (`docs/runbook/trail-integrity.md`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rove-checkpoints
  labels:
    app.kubernetes.io/name: rove
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# What an ingress routes a host to: the page, the API it calls, the files and
# the labels, all on the one HTTP listener. The operator's entry point has no
# Service at all.
apiVersion: v1
kind: Service
metadata:
  name: rove
  labels:
    app.kubernetes.io/name: rove
spec:
  selector:
    app.kubernetes.io/name: rove
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# What reaches the pod over the network: the HTTP listener, and nothing else.
# Not gRPC, and not the operator's entry point, which `kubectl port-forward`
# reaches without the network (README.md).
#
# From anywhere, here. An overlay narrows `from` to its ingress controller, and
# has to before `app.trusted_proxies` may name the cluster's pod network: a
# pod that can reach the server directly can say any X-Forwarded-For it likes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rove
  labels:
    app.kubernetes.io/name: rove
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rove
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rove
  labels:
    app.kubernetes.io/name: rove
    app.kubernetes.io/component: server
spec:
  # One, and replaced rather than rolled: the volumes are one node's, and the
  # pod before is gone before this one migrates, so no build serves a schema
  # it did not expect (README.md, "새 버전").
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: rove
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rove
        app.kubernetes.io/component: server
    spec:
      # Nothing here asks the Kubernetes API, so no credential for it is in
      # the pod.
      automountServiceAccountToken: false
      # **No service-link variables.** Kubernetes would hand every process
      # one set per Service in the namespace, named for the Service -- and a
      # Service called `rove` or `rove-db` makes them `ROVE_PORT`,
      # `ROVE_DB_PORT`: the prefix this reads its configuration from.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # What makes a fresh volume writable by that user.
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      # The tables brought into this build's shape, before anything serves.
      # Only the databases: `rove migrate` opens no file, trail or key, so
      # none of the volumes are mounted here.
      initContainers:
        - name: migrate
          image: ghcr.io/lesomnus/rove
          args: ["--config", "/etc/rove/rove.yaml", "migrate"]
          env:
            - name: ROVE_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: db-dsn } }
            - name: ROVE_AUTH_ROSTER_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: roster-db-dsn } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/rove, readOnly: true }
            - { name: tmp, mountPath: /tmp }

      containers:
        - name: rove
          image: ghcr.io/lesomnus/rove
          args: ["--config", "/etc/rove/rove.yaml", "serve"]
          env:
            - name: ROVE_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: db-dsn } }
            - name: ROVE_AUTH_ROSTER_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: roster-db-dsn } }
            # What download links are signed with: one for every process.
            - name: ROVE_APP_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: rove, key: signing-key } }
            - name: ROVE_APP_MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: rove, key: mail-password, optional: true } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/rove, readOnly: true }
            - { name: files, mountPath: /var/lib/rove/files }
            - { name: audit, mountPath: /var/lib/rove/audit }
            - { name: checkpoints, mountPath: /var/lib/rove/checkpoints }
            - { name: keys, mountPath: /run/secrets/rove, readOnly: true }
            - { name: tmp, mountPath: /tmp }

        # The operator's entry point, here rather than in a Deployment of its
        # own because it opens what the server opens -- the files, the trail,
        # its key -- and on ReadWriteOnce only a pod on the same node can. The
        # operators' keys are mounted in it and in nothing else.
        - name: rove-admin
          image: ghcr.io/lesomnus/rove
          command: ["/usr/local/bin/rove-admin"]
          args: ["--config", "/etc/rove/rove.yaml", "serve"]
          env:
            - name: ROVE_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: db-dsn } }
            - name: ROVE_AUTH_ROSTER_DB_DSN
              valueFrom: { secretKeyRef: { name: rove, key: roster-db-dsn } }
            - name: ROVE_APP_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: rove, key: signing-key } }
            - name: ROVE_APP_MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: rove, key: mail-password, optional: true } }
          ports:
            - { name: admin, containerPort: 8081 }
          # Listening, which is all that can be asked of it without a key.
          readinessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/rove, readOnly: true }
            - { name: files, mountPath: /var/lib/rove/files }
            - { name: audit, mountPath: /var/lib/rove/audit }
            - { name: checkpoints, mountPath: /var/lib/rove/checkpoints }
            - { name: keys, mountPath: /run/secrets/rove, readOnly: true }
            - { name: operators, mountPath: /run/secrets/rove-admin, readOnly: true }
            - { name: tmp, mountPath: /tmp }

      volumes:
        - name: config
          configMap: { name: rove }
        - name: files
          persistentVolumeClaim: { claimName: rove-files }
        - name: audit
          persistentVolumeClaim: { claimName: rove-audit }
        - name: checkpoints
          persistentVolumeClaim: { claimName: rove-checkpoints }
        # The key the trail is signed with, `checkpoints.pem`.
        - name: keys
          secret: { secretName: rove-checkpoints, defaultMode: 288 } # 0440: the pod's group reads it
        # A file per operator, named as `admin.keys` names them.
        - name: operators
          secret: { secretName: rove-admin, defaultMode: 288 }
        # Somewhere writable, since the root is not.
        - name: tmp
          emptyDir: {}
