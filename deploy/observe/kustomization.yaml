# Grafana over what the collectors keep -- ClickHouse's OpenTelemetry tables
# -- and a collector in the cluster for what Kubernetes and the platform say
# (loft#38). The ClickHouse (./clickhouse) and the collector on every node
# (./node) are what a deployment without its own adds. README.md says what
# an overlay brings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace: an overlay chooses one.
resources:
  - ./grafana.yaml
  - ./collector.yaml

configMapGenerator:
  # Where the data is. An overlay replaces it with its own
  # (`behavior: replace`), starting from this one.
  - name: grafana-datasources
    files:
      - datasources.yaml
  # What `dashboards/gen.py` writes. A changed dashboard is a new pod.
  - name: grafana-dashboards
    files:
      - dashboards/loft-service.json
      - dashboards/loft-platform.json
