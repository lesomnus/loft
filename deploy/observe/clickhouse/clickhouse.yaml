# One ClickHouse, for what the node collectors write (../node) and Grafana
# reads (../grafana.yaml): the OpenTelemetry tables in `otel`, which the
# collectors make themselves. One node, one volume; nothing here is a copy
# of anything, and nothing restores it -- it is the last 30 days of
# telemetry, and starts again empty if lost.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - { name: native, port: 9000, targetPort: native }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Not beside the control plane, where there is a choice. An overlay
      # whose volume is a node's own (local-path) names the node.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      # Time to finish what it was writing.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clickhouse
          # The long-term-support line, without a shell (distroless).
          image: docker.io/clickhouse/clickhouse-server:26.8.36.3-distroless@sha256:d149c739994af7d3687b05ce3111b6a748e0f17702c80b52a93c0161a439a091
          env:
            # The accounts are users.xml's; the image makes none of its own.
            - { name: CLICKHOUSE_SKIP_USER_SETUP, value: "1" }
            - name: CLICKHOUSE_OTEL_PASSWORD
              valueFrom: { secretKeyRef: { name: clickhouse, key: otel-password } }
            # What Grafana signs in with, from Grafana's own Secret.
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana, key: clickhouse-password } }
          ports:
            - { name: native, containerPort: 9000 }
            - { name: http, containerPort: 8123 }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            failureThreshold: 4
          # The server takes three quarters of the limit for itself
          # (config.xml) and refuses a query before it goes past.
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d, readOnly: true }
            - { name: users, mountPath: /etc/clickhouse-server/users.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
            items: [{ key: config.xml, path: loft.xml }]
        - name: users
          configMap:
            name: clickhouse-users
            items: [{ key: users.xml, path: loft.xml }]
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  # Bounded by the tables' TTL, not by this: local-path does not hold a
  # volume to its size. 30 days of a small deployment is a few GiB.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
# Who reaches it: Grafana, beside it, and the node collectors, in their own
# namespace -- `observe-node`, as README.md names it; an overlay that names
# another says so here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observe-node }
          podSelector:
            matchLabels: { app.kubernetes.io/name: otel-node-collector }
      ports:
        - { port: native }
