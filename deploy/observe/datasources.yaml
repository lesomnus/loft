# Grafana's data source, by the uid the dashboards name: the ClickHouse in
# ./clickhouse, beside Grafana, which the node collectors (./node) write in
# its `otel` database. An overlay with a ClickHouse of its own replaces this
# file with that one's address and account. The password comes from the
# Secret `grafana` as CLICKHOUSE_PASSWORD.
apiVersion: 1
datasources:
  # Through an account that can only read (`readonly=2`: SELECT and the
  # per-query SET the plugin needs).
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: grafana
      defaultDatabase: otel
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD

# What this file provisioned before and does not now: Grafana keeps a data
# source its files no longer name until told to forget it.
deleteDatasources:
  - { name: Loki, orgId: 1 }
