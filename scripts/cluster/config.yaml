# `deploy/k8s/config.yaml` with the rig's answers: where it is opened, and the
# proxy in front. Everything else is as the base says, so that what the rig
# runs is what a deployment starts from.

db:
  driver: pgx
  migrate: false

server:
  addr: ":50051"
  max_recv_msg_size: 33554432
  http:
    addr: ":8080"
    allow_web: true
    origins: []

watch:
  broker: postgres
spin:
  lease: postgres

auth:
  roster:
    db:
      driver: pgx

app:
  public_url: https://loft.localhost
  # k3s's pod network, which only Traefik's pods may reach the server from
  # (the NetworkPolicy patch in `kustomization.yaml`).
  trusted_proxies: [10.42.0.0/16]
  files: /var/lib/loft/files
  csp: report-only

audit:
  archive: /var/lib/loft/audit
  checkpoints:
    dir: /var/lib/loft/checkpoints
    write_once: true
    key: /run/secrets/loft/checkpoints.pem
    # The base's `log:`, and the store the `witness/` component mounts.
    witnesses: ["log:", "store:/var/lib/loft/witness"]
  # The base's window on the access record, without which no pass runs and so
  # no checkpoint is taken -- and the rig asks what the store heard of one.
  by:
    access:
      profile: pipa-sensitive
      min:
        profile: pipa

admin:
  addr: 0.0.0.0:8081
  keys:
    operator: file:/run/secrets/loft-admin/operator
